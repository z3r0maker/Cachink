<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/cachink-design-system-890cd1ee-0432-48be-9c4c-478a6b781e00/colors_and_type.css">
<script src="_ds/cachink-design-system-890cd1ee-0432-48be-9c4c-478a6b781e00/_ds_bundle.js"></script>
<style>
@keyframes xg-pulse{0%,100%{opacity:1}50%{opacity:0.45}}
[data-press]{transition:transform 100ms cubic-bezier(0.2,0.8,0.2,1),box-shadow 100ms cubic-bezier(0.2,0.8,0.2,1);}
[data-press]:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--black);}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>

<div style="font-family:var(--font-sans);color:var(--ink);">

  <sc-if value="{{ isLoading }}" hint-placeholder-val="{{ true }}">
    <div style="border:2.5px solid var(--black);border-radius:18px;background:var(--white);box-shadow:5px 5px 0 var(--black);overflow:hidden;">
      <div style="display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--gray-100);border-bottom:2.5px solid var(--black);">
        <span style="width:16px;height:16px;border:2px solid var(--black);border-radius:9999px;background:var(--yellow);animation:xg-pulse 1.1s ease-in-out infinite;"></span>
        <span style="font-size:12px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--gray-600);">Cargando…</span>
      </div>
      <sc-for list="{{ skeleton }}" as="s" hint-placeholder-count="5">
        <div style="display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:{{ s.divider }}">
          <span style="flex:none;width:42px;height:42px;border:2px solid var(--gray-200);border-radius:12px;background:var(--gray-100);"></span>
          <span style="flex:1;min-width:0;height:16px;border-radius:8px;background:var(--gray-100);"></span>
          <span style="flex:none;width:84px;height:16px;border-radius:8px;background:var(--gray-100);"></span>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
    <div style="padding:52px 24px;border:2.5px solid var(--black);border-radius:18px;background:var(--white);box-shadow:5px 5px 0 var(--black);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;">
      <div style="width:62px;height:62px;border:2.5px solid var(--black);border-radius:17px;background:var(--yellow-soft);display:grid;place-items:center;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--black)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="{{ icon }}"></path></svg>
      </div>
      <div style="font-size:20px;font-weight:800;letter-spacing:-0.02em;color:var(--black);text-wrap:pretty;">{{ emptyTitle }}</div>
      <div style="font-size:15px;font-weight:600;color:var(--gray-600);max-width:440px;text-wrap:pretty;">{{ emptyBody }}</div>
      <sc-if value="{{ href }}" hint-placeholder-val="{{ false }}">
        <a href="{{ href }}" data-press="1" style="margin-top:6px;display:inline-flex;align-items:center;height:52px;padding:0 22px;border:2.5px solid var(--black);border-radius:14px;background:var(--yellow);box-shadow:4px 4px 0 var(--black);font-size:13px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--black);text-decoration:none;">{{ cta }}</a>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}">
    <div style="padding:44px 24px;border:2.5px solid var(--black);border-radius:18px;background:var(--red-soft);box-shadow:5px 5px 0 var(--black);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;">
      <div style="width:62px;height:62px;border:2.5px solid var(--black);border-radius:17px;background:var(--white);display:grid;place-items:center;color:var(--red-text);">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v4M12 16h.01"></path></svg>
      </div>
      <div style="font-size:20px;font-weight:800;letter-spacing:-0.02em;color:var(--black);text-wrap:pretty;">{{ errorTitle }}</div>
      <div style="font-size:15px;font-weight:600;color:var(--ink);max-width:440px;text-wrap:pretty;">Lo que capturaste no se pierde: sigue guardado en este dispositivo. Vuelve a intentar en un momento.</div>
      <button type="button" onClick="{{ retry }}" data-press="1" style="margin-top:6px;height:52px;padding:0 22px;border:2.5px solid var(--black);border-radius:14px;background:var(--white);box-shadow:4px 4px 0 var(--black);font-family:inherit;font-size:13px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--black);cursor:pointer;">Reintentar</button>
    </div>
  </sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:360},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;loading&quot;,&quot;empty&quot;,&quot;error&quot;],&quot;default&quot;:&quot;empty&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;emptyTitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Nada por aquí todavía&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;emptyBody&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;En cuanto captures algo, aparece en esta lista.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;errorTitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;No pudimos cargar esta lista&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icon&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;retry&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const mode = p.mode ?? 'loading';
    return {
      isLoading: mode === 'loading',
      isEmpty: mode === 'empty',
      isError: mode === 'error',
      skeleton: [1, 2, 3, 4, 5].map((n, i, a) => ({ divider: i === a.length - 1 ? 'none' : '2px solid var(--gray-100)' })),
      icon: p.icon ?? 'M3 6h2l2.4 10.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.5L21 9H6',
      emptyTitle: p.emptyTitle ?? 'Nada por aquí todavía',
      emptyBody: p.emptyBody ?? 'En cuanto captures algo, aparece en esta lista.',
      errorTitle: p.errorTitle ?? 'No pudimos cargar esta lista',
      cta: p.cta ?? '',
      href: p.cta ? (p.href ?? '') : '',
      retry: p.retry ?? (() => { })
    };
  }
}

</script>
</body>
</html>
