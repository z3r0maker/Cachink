# CI gate for every PR and for pushes to main (ADR-055; docs/plan/01-foundation.md F-08).
#
# Blocking: typecheck (turbo builds referenced packages first), unit tests,
# root script tests, lint, and prettier's format:check (F-09 cleared the
# pre-existing debt on 2026-09-11).
#
# "Lint" is two things, and both matter. `pnpm lint` runs the per-package tasks
# plus `lint:root` for what is not a workspace. "Root script tests" includes
# `scripts/lint-coverage.test.ts`, which asserts that every tracked TypeScript
# file is actually reachable by one of those tasks — a green lint over a
# partial file set is what this workflow shipped until 2026-09-17 (F-08).
#
# The `db` job exists because the same failure had a second form: the 14 RLS
# and query assertions in `packages/data-pg` self-skipped without a
# DATABASE_URL, and this workflow never set one — so they reported as "skipped"
# beside 22 green drift tests for as long as the package existed.
# `scripts/integration-coverage.test.ts` (run by the `ci` job, which needs no
# database to prove another job has one) asserts from this file that every
# integration suite really runs against Postgres.
#
# Branch protection: require the checks named "ci", "db", "portal-e2e" and
# "backoffice-e2e".

name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for every job (SEC-SUP-01): read the code, nothing else. A
# job that needs more asks for it by name.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # SEC-SUP-01 (N-26): a high or critical advisory that can reach users fails
  # the build (`scripts/audit-gate.ts`), and no new commit may add a secret.
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (runtime paths only, reviewed allowlist)
        run: pnpm audit:gate

      - name: Secret scan (the commits this run adds)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="$BASE..HEAD"
          fi
          mkdir -p gitleaks-report
          # `--verbose` is what makes a failure name itself: without it the log
          # says only `leaks found: N`, with no rule, file or line — `--redact`
          # was never the reason. `--redact=80` keeps the finding block while
          # showing only the first fifth of the value, so a public log never
          # publishes the whole secret, and the JSON report (redacted the same
          # way) is uploaded so the fingerprints survive the run.
          docker run --rm -v "$PWD:/repo" -v "$PWD/gitleaks-report:/report" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --log-opts="$RANGE" --config /repo/.gitleaks.toml \
            --no-banner --no-color --verbose --redact=80 \
            --report-format json --report-path /report/leaks.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ failure() }}
        with:
          name: gitleaks-report
          path: gitleaks-report/leaks.json

  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # Version comes from package.json#packageManager.

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Typecheck (builds referenced packages first)
        run: pnpm typecheck

      # Includes apps/landing, whose `test` is its production build + prerender
      # smoke assertions (ADR-084) — the marketing site's build gate.
      - name: Unit tests
        run: pnpm test

      - name: Root script tests
        run: pnpm test:scripts

      - name: Lint
        run: pnpm lint

      # No plan names, prices, upgrade prompts or portal links in the phone's
      # copy (ADR-069, N-32): the app is an employee tool, selling happens on
      # the web.
      - name: Store compliance
        run: pnpm lint:store

      - name: Format check
        run: pnpm format:check

  # The Supabase edge functions run on Deno, so Deno checks them (ADR-080). The
  # repo's ESLint, tsc and Vitest also cover them (F-10); this is the runtime's
  # own view — its real Supabase types and its lint rules.
  edge-functions:
    name: edge-functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: deno check + lint (bug-report)
        working-directory: supabase/functions/bug-report
        run: deno check index.ts && deno lint

  # Integration tests against a real Postgres.
  #
  # The service container owns the lifecycle (its `pg_isready` health gate
  # replaces a hand-rolled poll); `db-local.sh` owns the contents, so a laptop
  # and this runner apply byte-identical SQL in the same order from one place.
  #
  # Port 55432, not 5432, so `db-local.sh url` — the single place the app-role
  # connection string is written down — is correct here unchanged.
  db:
    name: db
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: xangarro
          POSTGRES_DB: xangarro
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xangarro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `local/*.sql` (the Supabase compat layer) then `drizzle/*.sql`. The
      # compat layer creates `xangarro_app`, which the migrations grant to.
      - name: Apply the compat layer and the migrations
        run: pnpm --filter @xangarro/data-pg db:apply

      # The query suite asserts real figures for Taquería Don Pedro, so the
      # seed is required, not just the schema. It runs through the app role,
      # so every insert passes the same policy a request does.
      - name: Seed
        run: pnpm --filter @xangarro/data-pg db:seed

      # `test:db` sets REQUIRE_DB=1: a missing DATABASE_URL throws here rather
      # than skipping. These 14 assertions are the only proof the RLS policies
      # bind, and they connect as the non-superuser `xangarro_app` — a
      # superuser bypasses RLS entirely and would pass every assertion while
      # protecting nothing.
      - name: Integration tests (RLS, claims, compat, queries)
        run: pnpm --filter @xangarro/data-pg test:db

  # The staff console's own browser suite (N-05's follow-up): sign-in, forced
  # TOTP enrolment, session end, lockout and an audit row per mutation,
  # against a real Postgres with the admin migrations applied.
  backoffice-e2e:
    name: backoffice-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: xangarro
          POSTGRES_DB: xangarro
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xangarro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The console's own role; the suite's superuser fixture uses the
      # `postgres` URL in DATABASE_SUPER_URL.
      DATABASE_URL: postgres://xangarro_admin:xangarro_admin@localhost:55432/xangarro
      DATABASE_SUPER_URL: postgres://postgres:xangarro@localhost:55432/xangarro
      # Sign-in seals TOTP seeds with this key; the suite's throwaway value
      # (32 bytes base64), set at the job level so it cannot be lost between
      # the webServer env and the server process.
      ADMIN_TOTP_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm --filter @xangarro/backoffice exec playwright install --with-deps chromium

      - run: pnpm --filter @xangarro/data-pg db:apply
      - run: pnpm --filter @xangarro/data-pg db:seed

      # db-local/db:apply never runs the console's own migrations; psql them
      # in idempotent order (the N-05 local pattern).
      - name: Apply the admin migrations
        run: |
          for f in apps/backoffice/src/server/db/migrations/*.sql; do
            psql "$DATABASE_SUPER_URL" -q -f "$f"
          done

      # See portal-e2e for why this is not `turbo run build`.
      - name: Build the console (production, webpack)
        run: pnpm --filter @xangarro/backoffice run build

      - name: E2E (auth, MFA, lockout, audit)
        run: pnpm --filter @xangarro/backoffice run test:e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: backoffice-playwright-report
          path: |
            apps/backoffice/playwright-report/
            apps/backoffice/test-results/

  # The portal, rendered, against a seeded database.
  #
  # Its own job rather than a step in `ci`: a production Next build plus 112
  # browser tests across three viewports would turn a ~10-minute hermetic gate
  # into a ~28-minute serial one. In parallel, wall-clock barely moves, and
  # "the portal broke" stays distinguishable from "a type broke".
  #
  # This suite refuses to run without a database (see playwright.config.ts).
  # That is deliberate: it previously passed with none, because every page
  # catches its loader's throw and renders an error state, so 79 specs were
  # sweeping eleven error cards.
  portal-e2e:
    name: portal-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: xangarro
          POSTGRES_DB: xangarro
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xangarro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The app role, behind the same policies a request hits — never `postgres`.
      DATABASE_URL: postgres://xangarro_app:xangarro_app@localhost:55432/xangarro
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium and WebKit
        run: pnpm --filter @xangarro/web exec playwright install --with-deps chromium webkit

      - run: pnpm --filter @xangarro/data-pg db:apply
      - run: pnpm --filter @xangarro/data-pg db:seed

      # Deliberately NOT `turbo run build`: turbo.json's `build` task declares
      # outputs `dist/**` and `build/**` but not `.next/**`, so a cache hit
      # would restore nothing and `next start` would serve a build that is not
      # there. Building here also makes a build failure read as a build
      # failure rather than as "webServer timed out".
      - name: Build the portal (production, webpack — P-20)
        run: pnpm --filter @xangarro/web run build

      - name: E2E (data, a11y and shell, three viewports)
        run: pnpm --filter @xangarro/web run test:e2e

      # The contract's own conformance suite, pointed at this portal instead of
      # the mock. It is the acceptance for `/activate`: identical assertions pass
      # against both, or the portal does not implement the phone's contract. The
      # concurrent-redemption test is the one that matters most — a
      # check-then-write implementation lets one single-use code bind two phones.
      - name: Contract conformance (/activate against the real portal)
        run: pnpm --filter @xangarro/web run test:conformance

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
