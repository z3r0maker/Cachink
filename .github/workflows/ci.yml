# CI gate for every PR and for pushes to main (ADR-055; docs/plan/01-foundation.md F-08).
#
# Blocking: typecheck (turbo builds referenced packages first), unit tests,
# root script tests, lint, and prettier's format:check (F-09 cleared the
# pre-existing debt on 2026-09-11).
# The schema-drift job is added by B-02 together with packages/data-pg.
#
# Branch protection: require the check named "ci".

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from package.json#packageManager.

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Typecheck (builds referenced packages first)
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Root script tests
        run: pnpm test:scripts

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check
