# Nightly / on-demand Maestro E2E (docs/plan/01-foundation.md F-08).
# Best-effort and non-blocking: it never gates a merge. Needs a macOS
# runner with Xcode + a simulator; if the plan has none, run it via
# workflow_dispatch from a self-hosted Mac or locally with
# apps/mobile/maestro/scripts/full-regression.sh.

name: maestro-nightly

on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC ≈ 01:00 CDMX
  workflow_dispatch:

jobs:
  maestro:
    runs-on: macos-15
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash && echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Prebuild + build dev client
        working-directory: apps/mobile
        env:
          LANG: en_US.UTF-8
        run: |
          npx expo prebuild --clean --platform ios
          npx expo run:ios --no-bundler --device "iPhone 17"
      - name: Start Metro
        working-directory: apps/mobile
        run: (CI=1 npx expo start --dev-client --port 8081 > /tmp/metro.log 2>&1 &) && curl -s --retry 30 --retry-delay 2 --retry-connrefused http://localhost:8081/status
      - name: Full regression (best effort)
        run: apps/mobile/maestro/scripts/full-regression.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-reports
          path: e2e-reports/
