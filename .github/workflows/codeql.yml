# Static analysis of the TypeScript and JavaScript (SEC-SUP-01, N-26). The
# repository is public, so CodeQL is free here. Results land in the repo's
# Security tab; a new high-severity alert on a pull request shows on its checks.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * 1' # Mondays, beside Renovate's window

permissions:
  contents: read

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: /language:javascript-typescript
