<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ── Fonts: self-hosted (scripts/fonts.mjs), declared in colors_and_type.css.
     One preload for the sans the whole page uses; Anton is only the wordmark. ── -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/plus-jakarta-sans-latin-wght.woff2">

<!-- ── Primary SEO ─────────────────────────────────────────────────── -->
<title>Xangarro · Finanzas para emprendedores</title>
<meta name="description" content="Caja, punto de venta y estados financieros NIF desde el navegador. Tu equipo cobra; tú ves todo en el portal, con Don Cuentas, tu asesor con IA.">
<link rel="canonical" href="__SITE_URL__/">

<!-- ── Open Graph ──────────────────────────────────────────────────── -->
<meta property="og:type"         content="website">
<meta property="og:locale"       content="es_MX">
<meta property="og:site_name"    content="Xangarro">
<meta property="og:url"          content="__SITE_URL__/">
<meta property="og:title"        content="Xangarro · Finanzas para emprendedores">
<meta property="og:description"  content="Caja, punto de venta y estados financieros NIF desde el navegador. Tu equipo cobra; tú ves todo en el portal, con Don Cuentas, tu asesor con IA.">
<!-- WebP variant first — modern crawlers and social platforms prefer it -->
<meta property="og:image"        content="__SITE_URL__/og-image.webp">
<meta property="og:image:type"   content="image/webp">
<meta property="og:image:width"  content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt"    content="Xangarro! — Tu caja, clara. Cada día.">
<!-- PNG fallback for parsers that don't accept WebP -->
<meta property="og:image"        content="__SITE_URL__/og-image.png">
<meta property="og:image:type"   content="image/png">
<meta property="og:image:width"  content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt"    content="Xangarro! — Tu caja, clara. Cada día.">

<!-- ── Twitter / X Card ───────────────────────────────────────────── -->
<meta name="twitter:card"        content="summary_large_image">
<meta name="twitter:title"       content="Xangarro · Finanzas para emprendedores">
<meta name="twitter:description" content="El mostrador cobra. Tú ves todo: ventas, caja, inventario y estados NIF, con Don Cuentas como asesor.">
<meta name="twitter:image"       content="__SITE_URL__/og-image.png">
<meta name="twitter:image:alt"   content="Xangarro! — Tu caja, clara. Cada día.">

<!-- ── Favicons ───────────────────────────────────────────────────── -->
<link rel="icon"                               sizes="32x32"   href="/favicon.ico">
<link rel="icon"             type="image/svg+xml"                 href="/assets/favicon.svg">
<link rel="apple-touch-icon"                  sizes="180x180" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<!-- ── Mexico geo signals + PWA/browser chrome ───────────────────── -->
<meta name="geo.region"                   content="MX">
<meta name="geo.placename"                content="México">
<meta name="theme-color"                  content="#FFD60A">
<meta name="application-name"             content="Xangarro">
<meta name="apple-mobile-web-app-title"   content="Xangarro">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<!-- ── Analytics (injected at build time from VITE_PLAUSIBLE_DOMAIN) ─ -->
__PLAUSIBLE_SNIPPET__

</head>
<body>
  <!-- Skip to main content — keyboard / screen reader navigation -->
  <a href="#main-content"
     style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;background:var(--yellow);color:var(--black);font-weight:800;padding:12px 20px;border:2.5px solid var(--black);border-radius:10px;z-index:9999;text-decoration:none;font-family:var(--font-sans);"
     onfocus="this.style.cssText='position:fixed;left:16px;top:16px;width:auto;height:auto;z-index:9999;background:var(--yellow);color:var(--black);font-weight:800;padding:12px 20px;border:2.5px solid var(--black);border-radius:10px;text-decoration:none;font-family:var(--font-sans);'"
     onblur="this.style.cssText='position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;'"
  >Saltar al contenido principal</a>

  <div id="root"><!--ssr-outlet--></div>
  <script type="module" src="/src/main.jsx"></script>

  <!-- ── Conteo por estado (N-58): inyectado desde VITE_GEO_PIXEL_URL ─────
       Vacío por defecto. Sin cookies, sin identificador, sin IP guardada.
       No encender hasta publicar el aviso de privacidad del sitio. -->
  __GEO_PIXEL__
</body>
</html>
