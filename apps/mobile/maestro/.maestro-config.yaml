# Maestro workspace config for apps/mobile.
#
# Tag infrastructure for filtered regression runs:
#
#   maestro test --includeTags smoke apps/mobile/maestro/flows/
#   maestro test --excludeTags wizard,cloud apps/mobile/maestro/flows/
#
# Available tags:
#
# | Tag         | Purpose                              | Flow count (est.) |
# |-------------|--------------------------------------|-------------------|
# | smoke       | Quick sanity check (< 2 min total)   | ~10               |
# | regression  | Full regression set                  | ~140              |
# | wizard      | Needs fresh install (clearState)     | ~12               |
# | cloud       | Needs Supabase credentials           | ~3                |
# | lan         | Needs LAN server running             | ~1                |
# | ipad        | iPad-specific form factor            | ~2                |
# | debug       | Developer-only (not for prod builds) | ~3                |
# | observability | Telemetry, audit, bug-report flows | ~5                |
# | ventas      | Sales-related flows                  | ~15               |
# | egresos     | Expense-related flows                | ~12               |
# | settings    | Settings/configuration flows         | ~10               |
# | otros       | Otros tab navigation flows           | ~10               |
# | caja        | Cash drawer flows                    | ~6                |
# | auth        | Authentication/PIN flows             | ~8                |
#
# The defaultTags key is empty — all flows run by default.
# Use full-regression.sh for phased, ordered execution.
appId: mx.cachink.mobile
# iOS-first simulator target. Android testing uses MAESTRO_ANDROID=1 env.
defaultTags: []
# Disable iOS simulator animations to speed up tap commands.
# Maestro waits for animations to settle after each tap (2x 3s timeout).
# The wizard screen's continuous background animations cause ~14s overhead per tap.
platform:
  ios:
    disableAnimations: true
