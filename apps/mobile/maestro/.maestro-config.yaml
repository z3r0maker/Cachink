# Maestro workspace config for apps/mobile.
#
# Tag infrastructure for filtered runs:
#
#   maestro test --includeTags regression apps/mobile/maestro/flows/
#   maestro test --excludeTags offline apps/mobile/maestro/flows/
#
# Available tags (README.md «Tag Infrastructure» is the reference; only some
# flows carry tags today — tag a flow when you touch it):
#
#   regression · offline · sync · entitlement · devices · observability ·
#   ventas · cancelaciones · gastos · fiado · settings · caja · cierre · escaner
#
# The defaultTags key is empty — all flows run by default.
# Use full-regression.sh for the curated, ordered run.
appId: mx.xangarro.mobile
# iOS-first simulator target. Android testing uses MAESTRO_ANDROID=1 env.
defaultTags: []
# Disable iOS simulator animations to speed up tap commands.
# Maestro waits for animations to settle after each tap (2x 3s timeout).
# The wizard screen's continuous background animations cause ~14s overhead per tap.
platform:
  ios:
    disableAnimations: true
