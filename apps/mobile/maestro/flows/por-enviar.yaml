# Registros por enviar (Track M, M-09; board MvPorEnviar): the queue's whole
# face, not only its rejections. The mock «forgets» a product (as if purged
# in the portal, shared/mock-row.js), one venta of it is refused with
# FK_PRODUCT_MISSING, the pill turns red and opens /no-enviados, the hero
# says the phase (con-rechazados) with the server's sentence under it, and
# once the portal restores the product «Reintentar» requeues the row and
# everything lands: Don's «Todo está enviado» (RvEnvio).
#
# Precondition: activated device against the mock on MOCK_API, turno open.
# Replaces sync-rejected.yaml (A-08's old «No enviados» screen is gone).
# x-entrypoint: activated
appId: mx.xangarro.mobile
env:
  MOCK_API: ${MAESTRO_LANE_MOCK_API || 'http://127.0.0.1:3000'}
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/login-operator.yaml
- runFlow: shared/ensure-caja-open.yaml

# The server loses «Agua de horchata» (PRD-7); one venta of it — refused.
- runScript:
    file: shared/mock-row.js
    env:
      ACTION: forget
      TABLE: products
      ROW_ID: 01JPRD00000000000000000007
- tapOn:
    id: 'tab-cobrar|rail-cobrar|sidebar-cobrar'
- extendedWaitUntil:
    visible:
      id: 'ventas-product-grid'
    timeout: 8000
- tapOn: 'Agregar Agua de horchata,.*'
- runFlow:
    file: shared/cobrar-ticket.yaml
    env:
      METODO: Transferencia

# The pill refuses and opens «Registros por enviar»
# (app-shell.tsx onOpenPendientes → /no-enviados; it always does, R4).
- extendedWaitUntil:
    visible:
      id: 'cloud-sync-pill-rejected'
    timeout: 30000
- tapOn:
    id: 'cloud-sync-pill'
- extendedWaitUntil:
    visible:
      id: 'mobile-por-enviar'
    timeout: 10000

# RvEnvio: refused rows get no status line (each card says why), and the
# footer's one button reads «Reintentar»; «La cola» still lists the venta.
- assertNotVisible:
    id: 'por-enviar-aviso'
- assertVisible:
    id: 'por-enviar-reintentar'
- assertVisible: 'Reintentar'
- assertVisible:
    id: 'cola-panel'
- assertVisible: 'Venta · .*'

# «El servidor no aceptó» is below the cola: the server's sentence and hint
# (rechazado.ts RAZON/PISTA FK_PRODUCT_MISSING), then the footer's «Reintentar».
- scrollUntilVisible:
    element:
      id: 'rechazados-panel'
    direction: DOWN
    timeout: 5000
- assertVisible: '.*El producto de este registro ya no existe en el portal\..*'
- assertVisible: '.*que recuperen el producto en el portal y toca Reintentar\..*'
- runScript:
    file: shared/mock-row.js
    env:
      ACTION: restore
      TABLE: products
      ROW_ID: 01JPRD00000000000000000007
# The refusal hits BOTH rows that name the product (the sale and its stock
# movement), so two cards wait: the footer's «Reintentar» requeues them all.
- tapOn: { id: 'por-enviar-reintentar' }

# The queue drains: Don's «Todo está enviado» takes the screen, with no
# button (the board has none), and the pill turns green again. The retry flushes the
# whole queue through the mock: give the sweep room.
- extendedWaitUntil:
    visible: { id: 'por-enviar-todo-enviado' }
    timeout: 30000
- assertVisible: '.*Todo está enviado.*'
- assertNotVisible: { id: 'por-enviar-todo-enviado-cta' }
- extendedWaitUntil:
    visible:
      id: 'cloud-sync-pill-synced'
    timeout: 30000
