# Feature flag toggling E2E — Director → Otros → Funciones (MVP).
#
# MVP: stock is the only toggleable flag. Other flags show as "Próximamente".
# Verifies:
#   1. Stock toggle is visible and interactable
#   2. ComingSoon flags are visible as cards but have no switches
#   3. Toggle stock OFF → Productos tab hides stock sub-tab
#   4. Toggle stock back ON for subsequent flows
#
# Precondition: wizard + director-setup complete, logged in as Director.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/funciones-toggle.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to Otros → Funciones.
# Review item #7: the Director bar is Inicio | Ventas | Gastos |
# Estados — no Otros tab. The tool grid moved into Configuración.
# This subflow opens it for whichever role is logged in.
- runFlow: shared/open-director-tools.yaml
- scrollUntilVisible:
    element:
      id: "otros-funciones"
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn:
    id: "otros-funciones"

# --- Verify stock toggle is visible ---
- assertVisible:
    id: "funciones-route"
- assertVisible:
    id: "flag-stock-switch"

# --- Verify comingSoon flags are present as cards but have NO switches ---
- assertVisible:
    id: "flag-ventasCredito"
- assertNotVisible:
    id: "flag-ventasCredito-switch"
- scrollUntilVisible:
    element:
      id: "flag-merma"
    direction: DOWN
    timeout: 5000
    centerElement: true
- assertVisible:
    id: "flag-merma"
- assertNotVisible:
    id: "flag-merma-switch"

# --- Verify conversionMateriaPrima is Próximamente (no switch) ---
- scrollUntilVisible:
    element:
      id: "flag-conversionMateriaPrima"
    direction: DOWN
    timeout: 5000
    centerElement: true
- assertVisible:
    id: "flag-conversionMateriaPrima"
- assertNotVisible:
    id: "flag-conversionMateriaPrima-switch"

# --- Verify auditoriaInventario is Próximamente (no switch) ---
- scrollUntilVisible:
    element:
      id: "flag-auditoriaInventario"
    direction: DOWN
    timeout: 5000
    centerElement: true
- assertVisible:
    id: "flag-auditoriaInventario"
- assertNotVisible:
    id: "flag-auditoriaInventario-switch"

# --- Toggle stock OFF ---
- scrollUntilVisible:
    element:
      id: "flag-stock-switch"
    direction: UP
    timeout: 5000
    centerElement: true
- tapOn:
    id: "flag-stock-switch"

# Navigate to Productos via Otros and verify stock sub-tab is hidden.
- tapOn:
    id: "top-bar-back"
- scrollUntilVisible:
    element:
      id: "otros-productos"
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn:
    id: "otros-productos"
# Wait for the Productos screen to mount before asserting.
- extendedWaitUntil:
    visible: "Catálogo"
    timeout: 5000
- assertNotVisible:
    id: "inventario-tab-stock"

# --- Restore stock ON for subsequent flows ---
# Review item #7: the Director bar is Inicio | Ventas | Gastos |
# Estados — no Otros tab. The tool grid moved into Configuración.
# This subflow opens it for whichever role is logged in.
- runFlow: shared/open-director-tools.yaml
- scrollUntilVisible:
    element:
      id: "otros-funciones"
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn:
    id: "otros-funciones"
- tapOn:
    id: "flag-stock-switch"
