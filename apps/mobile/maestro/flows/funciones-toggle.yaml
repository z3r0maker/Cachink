# Feature flag toggling E2E — Director → Otros → Funciones.
#
# Verifies:
#   1. Toggle stock OFF → Productos tab hides stock sub-tab
#   2. Toggle merma ON → Merma tab appears in Productos
#   3. Toggle all OFF → clean state
#
# Precondition: wizard + director-setup complete, logged in as Director.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/funciones-toggle.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to Otros → Funciones.
- tapOn:
    id: "tab-otros"
- scrollUntilVisible:
    element:
      id: "otros-funciones"
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn:
    id: "otros-funciones"

# --- Toggle stock OFF ---
- assertVisible:
    id: "funciones-route"
- tapOn:
    id: "flag-stock-switch"

# Navigate to Productos via Otros and verify stock sub-tab is hidden.
# Use back button to return to Otros grid (tab tap doesn't pop pushed routes).
- tapOn:
    id: "top-bar-back"
- scrollUntilVisible:
    element:
      id: "otros-productos"
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn:
    id: "otros-productos"
# Wait for the Productos screen to mount before asserting.
- extendedWaitUntil:
    visible: "Catálogo"
    timeout: 5000
- assertNotVisible:
    id: "productos-tab-stock"

# --- Toggle merma ON ---
# Return to Otros, then navigate to Funciones again.
- tapOn:
    id: "top-bar-back"
- scrollUntilVisible:
    element:
      id: "otros-funciones"
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn:
    id: "otros-funciones"
- tapOn:
    id: "flag-merma-switch"

# Verify Merma appears as a bottom tab (replaces Productos for Operativo).
- assertVisible:
    id: "tab-merma"

# --- Toggle all OFF → clean state ---
# Return to Otros from Funciones, then back to Funciones to toggle merma off.
- tapOn:
    id: "top-bar-back"
- scrollUntilVisible:
    element:
      id: "otros-funciones"
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn:
    id: "otros-funciones"
- tapOn:
    id: "flag-merma-switch"

# Verify Otros no longer shows merma-reportes.
- tapOn:
    id: "top-bar-back"
- assertNotVisible:
    id: "otros-merma-reportes"
