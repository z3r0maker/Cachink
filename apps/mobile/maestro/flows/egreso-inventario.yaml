# «Compra de inventario» from Gastos (Track M, M-08; kept from the old Nuevo
# egreso modal): product, quantity and unit cost; the stock entry and its
# egreso are written together (ADR-021).
#
# Precondition: wizard complete, at least one product.
# x-entrypoint: demo
appId: mx.xangarro.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- runFlow:
    file: shared/open-turno-row.yaml
    env:
      ROW: 'otros-gastos'
- tapOn:
    id: 'gastos-compra'
- extendedWaitUntil:
    visible:
      id: 'compra-inventario'
    timeout: 5000

- tapOn:
    id: 'inventario-producto'
- tapOn:
    index: 0
- tapOn:
    id: 'inventario-cantidad'
- inputText: '50'
- tapOn:
    id: 'inventario-costo'
- inputText: '12'
- tapOn:
    id: 'inventario-submit'

- extendedWaitUntil:
    notVisible:
      id: 'compra-inventario'
    timeout: 5000
- assertVisible: '.*Entraron 50 de.*'
