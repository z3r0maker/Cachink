# Activation — error paths (A-04, J3-06): a code that does not exist, one that
# expired and one already redeemed are each refused with their own sentence
# (es-mx.ts `activation.errors`), and the phone stays on Vincular.
#
# Precondition: fresh install (no activation record) showing
# `activation-screen`; contracts mock running and reset. Mock codes
# (contracts/src/mock/state.ts): EXPRK7M3 (expired) → «ya venció»,
# USEDK7M3 (already redeemed) → «ya se usó»; any other code → «no coinciden».
# x-entrypoint: fresh
appId: mx.xangarro.mobile
---
- extendedWaitUntil:
    visible:
      id: 'activation-screen'
    timeout: 60000
# Vincular opens on the camera (MvVincular); the typed path is «Escribe el código».
- tapOn:
    id: 'vincular-escribir'
# Tap the right edge so the cursor sits at the end; eraseText deletes leftwards.
- tapOn:
    id: 'activation-email'
    point: '95%,50%'
- inputText: 'dueno@tacoslaesquina.mx'
- hideKeyboard

- runFlow:
    file: shared/vincular-rechazado.yaml
    env:
      CODE: 'ZZZZK7M3'
      SENTENCE: 'El correo o el código no coinciden\.'
- runFlow:
    file: shared/vincular-rechazado.yaml
    env:
      CODE: 'EXPRK7M3'
      SENTENCE: 'Ese código ya venció\.'
- runFlow:
    file: shared/vincular-rechazado.yaml
    env:
      CODE: 'USEDK7M3'
      SENTENCE: 'Ese código ya se usó en otro dispositivo\.'
