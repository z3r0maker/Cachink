# Navigate through all 3 Settings hub category cards and verify
# each sub-screen renders correctly.
#
# Covers the SettingsHub navigation: Negocio / Tasas ISR / Sistema.
# (Empleados moved to Otros grid — see otros-empleados-empty.yaml)
#
# Precondition: wizard complete.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/settings-hub-nav.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Open Settings via the top-bar cog icon.
- runFlow: shared/navigate-to-settings.yaml

# --- Card 1: Negocio ---
- tapOn:
    id: "settings-hub-negocio"
- extendedWaitUntil:
    visible: "Negocio"
    timeout: 5000
- tapOn:
    id: "top-bar-back"
- waitForAnimationToEnd

# --- Card 2: Tasas ISR ---
- extendedWaitUntil:
    visible: "Ajustes"
    timeout: 5000
- tapOn:
    id: "settings-hub-tasas-isr"
- extendedWaitUntil:
    visible: "Tasas ISR"
    timeout: 5000
- tapOn:
    id: "top-bar-back"

# --- Card 3: Sistema ---
- extendedWaitUntil:
    visible: "Ajustes"
    timeout: 5000
- tapOn:
    id: "settings-hub-sistema"
- extendedWaitUntil:
    visible: "Sistema"
    timeout: 5000
- tapOn:
    id: "top-bar-back"

# Verify we're back at the Settings hub.
- extendedWaitUntil:
    visible: "Ajustes"
    timeout: 5000
