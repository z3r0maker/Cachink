# Navigate to Settings → Tipos de Pago and verify toggle cards render.
# Route: /settings/tipos-de-pago (via Settings hub → tipos-de-pago card)
# Verifies: tipos-de-pago-screen testID, all 4 payment method toggles.
# x-entrypoint: wizard
appId: mx.cachink.mobile
tags:
  - settings
  - regression
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to Otros → Settings
- tapOn:
    id: "tab-otros"
- extendedWaitUntil:
    visible:
      id: "otros-route"
    timeout: 5000

- scrollUntilVisible:
    element:
      id: "otros-configuracion"
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn:
    id: "otros-configuracion"
- extendedWaitUntil:
    visible:
      id: "settings-hub-screen"
    timeout: 5000

# Tap the Tipos de Pago card
- tapOn:
    id: "settings-hub-tipos-de-pago"
- extendedWaitUntil:
    visible:
      id: "tipos-de-pago-screen"
    timeout: 5000

# Verify all 4 payment method toggles render
- assertVisible:
    id: "toggle-Efectivo"
- assertVisible:
    id: "toggle-Transferencia"
- assertVisible:
    id: "toggle-Tarjeta"
- assertVisible:
    id: "toggle-QR/CoDi"

# Verify the save button exists
- assertVisible:
    id: "tipos-de-pago-save"
