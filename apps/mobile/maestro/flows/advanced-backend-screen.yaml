# BYO Supabase backend configuration — advanced settings screen.
#
# Verifies:
#   1. Navigate to Settings → Sistema → "Avanzado"
#   2. advanced-url-input, advanced-anon-input, advanced-ps-input visible
#   3. Enter invalid URL → tap advanced-save → advanced-error appears
#   4. Tap advanced-clear → fields empty
#   5. Tap advanced-cancel → returns to Settings
#
# Precondition: wizard complete, logged in as Director.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/advanced-backend-screen.yaml
# x-entrypoint: cloud
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to Settings → Sistema → Avanzado.
- runFlow: shared/navigate-to-settings.yaml
- tapOn:
    id: "settings-hub-sistema"
- tapOn:
    id: "settings-open-advanced-backend"

# Verify the advanced backend inputs render.
- assertVisible:
    id: "advanced-url-input"
- assertVisible:
    id: "advanced-anon-input"
- assertVisible:
    id: "advanced-ps-input"

# --- Test 1: Invalid URL → error ---
- tapOn:
    id: "advanced-url-input"
- inputText: "not-a-valid-url"
- tapOn:
    id: "advanced-anon-input"
- inputText: "some-anon-key"
- tapOn:
    id: "advanced-ps-input"
- inputText: "some-ps-token"
- tapOn:
    id: "advanced-save"

# Error should be visible.
- assertVisible:
    id: "advanced-error"

# --- Test 2: Clear → fields empty ---
- tapOn:
    id: "advanced-clear"

# Fields should be empty (the error clears too).
- assertNotVisible:
    id: "advanced-error"

# --- Test 3: Cancel → returns to Settings ---
- tapOn:
    id: "advanced-cancel"

# Back on the Sistema settings section.
- assertVisible:
    id: "settings-hub-sistema"
