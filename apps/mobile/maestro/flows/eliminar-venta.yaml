# Delete a venta via the detail popover and verify it's removed.
#
# Covers CRUD Delete for Ventas.
#
# Precondition: wizard + product + at least one venta exist.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/inventario-producto.yaml
#   maestro test apps/mobile/maestro/flows/venta-efectivo.yaml
#   maestro test apps/mobile/maestro/flows/eliminar-venta.yaml
#
# ⚠️  This flow DESTROYS state — run last in any chain that
# expects the venta to still exist afterwards.
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to the Ventas tab (Operativo role).
- tapOn:
    id: "tab-ventas"

# Verify the existing sale is visible.
- assertVisible: "Tortilla"

# Tap the venta card to open VentaDetailPopover.
- tapOn: "Tortilla"
- assertVisible:
    id: "venta-detail-popover"

# Tap the delete button in the detail popover.
# This fires eliminar.mutate directly — no confirm dialog.
- tapOn:
    id: "venta-detail-delete"

# The popover closes and the venta is removed from the list.
- assertNotVisible:
    id: "venta-detail-popover"
- assertNotVisible: "Tortilla"
