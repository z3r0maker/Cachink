# Recurrente gasto with monthly frequency + day-of-month selection.
#
# Verifies:
#   1. Create egreso → toggle recurrente
#   2. Select "Mensual" frequency
#   3. recurrente-dia-mes picker appears
#   4. Enter day 15 → submit
#   5. Verify pendiente scheduled correctly
#
# Precondition: wizard complete, Operativo role.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/egreso-recurrente-mensual.yaml
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to Egresos.
- tapOn:
    id: "tab-gastos"
- tapOn:
    id: "egresos-nuevo"

# Fill the concepto and monto.
- tapOn:
    id: "gasto-concepto"
- inputText: "Renta mensual oficina"
- tapOn:
    id: "gasto-monto"
- inputText: "12000"

# Toggle recurrente ON.
- tapOn:
    id: "gasto-recurrente-toggle"

# Frecuencia field should now be visible.
- assertVisible: "Frecuencia"

# Select "Mensual" frequency.
- tapOn:
    id: "recurrente-frecuencia"
- tapOn: "Mensual"

# The day-of-month picker should appear.
- assertVisible:
    id: "recurrente-dia-mes"

# Enter day 15 for monthly billing.
- tapOn:
    id: "recurrente-dia-mes"
- eraseText
- inputText: "15"

# Submit the egreso.
- tapOn:
    id: "gasto-submit"

# Modal closes.
- assertNotVisible: "Nuevo egreso"

# Verify the egreso was created in the list.
- assertVisible: "Renta mensual oficina"
