# Edit an existing producto via the swipe-to-edit gesture and verify
# the updated nombre appears in the stock list.
#
# Covers CRUD Update for Productos (Edit flow).
#
# Precondition: wizard + at least one producto exists.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/inventario-producto.yaml
#   maestro test apps/mobile/maestro/flows/editar-producto.yaml
#
# The inventario-producto flow creates "Tortilla".
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to the Productos tab.
- tapOn:
    id: "tab-productos"

# Verify the existing product is visible in the stock list.
- assertVisible: "Tortilla"

# Swipe the product row left to reveal the edit action.
- swipe:
    id: "stock-list"
    direction: LEFT
    startX: 300
    endX: 50

# Wait for the EditarProductoModal to appear.
- extendedWaitUntil:
    visible:
      id: "editar-producto-modal"
    timeout: 5000

# Update the nombre field.
- tapOn:
    id: "editar-producto-nombre"
- eraseText
- inputText: "Tortilla de maíz"

# Update the stock threshold.
- tapOn:
    id: "editar-producto-umbral"
- eraseText
- inputText: "5"

# Submit the edit.
- tapOn:
    id: "editar-producto-submit"

# Modal closes and the updated product appears in the list.
- assertNotVisible:
    id: "editar-producto-modal"
- assertVisible: "Tortilla de maíz"
