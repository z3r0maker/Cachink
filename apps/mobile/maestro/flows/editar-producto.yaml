# Edit an existing producto via the detail route and verify the rename persists.
#
# Covers CRUD Update for Productos (Edit flow).
#
# The detail route (ProductoDetailScreen) is the modern edit path: tap a product
# card → editable form (NOMBRE / SKU / CATEGORÍA / umbral) → GUARDAR (`detail-save`),
# which on success navigates back to the stock list. (The old swipe-to-edit gesture
# opened the deprecated EditarProductoModal — replaced here.)
#
# Precondition: demo seeded (product "Tortilla maíz kg" exists).
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/run-flow.sh \
#       apps/mobile/maestro/flows/editar-producto.yaml
# x-entrypoint: demo
#
# ✅ VERIFIED GREEN (2026-07-10) after an app fix: the `detail-save` (GUARDAR)
# button in DetailTopBar was a Tamagui `Btn`, whose merged accessibility element
# was not tappable by Maestro/XCUITest in this header context (its onPress never
# fired). Fixed by rendering it as a raw <Pressable> (see producto-detail-screen.tsx
# + docs/e2e-productos-row-accessibility-scope.md). Flow now runs end-to-end:
# find → detail form → edit NOMBRE → GUARDAR → re-search asserts the rename.
#
# NOTE: this flow RENAMES the demo product to "Tortilla de maíz" (persists in the
# DB). In a full suite run, order it late or reset demo data after — flows that
# assert the exact original name "Tortilla maíz kg" would otherwise see the new one
# (searches by the "Tortilla" prefix still match).
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Find the product via search and open its detail route (onPress card).
- runFlow: shared/find-producto-stock.yaml
- tapOn:
    id: "producto-card-.*"

# Detail form is open — the NOMBRE field is a plain TextField (id-selectable).
- assertVisible:
    id: "detail-nombre"

# Rename the product.
- tapOn:
    id: "detail-nombre"
- eraseText
- inputText: "Tortilla de maíz"

# The keyboard can cover the GUARDAR button; dismiss it before submitting.
- hideKeyboard

# Save — on success the detail route navigates back to the stock list.
- tapOn:
    id: "detail-save"

# Save succeeded → detail form is gone (a validation failure would keep it open).
- assertNotVisible:
    id: "detail-save"

# Back on the stock list — wait for it to remount before re-searching.
- extendedWaitUntil:
    visible:
      id: "stock-buscar"
    timeout: 8000

# Verify the rename persisted: re-search and assert the new name on the card.
- tapOn:
    id: "stock-buscar"
- eraseText
- inputText: "Tortilla"
- assertVisible:
    text: "Tortilla de maíz.*"
- hideKeyboard
