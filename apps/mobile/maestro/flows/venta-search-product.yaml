# Product search on Ventas screen — filter the product grid.
#
# Verifies:
#   1. Navigate to Ventas
#   2. Tap ventas-product-search input
#   3. Type product name → filtered grid shows matching product
#   4. Clear search → full grid returns
#
# Precondition: wizard complete, at least one product exists.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/inventario-producto.yaml
#   maestro test apps/mobile/maestro/flows/venta-search-product.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to the Ventas tab.
- tapOn:
    id: "tab-ventas"

# Verify the product grid is visible.
- assertVisible:
    id: "ventas-product-grid"

# Tap the search input.
- tapOn:
    id: "ventas-product-search"

# Type a product name to filter.
- inputText: "Tortilla"

# The filtered grid should still show the matching product.
- assertVisible: "Tortilla"

# Clear the search to restore full grid.
- tapOn:
    id: "ventas-product-search"
- eraseText

# Full grid should be visible again.
- assertVisible:
    id: "ventas-product-grid"
