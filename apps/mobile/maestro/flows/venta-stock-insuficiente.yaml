# Venta with insufficient stock — verify sale still completes.
#
# RegistrarVenta does NOT block on insufficient stock; it allows
# negative stock (salida movement created regardless). This flow
# asserts that behavior: sell more than available → sale succeeds.
#
# Precondition: demo mode seeded (products + caja open).
# x-entrypoint: activated
appId: mx.xangarro.mobile
tags:
  - ventas
  - stock
  - edge-case
---
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- runFlow: shared/ensure-caja-open.yaml

# Navigate to Ventas.
- tapOn:
    id: 'tab-ventas'
- extendedWaitUntil:
    visible:
      id: 'ventas-product-grid'
    timeout: 5000

# Tap a product and set high quantity (exceeding stock).
- runFlow:
    file: shared/add-to-cart.yaml
    env:
      PRODUCT: 'Quesadilla'
- scrollUntilVisible:
    element:
      id: 'cart-strip'
    direction: DOWN
    timeout: 20000

# Set cantidad to a large number by tapping the quantity control.
- tapOn:
    id: 'cart-qty-increase'
    optional: true
- tapOn:
    id: 'cart-qty-increase'
    optional: true
- tapOn:
    id: 'cart-qty-increase'
    optional: true
- tapOn:
    id: 'cart-qty-increase'
    optional: true

# Checkout — should succeed even with high qty.
- tapOn:
    id: 'cart-checkout-btn'
- extendedWaitUntil:
    visible:
      id: 'checkout-method-picker'
    timeout: 5000
- tapOn:
    id: 'checkout-method-continue'
- extendedWaitUntil:
    visible:
      id: 'checkout-efectivo'
    timeout: 5000
# $200 covers up to 5 × $32.50 and is on screen on phones (the bill chips
# scroll sideways; $500 is off to the right on an iPhone).
- tapOn: "\\$200"
- tapOn:
    id: 'checkout-efectivo-submit'

# Sale completed (negative stock allowed): checkout closes and the cart
# empties (no Cobrar footer). The grid may be scrolled away on phones.
- extendedWaitUntil:
    notVisible:
      id: 'checkout-efectivo-submit'
    timeout: 8000
- assertNotVisible:
    id: 'cart-checkout-btn'
