# Venta with insufficient stock — verify sale still completes.
#
# RegistrarVenta does NOT block on insufficient stock; it allows
# negative stock (salida movement created regardless). This flow
# asserts that behavior: sell more than available → sale succeeds.
#
# Precondition: demo mode seeded (products + caja open).
# x-entrypoint: demo
appId: mx.xangarro.mobile
tags:
  - ventas
  - stock
  - edge-case
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- runFlow: shared/ensure-caja-open.yaml

# Navigate to Cobrar.
- tapOn:
    id: 'tab-cobrar'
- extendedWaitUntil:
    visible:
      id: 'ventas-product-grid'
    timeout: 5000

# One Quesadilla, then four more from the ticket's stepper.
- tapOn: 'Agregar Quesadilla,.*'
- tapOn:
    id: 'cart-checkout-btn'
- extendedWaitUntil:
    visible:
      id: 'ticket-sheet'
    timeout: 5000
- tapOn: 'Agregar uno de Quesadilla'
- tapOn: 'Agregar uno de Quesadilla'
- tapOn: 'Agregar uno de Quesadilla'
- tapOn: 'Agregar uno de Quesadilla'
- assertVisible: '.*5 piezas.*'

# Charge it: the sale goes through even past the stock.
- tapOn:
    id: 'ticket-cobrar'
- extendedWaitUntil:
    visible:
      id: 'checkout-cobro'
    timeout: 5000
- tapOn:
    id: 'cobro-rapido-0'
- tapOn:
    id: 'cobro-submit'
- extendedWaitUntil:
    visible:
      id: 'venta-hecha'
    timeout: 8000
- tapOn:
    id: 'venta-hecha-nueva'
- extendedWaitUntil:
    visible:
      id: 'ventas-product-grid'
    timeout: 5000
