# Every question of «Registrar gasto» (Track M, M-08; MvGastos): amount with
# decimals, concept, category and who was paid; the row shows the supplier.
#
# Precondition: wizard complete, business set, a turno open.
# x-entrypoint: demo
appId: mx.xangarro.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- runFlow: shared/abrir-registrar-gasto.yaml

- tapOn: { id: 'numpad-4' }
- tapOn: { id: 'numpad-5' }
- tapOn: { id: 'numpad-dot' }
- tapOn: { id: 'numpad-5' }
- tapOn: { id: 'numpad-0' }
- assertVisible: '.*45\.50.*'
- tapOn:
    id: 'gasto-concepto'
- inputText: 'Taxi por insumos'
- tapOn:
    id: 'gasto-categoria-Transporte'
- tapOn:
    id: 'gasto-proveedor'
- inputText: 'Sitio Centro'
- assertVisible: 'Registrar gasto de $45.50'
- tapOn:
    id: 'gasto-guardar'

- extendedWaitUntil:
    notVisible:
      id: 'registrar-gasto'
    timeout: 5000
- assertVisible: 'Taxi por insumos'
- assertVisible: 'Sitio Centro'
- tapOn:
    id: 'gastos-filtro-Transporte'
- assertVisible: 'Taxi por insumos'
