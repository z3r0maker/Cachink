# Create a producto using the manual barcode entry path.
# Covers P1C-M5-T05/T06 (scanner + manual fallback) for mobile. On
# simulators without a physical camera the ManualEntry field is the
# only reliable code source.
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

- tapOn:
    id: 'tab-productos'
- tapOn:
    id: 'stock-nuevo-producto'

- tapOn:
    id: 'producto-nombre'
- inputText: 'Refresco 600ml'
- scrollUntilVisible:
    element:
      id: 'producto-scan'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'producto-scan'

- assertVisible: 'Escanear código'
- tapOn:
    id: 'scanner-manual'
- inputText: '7501055300005'
- runFlow: shared/hide-keyboard-in-sheet.yaml
- tapOn:
    id: 'scanner-manual-submit'

# Scanner closes + SKU populated on the form.
# The scanner sheet closes (the "Escanear código" button itself stays on the form).
- assertNotVisible:
    id: 'scanner-manual'

# Quick-add has no costo or margen; only the sale price is required.
- tapOn:
    id: 'producto-precio-venta'
- eraseText
- inputText: '100'
- runFlow: shared/dismiss-keyboard-by-drag.yaml

- runFlow: shared/scroll-form-to-end.yaml
- tapOn:
    id: 'producto-submit'
- extendedWaitUntil:
    visible:
      id: 'stock-buscar'
    timeout: 8000
- tapOn:
    id: 'stock-buscar'
- inputText: 'Refresco 600'
- assertVisible: '.*Refresco 600ml.*'
- hideKeyboard
