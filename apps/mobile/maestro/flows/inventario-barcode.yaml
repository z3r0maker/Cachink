# Create a producto using the manual barcode entry path.
# Covers P1C-M5-T05/T06 (scanner + manual fallback) for mobile. On
# simulators without a physical camera the ManualEntry field is the
# only reliable code source.
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
# The escáner (MvEscaner over Cobrar): its sheet opens from the catalogue's
# scan button, the manual entry takes a code, and a known code adds the
# product to the ticket (the ticket's Vaciar renders with a line). An
# unknown code says so in the sheet.
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/login-operator.yaml
- runFlow: shared/ensure-caja-open.yaml
- tapOn:
    id: 'tab-cobrar|rail-cobrar|sidebar-cobrar'
- extendedWaitUntil:
    visible:
      id: 'ventas-product-grid'
    timeout: 8000
- tapOn:
    id: 'cobrar-scan'
- extendedWaitUntil:
    visible:
      id: 'escaner-sheet'
    timeout: 5000
# Manual entry: the keypad button swaps the camera for the code field.
- tapOn:
    id: 'escaner-manual'
- waitForAnimationToEnd
- tapOn:
    id: 'escaner-codigo'
- inputText: '7501055300005'
- swipe:
    start: '50%,45%'
    end: '50%,25%'
- waitForAnimationToEnd
- tapOn:
    id: 'escaner-buscar'
# A code the catalogue does not carry stays in the sheet with its answer.
- extendedWaitUntil:
    visible: { id: 'escaner-desconocido' }
    timeout: 8000
