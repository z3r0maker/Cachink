# Inventario's escáner with an unknown code (M-20, ADR-150; EcInventario):
# «Ese código no está en tu catálogo» offers «Darlo de alta» with Cobrar's
# questions (Producto nuevo, the code filled in); once saved, «Llegó
# mercancía» opens on the new product, marked «Del escáner», and the
# entrada registers.
#
# The code is new on every run: an activated device keeps what earlier runs
# registered, and a code from a previous run would no longer be unknown.
# x-entrypoint: activated
appId: mx.xangarro.mobile
tags:
  - inventario
  - escaner
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/login-operator.yaml
- runFlow: shared/ensure-caja-open.yaml
- evalScript: ${output.codigo = '75' + String(Date.now()).slice(-11)}
- runFlow:
    file: shared/open-turno-row.yaml
    env:
      ROW: 'otros-inventario'
- extendedWaitUntil:
    visible:
      id: 'mobile-inventario'
    timeout: 10000
- tapOn:
    id: 'inventario-escanear'
- extendedWaitUntil:
    visible:
      id: 'escaner-sheet'
    timeout: 5000
# The sheet is still sliding up when it first shows; a tap then lands short.
- extendedWaitUntil:
    visible:
      id: 'escaner-listo'
    timeout: 5000
- waitForAnimationToEnd
- tapOn:
    id: 'escaner-manual'
- waitForAnimationToEnd
- tapOn:
    id: 'escaner-codigo'
- inputText: ${output.codigo}
- swipe:
    start: '50%,45%'
    end: '50%,25%'
- waitForAnimationToEnd
- tapOn:
    id: 'escaner-buscar'
- extendedWaitUntil:
    visible:
      id: 'escaner-desconocido'
    timeout: 8000
- assertVisible: '.*luego anota lo que llegó.*'
- tapOn:
    id: 'escaner-alta'

# Producto nuevo arrives with the code.
- extendedWaitUntil:
    visible:
      id: 'producto-nuevo-sheet'
    timeout: 5000
- assertVisible:
    id: 'producto-nuevo-codigo'
- assertVisible: ${output.codigo}
- waitForAnimationToEnd
- tapOn:
    id: 'producto-nuevo-nombre'
- waitForAnimationToEnd
- inputText: 'Hilo'
# Synthetic keystrokes drop letters in this controlled field (escaner-alta-
# cobro): retype until the field reads the whole name back.
- repeat:
    while:
      notVisible:
        id: 'producto-nuevo-nombre'
        text: 'Hilo'
    times: 4
    commands:
      - tapOn: { id: 'producto-nuevo-nombre' }
      - eraseText
      - inputText: 'Hilo'
- assertVisible:
    id: 'producto-nuevo-nombre'
    text: 'Hilo'
- hideKeyboard
- tapOn:
    id: 'producto-nuevo-precio'
- inputText: '8'
- swipe:
    start: '50%,45%'
    end: '50%,25%'
- waitForAnimationToEnd
- assertVisible: '.*Darlo de alta y anotar lo que llegó.*'
- tapOn:
    id: 'producto-nuevo-agregar'

# The new product's «Llegó mercancía», once Inventario lists it.
- extendedWaitUntil:
    visible:
      id: 'mover-sheet'
    timeout: 15000
- waitForAnimationToEnd
- assertVisible:
    id: 'mover-del-escaner'
- assertVisible: '.*Hilo.*'
- tapOn:
    id: 'mover-cantidad'
- eraseText: 6
- inputText: '12'
- swipe:
    start: '50%, 45%'
    end: '50%, 20%'
- waitForAnimationToEnd
- tapOn:
    id: 'mover-guardar'
- extendedWaitUntil:
    visible:
      id: 'mov-toast'
    timeout: 8000
- assertVisible: '.*\+12 de Hilo\..*'
- tapOn:
    id: 'mov-toast-entendido'
