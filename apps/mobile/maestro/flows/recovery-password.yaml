# Password recovery via PIN E2E — QuickSwitch → forgot → PIN → new password.
#
# Verifies:
#   1. Happy: tap "¿Olvidaste tu contraseña?" → enter PIN + new password → submit → back to QuickSwitch
#   2. Edge: wrong PIN → error message visible
#
# Precondition: wizard + director-setup complete (PIN: 123456), app relaunched.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/recovery-password.yaml
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml

# QuickSwitchScreen should be showing.
- extendedWaitUntil:
    visible:
      id: "quick-switch"
    timeout: 10000

# Tap forgot password link.
- tapOn:
    id: "forgot-password-link"

# Recovery screen appears.
- extendedWaitUntil:
    visible:
      id: "recovery-screen"
    timeout: 5000

# --- Edge case: wrong PIN ---
- tapOn:
    id: "recovery-pin"
- inputText: "999999"
- tapOn:
    id: "recovery-new-password"
- inputText: "NewPass1"
- tapOn:
    id: "recovery-confirm-password"
- inputText: "NewPass1"
- tapOn:
    id: "recovery-submit"

# Error message for wrong PIN.
- assertVisible: "PIN incorrecto"

# --- Happy path: correct PIN ---
- tapOn:
    id: "recovery-pin"
- inputText: "123456"
- tapOn:
    id: "recovery-new-password"
- inputText: "NewPass1"
- tapOn:
    id: "recovery-confirm-password"
- inputText: "NewPass1"
- tapOn:
    id: "recovery-submit"

# Success — back to QuickSwitch (or auto-logged in).
- extendedWaitUntil:
    visible:
      id: "quick-switch"
    timeout: 5000
    optional: true
- extendedWaitUntil:
    visible:
      id: "tab-estados"
    timeout: 5000
    optional: true
