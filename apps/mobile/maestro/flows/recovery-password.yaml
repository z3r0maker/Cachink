# Password recovery via recovery-password E2E — QuickSwitch → forgot → recovery password + new PIN.
#
# ADR-049 PIN-first: Auth model changed from password to PIN. Recovery now uses
# a recovery password (not PIN) to reset the user's PIN.
#
# Verifies:
#   1. Happy: tap "¿Olvidaste tu PIN?" → enter recovery password + new PIN → submit → back to QuickSwitch
#   2. Edge: wrong recovery password → error message visible
#
# Precondition: wizard + director-setup complete (PIN: 123456), app relaunched.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/recovery-password.yaml
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml

# QuickSwitchScreen should be showing.
- extendedWaitUntil:
    visible:
      id: "quick-switch"
    timeout: 10000

# Tap forgot PIN link (ADR-049: was forgot-password-link).
- tapOn:
    id: "forgot-pin-link"

# Recovery screen appears.
- extendedWaitUntil:
    visible:
      id: "recovery-screen"
    timeout: 5000

# --- Edge case: wrong recovery password ---
- tapOn:
    id: "recovery-password"
- inputText: "WrongPass"
- tapOn:
    id: "recovery-new-pin"
- inputText: "654321"
- tapOn:
    id: "recovery-confirm-pin"
- inputText: "654321"
- tapOn:
    id: "recovery-submit"

# Error message for wrong recovery password.
- assertVisible: "incorrect"

# --- Happy path: correct recovery password ---
- tapOn:
    id: "recovery-password"
- eraseText
- inputText: "Test1234"
- tapOn:
    id: "recovery-new-pin"
- eraseText
- inputText: "123456"
- tapOn:
    id: "recovery-confirm-pin"
- eraseText
- inputText: "123456"
- tapOn:
    id: "recovery-submit"

# Success — back to QuickSwitch (or auto-logged in).
- extendedWaitUntil:
    visible:
      id: "quick-switch"
    timeout: 5000
    optional: true
- extendedWaitUntil:
    visible:
      id: "tab-estados"
    timeout: 5000
    optional: true
