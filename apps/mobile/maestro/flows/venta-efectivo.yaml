# Create a cash venta on Cobrar (Track M, M-07; MvCobrar → MvTicket → MvCobro
# → MvVentaHecha) and check the change is shown.
#
# Precondition: demo mode seeded (products + users exist).
# x-entrypoint: demo
appId: mx.xangarro.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- runFlow: shared/ensure-caja-open.yaml

- tapOn:
    id: 'tab-cobrar'
- extendedWaitUntil:
    visible:
      id: 'ventas-product-grid'
    timeout: 5000
- assertVisible: 'Toca lo que pidió el cliente'
- assertVisible: 'Toca un producto para empezar'

# Tap a product: the bar shows pieces and total.
- tapOn: 'Agregar Quesadilla.*'
- assertVisible:
    id: 'cobrar-bar'
- assertVisible: '1 pieza ·'

# Review the ticket and go on to the cobro.
- tapOn:
    id: 'cart-checkout-btn'
- extendedWaitUntil:
    visible:
      id: 'ticket-sheet'
    timeout: 5000
- assertVisible: 'Revisa el ticket'
- tapOn:
    id: 'ticket-cobrar'
- extendedWaitUntil:
    visible:
      id: 'checkout-cobro'
    timeout: 5000
- assertVisible: '¿Cómo paga?'

# Nothing typed yet: the button says what is missing.
- assertVisible: 'Falta.*'

# Pay with $500 on the keypad: 5, 0, 0.
- tapOn:
    id: 'cobro-tecla-5'
- tapOn:
    id: 'cobro-tecla-0'
- tapOn:
    id: 'cobro-tecla-0'
- assertVisible: 'Cobrar y dar.*'
- tapOn:
    id: 'cobro-submit'

# «Venta hecha» with the change, back on Cobrar with «Nueva venta».
- extendedWaitUntil:
    visible:
      id: 'venta-hecha'
    timeout: 8000
- assertVisible: 'Dale de cambio'
- tapOn:
    id: 'venta-hecha-nueva'
- extendedWaitUntil:
    visible:
      id: 'ventas-product-grid'
    timeout: 5000
- assertVisible: 'Toca un producto para empezar'
