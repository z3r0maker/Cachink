# El comprobante del gasto (M-18, ADR-149; boards CgHoja, CgDespues): the
# receipt's photo goes with the gasto, or is added later. The simulator has
# no camera, so both paths go the gallery way — the receipt row's long
# press, and the receipt camera's gallery button — with the fixture photo
# added to the library first. The encoder makes it gray at 1024 px; the
# sheet shows «Foto lista», the row reads «Con foto», and «Agregar foto» on
# a gasto without one ends in «Foto guardada».
#
# Precondition: device activated against the contracts mock; a turno is
# opened here if none is.
# x-entrypoint: activated
appId: mx.xangarro.mobile
tags:
  - gastos
  - regression
---
- addMedia:
    - '../fixtures/producto-foto.png'
# The camera is allowed up front: its buttons are pressed below.
- launchApp:
    permissions:
      camera: allow
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/login-operator.yaml

# 1 · With the gasto: Registrar gasto, the photo from the gallery, save.
- runFlow: shared/abrir-registrar-gasto.yaml
- runFlow:
    file: shared/llenar-gasto.yaml
    env:
      CONCEPTO_A: 'Hie'
      CONCEPTO_B: 'lo'
      CONCEPTO: 'Hielo'
      MONTO: '80'
# The row sits under the keyboard, and the driver counts it visible there.
# Phone: a drag high in the sheet puts the keyboard away (keyboardDismissMode
# on-drag) and scrolls the row up; the body's own centre is under the
# keyboard, where a drag does nothing. Tablet: the sheet floats and any drag
# closes it, even one anchored on its body; it is tall enough that the row
# sits above the keyboard, so nothing is dragged there.
- runFlow:
    when:
      true: ${FORMA != 'tableta'}
    commands:
      - swipe:
          start: '50%, 45%'
          end: '50%, 20%'
      - waitForAnimationToEnd
      - swipe:
          start: '50%, 45%'
          end: '50%, 20%'
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'gasto-comprobante-tomar'
    timeout: 5000
# Every button of the receipt camera, pressed once. The shutter takes the
# shot (the simulator's camera hands back a stand-in frame), the camera
# closes and the photo lands in the row.
- tapOn:
    id: 'gasto-comprobante-tomar'
- extendedWaitUntil:
    visible:
      id: 'foto-camara-sheet'
    timeout: 5000
- assertVisible: '.*Que se lean el total y la fecha.*'
- tapOn:
    id: 'foto-linterna'
- tapOn:
    id: 'foto-linterna'
- tapOn:
    id: 'foto-disparar'
- extendedWaitUntil:
    visible:
      id: 'gasto-comprobante-lista'
    timeout: 15000
- assertNotVisible:
    id: 'foto-camara-sheet'
# The cross drops it; the camera's close takes no photo.
- tapOn:
    id: 'gasto-comprobante-quitar'
- extendedWaitUntil:
    visible:
      id: 'gasto-comprobante-tomar'
    timeout: 5000
- tapOn:
    id: 'gasto-comprobante-tomar'
- extendedWaitUntil:
    visible:
      id: 'foto-camara-sheet'
    timeout: 5000
- tapOn:
    id: 'foto-camara-cerrar'
- extendedWaitUntil:
    notVisible:
      id: 'foto-camara-sheet'
    timeout: 5000
- assertVisible:
    id: 'registrar-gasto-sheet'
- assertVisible:
    id: 'gasto-comprobante-tomar'
# The gallery from inside the camera: the picker opens over it.
- tapOn:
    id: 'gasto-comprobante-tomar'
- extendedWaitUntil:
    visible:
      id: 'foto-camara-sheet'
    timeout: 5000
- tapOn:
    id: 'foto-camara-galeria'
- runFlow: shared/elegir-foto-galeria.yaml
- extendedWaitUntil:
    visible:
      id: 'gasto-comprobante-lista'
    timeout: 15000
# «Cambiar» opens the camera again; closing it keeps the photo.
- tapOn:
    id: 'gasto-comprobante-cambiar'
- extendedWaitUntil:
    visible:
      id: 'foto-camara-sheet'
    timeout: 5000
- tapOn:
    id: 'foto-camara-cerrar'
- extendedWaitUntil:
    notVisible:
      id: 'foto-camara-sheet'
    timeout: 5000
- assertVisible:
    id: 'gasto-comprobante-lista'
# The cross drops the draft; the row asks for the photo again.
- tapOn:
    id: 'gasto-comprobante-quitar'
- extendedWaitUntil:
    visible:
      id: 'gasto-comprobante-tomar'
    timeout: 5000
# And the long press goes straight to the gallery.
- longPressOn:
    id: 'gasto-comprobante-tomar'
- runFlow: shared/elegir-foto-galeria.yaml
- extendedWaitUntil:
    visible:
      id: 'gasto-comprobante-lista'
    timeout: 15000
- assertVisible: '.*Foto lista.*'
- tapOn:
    id: 'gasto-guardar'
- extendedWaitUntil:
    notVisible:
      id: 'registrar-gasto-sheet'
    timeout: 8000
- extendedWaitUntil:
    visible: '.*Con foto.*'
    timeout: 10000

# 2 · Later: a gasto saved without one shows «Agregar foto».
- tapOn:
    id: 'gastos-abrir-registrar'
- extendedWaitUntil:
    visible:
      id: 'registrar-gasto-sheet'
    timeout: 5000
- runFlow:
    file: shared/llenar-gasto.yaml
    env:
      CONCEPTO_A: 'Ga'
      CONCEPTO_B: 's'
      CONCEPTO: 'Gas'
      MONTO: '120'
- tapOn:
    id: 'gasto-guardar'
- extendedWaitUntil:
    notVisible:
      id: 'registrar-gasto-sheet'
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: 'gasto-agregar-foto-.*'
    timeout: 10000
- tapOn:
    id: 'gasto-agregar-foto-.*'
- extendedWaitUntil:
    visible:
      id: 'foto-camara-sheet'
    timeout: 5000
- assertVisible: '.*Que se lean el total y la fecha.*'
- tapOn:
    id: 'foto-camara-galeria'
- runFlow: shared/elegir-foto-galeria.yaml
- extendedWaitUntil:
    visible:
      id: 'gasto-foto-toast'
    timeout: 15000
- assertVisible: '.*Foto guardada.*'
- assertVisible: '.*Se les manda a los patrones.*'
# Not «no Agregar foto left»: a reused simulator keeps gastos earlier runs
# left without a photo. The newest row, the one just saved, reads «Con foto».
- assertVisible:
    text: 'Con foto'
    index: 0
