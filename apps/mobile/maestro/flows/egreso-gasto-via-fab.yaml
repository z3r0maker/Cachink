# Create a gasto using the FAB (floating action button) instead of the header button.
# Covers Gap F (Phase 17): egresos-fab testID alternative entry point.
#
# testIDs exercised:
#   egresos-fab
#
# Precondition: wizard complete, operativo role.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/egreso-gasto-via-fab.yaml
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to Egresos.
- tapOn:
    id: "tab-gastos"

# Use the FAB instead of the egresos-nuevo header button.
- assertVisible:
    id: "egresos-fab"
- tapOn:
    id: "egresos-fab"

# Gasto tab is the default — fill concepto + monto.
- assertVisible: "Nuevo egreso"
- tapOn:
    id: "gasto-concepto"
- inputText: "Agua purificada"
- tapOn:
    id: "gasto-monto"
- inputText: "200"
- tapOn:
    id: "gasto-submit"

# Modal closes + egreso visible.
- assertNotVisible: "Nuevo egreso"
- assertVisible: "Agua purificada"
