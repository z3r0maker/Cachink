# Navigate to the Conversion screen via Otros grid.
#
# Verifies:
#   1. Enable conversionMateriaPrima flag (requires stock ON)
#   2. Navigate to Operativo Otros → tap otros-conversion
#   3. conversion-screen renders with real content
#
# Precondition: wizard complete, logged in as Director.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/otros-conversion-nav.yaml
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Enable the conversion flag (Director only — navigates to Funciones).
- runFlow: shared/enable-conversion-flag.yaml

# Switch to Operativo to verify the grid item appears.
- runFlow: shared/select-operativo.yaml

# Navigate to Otros tab.
- tapOn:
    id: "tab-otros"

# Tap the Conversion grid item.
- tapOn:
    id: "otros-conversion"

# Verify the real conversion screen renders.
- extendedWaitUntil:
    visible:
      id: "conversion-screen"
    timeout: 5000

# Verify sub-tab toggle is present.
- assertVisible:
    id: "conversion-tab-toggle"
