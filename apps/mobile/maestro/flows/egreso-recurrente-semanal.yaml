# Recurrente gasto with weekly frequency + day selection.
#
# Verifies:
#   1. Create egreso → toggle recurrente
#   2. Select "Semanal" frequency
#   3. recurrente-dia-semana picker appears
#   4. Select a day → submit → pendiente appears
#
# Precondition: wizard complete, Operativo role.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/egreso-recurrente-semanal.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to Egresos.
- tapOn:
    id: "tab-gastos"
- tapOn:
    id: "egresos-nuevo"

# Fill the concepto and monto.
- tapOn:
    id: "gasto-concepto"
- inputText: "Limpieza semanal"
- tapOn:
    id: "gasto-monto"
- inputText: "350"

# Toggle recurrente ON.
- tapOn:
    id: "gasto-recurrente-toggle"

# Frecuencia field should now be visible.
- assertVisible: "Frecuencia"

# Select "Semanal" frequency.
- tapOn:
    id: "recurrente-frecuencia"
- tapOn: "Semanal"

# The day-of-week picker should appear.
- assertVisible:
    id: "recurrente-dia-semana"

# Select a day (e.g., Lunes — first option).
- tapOn:
    id: "recurrente-dia-semana"
- tapOn:
    index: 0

# Submit the egreso.
- tapOn:
    id: "gasto-submit"

# Modal closes.
- assertNotVisible: "Nuevo egreso"

# Verify pendiente appears (since proximoDisparo=today for weekly).
- assertVisible: "Pendientes de registrar"
