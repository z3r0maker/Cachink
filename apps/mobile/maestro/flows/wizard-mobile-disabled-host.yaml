# MVP dead-end: mobile Step 2B has zero tappable cards.
#
# On mobile, the server card is disabled (requires desktop) and the
# cloud card is also disabled (Próximamente — MVP). This flow:
#   1. Verifies both disabled notes are visible.
#   2. Taps both cards and asserts neither navigates away.
#   3. Uses the escape route: Back → Step 1 → join-existing → Step 3
#      (where LAN-client IS tappable).
#
# Precondition: fresh install. Run via wrapper:
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-mobile-disabled-host.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Review items #1/#2: the wizard is no longer the first-run entry
# point. It lives in Configuración → Sistema → "Sincronización y
# dispositivos"; the shared subflow owns that path.
- runFlow: shared/open-sync-wizard.yaml
- tapOn: { id: "wizard-step1-multi-card" }

# Step 2B — assert the disabled-note is visible (its presence is the
# definition of "card is disabled").
- assertVisible: { id: "wizard-step2b-server" }
- assertVisible: { id: "wizard-step2b-server-note" }
- assertVisible: "Esta opción solo funciona en computadoras"

# Tapping the disabled card is a no-op — we're still on Step 2B.
- tapOn: { id: "wizard-step2b-server-card" }
- assertVisible: { id: "wizard-step2b-server" }

# MVP: cloud is ALSO disabled — Step 2B has no tappable card on mobile.
- assertVisible: { id: "wizard-step2b-cloud" }
- assertVisible: { id: "wizard-step2b-cloud-note" }
- tapOn: { id: "wizard-step2b-cloud-card" }
- assertNotVisible: { id: "cloud-onboarding-screen" }
- assertVisible: { id: "wizard-step2b-server" }

# The escape route: Back → Step 1 → join-existing → LAN client is tappable.
- tapOn: { id: "wizard-back" }
- tapOn: { id: "wizard-step1-join-existing-link" }
- assertVisible: { id: "wizard-step3-lan" }
