# Full sales lifecycle: multi-item → sales → cancel → KPI verification.
#
# The flagship gap-filler flow that covers the complete sales cycle:
#   1. Create a 2nd product (Taco, $20)
#   2. Generate 2 cash sales (Tortilla $15, Taco $20)
#   3. Assert aggregate KPI (ventas-total-card = $35.00)
#   4. Cancel the Taco sale from the Ventas tab (sheet → motive, note, NIP)
#   5. Verify KPI adjusts (total = $15.00) and cancelled badge appears
#
# Precondition: wizard + director-setup complete, Tortilla ($15) exists
# (created by inventario-producto.yaml in Phase 2). No prior sales today.
# Must run FIRST in Phase 4 for deterministic totals. The NIP typed at the
# cancel is the signed-in user's (four digits, ADR-072); adjust it to the
# harness's user.
#
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/inventario-producto.yaml
#   maestro test apps/mobile/maestro/flows/venta-ciclo-completo.yaml
# x-entrypoint: wizard
appId: mx.xangarro.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# ══════════════════════════════════════════════════════════════════
# Step 0: Open caja via Otros (Director has no tab-caja)
# ══════════════════════════════════════════════════════════════════
# Review item #7: the Director bar is Inicio | Ventas | Gastos |
# Estados — no Otros tab. The tool grid moved into Configuración.
# This subflow opens it for whichever role is logged in.
- runFlow: shared/open-director-tools.yaml
- scrollUntilVisible:
    element:
      id: 'otros-caja'
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn:
    id: 'otros-caja'

# Handle caja opening — may need numpad entry or confirm.
- tapOn:
    text: 'CONFIRMAR MONTO'
    optional: true
- tapOn:
    id: 'numpad-5'
    optional: true
- tapOn:
    id: 'numpad-0'
    optional: true
- tapOn:
    id: 'numpad-0'
    optional: true
- tapOn:
    id: 'caja-abrir-submit'
    optional: true

- extendedWaitUntil:
    visible:
      id: 'mi-turno-esperado'
    timeout: 10000

# ══════════════════════════════════════════════════════════════════
# Step 1: Create 2nd product — Taco ($20)
# ══════════════════════════════════════════════════════════════════
- tapOn:
    id: 'top-bar-back'

# Now on Otros grid — navigate to Productos.
- scrollUntilVisible:
    element:
      id: 'otros-productos'
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn:
    id: 'otros-productos'

- tapOn:
    id: 'stock-nuevo-producto'

- tapOn:
    id: 'producto-nombre'
- inputText: 'Taco'
- pressKey: enter

- tapOn:
    id: 'producto-precio-venta'
- eraseText
- inputText: '20'
- pressKey: enter

- tapOn:
    id: 'producto-submit'
    optional: true

- extendedWaitUntil:
    notVisible:
      id: 'nuevo-producto-modal'
    timeout: 5000

# Verify Taco appears in the stock list.
- extendedWaitUntil:
    visible:
      id: 'stock-list'
    timeout: 5000
- assertVisible:
    text: '.*Taco.*'

# ══════════════════════════════════════════════════════════════════
# Step 2: Sell Tortilla ($15, Efectivo)
# ══════════════════════════════════════════════════════════════════
- tapOn:
    id: 'tab-cobrar'
- extendedWaitUntil:
    visible:
      id: 'ventas-product-grid'
    timeout: 5000

- tapOn: 'Agregar Tortilla,.*'
- assertVisible:
    id: 'cobrar-bar'
- runFlow: shared/cobrar-ticket.yaml

- extendedWaitUntil:
    visible:
      id: 'ventas-product-grid'
    timeout: 5000

# ══════════════════════════════════════════════════════════════════
# Step 3: Sell Taco ($20, Efectivo)
# ══════════════════════════════════════════════════════════════════
- tapOn: 'Agregar Taco,.*'
- assertVisible:
    id: 'cobrar-bar'
- runFlow: shared/cobrar-ticket.yaml

- extendedWaitUntil:
    visible:
      id: 'ventas-product-grid'
    timeout: 5000

# ══════════════════════════════════════════════════════════════════
# Step 4: Assert aggregate KPI — $35.00 (both sales)
# ══════════════════════════════════════════════════════════════════
- assertVisible:
    id: 'ventas-total-card'
- assertVisible:
    text: ".*\\$35\\.00.*"

- assertVisible:
    id: 'ventas-list'

# ══════════════════════════════════════════════════════════════════
# Step 5: Cancel one sale from the Ventas tab (Track M, M-08)
# ══════════════════════════════════════════════════════════════════
# The newest row is the Taco ticket; its sheet offers «Cancelar venta»,
# which asks for a motive and the operator's NIP (CancelarTicketUseCase).
- tapOn:
    id: 'tab-ventas'
- extendedWaitUntil:
    visible:
      id: 'ventas-lista'
    timeout: 5000
- tapOn:
    id: 'venta-fila-.*'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'venta-sheet'
    timeout: 5000
- tapOn:
    id: 'venta-cancelar'
- extendedWaitUntil:
    visible:
      id: 'cancelar-venta'
    timeout: 5000
- assertVisible: 'Elige un motivo para cancelar.'
- tapOn:
    id: 'cancelar-motivo-1'
- tapOn:
    id: 'cancelar-nota'
- inputText: 'Prueba E2E'
- tapOn:
    id: 'cancelar-nip'
- inputText: '1234'
- tapOn:
    id: 'cancelar-confirmar'

# ══════════════════════════════════════════════════════════════════
# Step 6: Verify cancellation — back on the sheet, marked cancelled
# ══════════════════════════════════════════════════════════════════
- extendedWaitUntil:
    notVisible:
      id: 'cancelar-venta'
    timeout: 5000
- assertVisible:
    id: 'venta-aviso'
- assertVisible:
    id: 'venta-cancelada'
- assertVisible:
    text: '.*Me equivoqué al cobrar: Prueba E2E.*'
- tapOn:
    id: 'venta-listo'
- assertVisible:
    text: 'Cancelada'

# ══════════════════════════════════════════════════════════════════
# Step 7: Verify KPI adjusts — back to Ventas, total = $15.00
# ══════════════════════════════════════════════════════════════════
- tapOn:
    id: 'tab-cobrar'
- extendedWaitUntil:
    visible:
      id: 'ventas-product-grid'
    timeout: 5000

- assertVisible:
    id: 'ventas-total-card'
- assertVisible:
    text: ".*\\$15\\.00.*"
