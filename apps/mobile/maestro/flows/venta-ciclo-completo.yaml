# Full sales lifecycle on the POS: create a product → sell it and a mock
# product in cash → cancel the newest sale from Caja → Cancelaciones.
#
#   1. Ana signs in (in the mock only Ana has canCancelSales; the cancel use
#      case checks the signed-in operator's PIN and permission)
#   2. Quick-add "Taco E2E" ($20)
#   3. Two cash sales: Quesadilla, then Taco E2E
#   4. Caja → Cancelaciones → cancel the newest sale (PIN → reason → cash)
#
# The day's total is covered by ventas-total-y-fecha.yaml.
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/login-ana.yaml

# Step 1: create a product with quick-add.
- tapOn:
    id: 'tab-productos'
- extendedWaitUntil:
    visible:
      id: 'stock-nuevo-producto'
    timeout: 8000
- tapOn:
    id: 'stock-nuevo-producto'
- tapOn:
    id: 'producto-nombre'
- inputText: 'Taco E2E'
# Return walks nombre → código → precio (the keyboard covers precio on phones).
- pressKey: Enter
- pressKey: Enter
- inputText: '20'
- runFlow: shared/dismiss-keyboard-by-drag.yaml
- runFlow: shared/scroll-form-to-end.yaml
- tapOn:
    id: 'producto-submit'
- extendedWaitUntil:
    visible:
      id: 'stock-buscar'
    timeout: 8000

# Open the caja after creating the product: on the iPhone a tab tap made from
# the Caja screen opened "Retirar efectivo" (open question in e2e-HANDOFF).
- runFlow: shared/ensure-caja-open.yaml

# Step 2: two cash sales.
- runFlow:
    file: shared/sell-cash.yaml
    env:
      PRODUCT: 'Quesadilla'
- runFlow:
    file: shared/sell-cash.yaml
    env:
      PRODUCT: 'Taco E2E'

# Step 3: cancel the newest sale.
- tapOn:
    id: 'tab-caja'
- scrollUntilVisible:
    element:
      id: 'otros-cancelaciones'
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: 'otros-cancelaciones'
- extendedWaitUntil:
    visible:
      id: 'mobile-cancelaciones'
    timeout: 5000
- tapOn:
    id: 'cancel-btn-.*'
- extendedWaitUntil:
    visible:
      id: 'cancel-pin-input'
    timeout: 5000
# The authorization PIN is a keyboard field (PinCodeInput), not the numpad.
- tapOn:
    id: 'cancel-pin-input'
- inputText: '567890'
- extendedWaitUntil:
    visible:
      id: 'cancel-reason-input'
    timeout: 5000
- tapOn:
    id: 'cancel-reason-input'
- inputText: 'Prueba E2E'
- runFlow: shared/hide-keyboard-in-sheet.yaml
- tapOn:
    id: 'cancel-reason-submit'
# Cash to hand back is confirmed only for Efectivo sales (earlier flows on the
# shared device may have left a card or transfer sale on top of the list).
- extendedWaitUntil:
    visible:
      id: 'cancel-cash-confirm'
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible:
        id: 'cancel-cash-confirm'
    commands:
      - tapOn:
          id: 'cancel-cash-confirm'
- extendedWaitUntil:
    notVisible:
      id: 'cancel-reason-input'
    timeout: 5000
# CancelarVentaUseCase deletes the sale, so it leaves the list (no badge).
- assertNotVisible: '.*Taco E2E.*'
