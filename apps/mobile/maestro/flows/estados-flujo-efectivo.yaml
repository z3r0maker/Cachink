# Flujo de Efectivo renders sections — verify cash flow statement.
#
# Verifies:
#   1. Navigate to Estados → Flujo tab
#   2. flujo-operacion visible
#   3. flujo-total visible
#   4. flujo-diverging-bar visible (visual chart)
#
# Precondition: wizard complete, at least one venta + one egreso exist.
# Director role.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/inventario-producto.yaml
#   maestro test apps/mobile/maestro/flows/venta-efectivo.yaml
#   maestro test apps/mobile/maestro/flows/egreso-gasto.yaml
#   maestro test apps/mobile/maestro/flows/estados-flujo-efectivo.yaml
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate-director.yaml

# Navigate to the Estados tab (Director role).
- tapOn:
    id: "tab-estados"

# Verify EstadosShell renders.
- assertVisible:
    id: "estados-shell"

# Switch to the Flujo sub-tab.
- tapOn:
    id: "estados-tab-flujo"
- extendedWaitUntil:
    visible:
      id: "estados-tab-flujo"
    timeout: 3000

# --- Verify data sections render ---
- assertVisible:
    id: "flujo-operacion"
- assertVisible:
    id: "flujo-total"

# Verify the diverging bar chart renders.
- assertVisible:
    id: "flujo-diverging-bar"
