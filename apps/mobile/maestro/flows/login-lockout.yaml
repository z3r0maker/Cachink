# Operator sign-in guard (A-05): no PIN recovery on the device, and five
# wrong PINs lock PIN entry for 30 s.
#
# The lockout is the operator's own (audit F-08): it is Toni's NIP that locks,
# Ana can still sign in, and only Toni's right NIP clears it. It escalates: a
# second one in a row lasts 1 min, then 5 min, 15 min and 1 h. This flow trips
# only the first, and the suite re-seeds the device before the next flow.
#
# Precondition: device activated against the mock (activation.yaml); starts
# on the operator list or signed in (it locks the screen first).
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
- runFlow:
    when:
      visible:
        id: 'tab-turno|rail-turno|sidebar-turno'
    commands:
      - runFlow: shared/lock-caja.yaml
      # Locking shows Bloqueo for the same person; «No soy …» goes to Acceso.
      - tapOn:
          id: 'bloqueo-cambiar'
- extendedWaitUntil:
    visible:
      id: 'quick-switch'
    timeout: 20000
- tapOn:
    text: 'Toni'
- extendedWaitUntil:
    visible:
      id: 'numpad-1'
    timeout: 8000
- repeat:
    times: 5
    commands:
      - tapOn: { id: 'numpad-9' }
      - tapOn: { id: 'numpad-9' }
      - tapOn: { id: 'numpad-9' }
      - tapOn: { id: 'numpad-9' }
      - tapOn: { id: 'nip-enviar' }
      - extendedWaitUntil:
          visible:
            text: '.*(Ese NIP no es|Demasiados intentos).*'
          timeout: 10000
# The previous error text can satisfy the in-loop wait early, so wait here.
- extendedWaitUntil:
    visible:
      text: '.*Demasiados intentos.*'
    timeout: 15000
