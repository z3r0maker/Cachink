# "Ver bajo stock" navigation from the Stock screen KPI strip.
#
# Verifies:
#   1. Create product with stock below threshold (≤3 units)
#   2. Navigate to Stock screen
#   3. stock-bajo-summary-ver or stock-bajo-ver button visible
#   4. Tap → verify navigates to filtered bajo-stock view
#
# Precondition: wizard complete, at least one product with low/zero stock.
# The product "Tortilla" starts at 0 stock or has stock ≤3 from prior flows.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/inventario-producto.yaml
#   maestro test apps/mobile/maestro/flows/stock-bajo-ver-link.yaml
# x-entrypoint: demo
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to the Productos tab.
- tapOn:
    id: "tab-productos"

# Switch to Stock sub-tab.
- tapOn:
    id: "productos-tab-stock"

# Verify the "Ver bajo stock" link/button is visible.
# Two possible testIDs depending on the layout variant.
- assertVisible:
    id: "stock-kpi-bajo"

# Tap the bajo stock KPI to navigate to the filtered view.
- tapOn:
    id: "stock-bajo-ver"
    optional: true
- tapOn:
    id: "stock-bajo-summary-ver"
    optional: true
