# iPad smoke: an activated operator reaches every capture tab.
# Tabs: Ventas | Caja | Gastos | Productos (appTabs, v1 flags).
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

- assertVisible:
    id: 'bottom-tab-bar'
- assertVisible:
    id: 'tab-ventas'
- assertVisible:
    id: 'tab-caja'
- assertVisible:
    id: 'tab-gastos'
- assertVisible:
    id: 'tab-productos'

- tapOn:
    id: 'tab-ventas'
- extendedWaitUntil:
    visible:
      id: 'ventas-product-grid'
    timeout: 8000
    optional: true

- tapOn:
    id: 'tab-caja'
- tapOn:
    id: 'tab-gastos'
- extendedWaitUntil:
    visible:
      id: 'egresos-nuevo'
    timeout: 8000
- tapOn:
    id: 'tab-productos'
- extendedWaitUntil:
    visible:
      id: 'stock-nuevo-producto'
    timeout: 8000

- runFlow: shared/navigate-to-settings.yaml
