# Feature flag deep cascade: 3-level chain (stock → conversionMateriaPrima → conversionAutomatica).
#
# Verifies:
#   1. Enable stock (default) → enable conversionMateriaPrima → enable conversionAutomatica
#   2. Disable conversionMateriaPrima → conversionAutomatica auto-disables
#   3. Re-enable conversionMateriaPrima + conversionAutomatica
#   4. Disable stock → both conversionMateriaPrima and conversionAutomatica auto-disable
#
# Precondition: wizard + director-setup complete, logged in as Director.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/funciones-conversion-auto-chain.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to Otros → Funciones.
- tapOn:
    id: "tab-otros"
- scrollUntilVisible:
    element:
      id: "otros-funciones"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "otros-funciones"

# Verify Funciones screen renders.
- assertVisible:
    id: "funciones-negocio"

# --- Step 1: Enable the full 3-level chain ---
# Stock is ON by default. Enable conversionMateriaPrima.
- tapOn:
    id: "flag-conversionMateriaPrima-switch"

# Enable conversionAutomatica (depends on conversionMateriaPrima).
- tapOn:
    id: "flag-conversionAutomatica-switch"

# --- Step 2: Disable middle node → leaf auto-disables ---
- tapOn:
    id: "flag-conversionMateriaPrima-switch"

# conversionAutomatica should have auto-disabled. Navigate away and back
# to verify persisted state.
- tapOn:
    id: "tab-otros"
- scrollUntilVisible:
    element:
      id: "otros-funciones"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "otros-funciones"

# Attempt to tap conversionAutomatica — it should be blocked now.
- tapOn:
    id: "flag-conversionAutomatica-switch"
- assertVisible: "Requiere"

# --- Step 3: Re-enable the chain, then disable root ---
- tapOn:
    id: "flag-conversionMateriaPrima-switch"
- tapOn:
    id: "flag-conversionAutomatica-switch"

# Now disable stock (root) → both children auto-disable.
- tapOn:
    id: "flag-stock-switch"

# Navigate to verify stock-dependent features are hidden.
- tapOn:
    id: "tab-otros"
- tapOn:
    id: "otros-productos"
- assertNotVisible:
    id: "productos-tab-stock"

# Re-enable stock for subsequent flows.
- tapOn:
    id: "tab-otros"
- scrollUntilVisible:
    element:
      id: "otros-funciones"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "otros-funciones"
- tapOn:
    id: "flag-stock-switch"
