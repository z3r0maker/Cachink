# Delete a producto via the detail popover and verify it's removed.
#
# Covers CRUD Delete for Productos.
#
# Precondition: wizard + at least one producto with 0 stock exists.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/inventario-producto.yaml
#   maestro test apps/mobile/maestro/flows/eliminar-producto.yaml
#
# Note: the inventario-producto flow creates "Tortilla" with 0
# initial stock (the entrada in that flow is optional). If the
# product has stock > 0, the confirm dialog will show a warning
# but still allows deletion with force=true.
#
# ⚠️  This flow DESTROYS state — run last in any chain that
# expects the product to still exist afterwards.
# x-entrypoint: demo
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Open the product's detail via search (Tamagui onPress-cards match by
# `text: "<label>.*"`, containers/inputs by `id:`; see find-producto-stock.yaml).
- runFlow: shared/find-producto-stock.yaml
- tapOn:
    id: "producto-card-.*"

# Tap the "Eliminar producto" action — this opens a ConfirmDialog.
- assertVisible:
    text: "Eliminar producto.*"
- tapOn:
    text: "Eliminar producto.*"

# ConfirmDialog appears; confirm the deletion.
- assertVisible:
    id: "confirm-dialog"
- tapOn:
    id: "confirm-dialog-confirm"

# Back on the (filtered) stock list, the product row is gone.
- assertNotVisible:
    id: "producto-card-.*"
