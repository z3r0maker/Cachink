# «Reportar un problema», the doors (M-23, ADR-162 §1; boards RpPuerta,
# RpHoja, RpAjustes): the yellow help button in the header opens the sheet
# «¿Qué pasó?» from every tab, so does Mi turno's row «¿Algo no funciona?»,
# and so does «Reportar un problema» in Ajustes. The sheet shows the four
# cards and «Enviar a Xangarro», and «Cancelar» closes it without sending.
#
# Nothing is sent here; `bug-report-enviar.yaml` sends, and
# `bug-report-sin-internet.yaml` sends with the server gone.
# x-entrypoint: activated
appId: mx.xangarro.mobile
tags:
  - settings
  - observability
  - regression
---
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/login-operator.yaml

# Inicio: the whole sheet, once.
- tapOn:
    id: 'tab-inicio|rail-inicio|sidebar-inicio'
- tapOn:
    id: 'ayuda-reportar'
- extendedWaitUntil:
    visible:
      id: 'reportar-hoja'
    timeout: 5000
- assertVisible: '¿Qué pasó\?'
- assertVisible:
    id: 'reportar-opcion-could_not_charge'
- assertVisible:
    id: 'reportar-opcion-froze_or_closed'
- assertVisible:
    id: 'reportar-opcion-wrong_number'
- assertVisible:
    id: 'reportar-opcion-other'
- assertVisible: 'No me dejó cobrar'
- assertVisible:
    id: 'reportar-enviar'
- tapOn:
    id: 'reportar-cancelar'
- extendedWaitUntil:
    notVisible:
      id: 'reportar-hoja'
    timeout: 5000

# Cobrar, Ventas and Mi turno: the same button opens the same sheet.
- tapOn:
    id: 'tab-cobrar|rail-cobrar|sidebar-cobrar'
- tapOn:
    id: 'ayuda-reportar'
- extendedWaitUntil:
    visible:
      id: 'reportar-hoja'
    timeout: 5000
- tapOn:
    id: 'reportar-cancelar'
- extendedWaitUntil:
    notVisible:
      id: 'reportar-hoja'
    timeout: 5000

- tapOn:
    id: 'tab-ventas|rail-ventas|sidebar-ventas'
- tapOn:
    id: 'ayuda-reportar'
- extendedWaitUntil:
    visible:
      id: 'reportar-hoja'
    timeout: 5000
- tapOn:
    id: 'reportar-cancelar'
- extendedWaitUntil:
    notVisible:
      id: 'reportar-hoja'
    timeout: 5000

- tapOn:
    id: 'tab-turno|rail-turno|sidebar-turno'
- tapOn:
    id: 'ayuda-reportar'
- extendedWaitUntil:
    visible:
      id: 'reportar-hoja'
    timeout: 5000
- tapOn:
    id: 'reportar-cancelar'
- extendedWaitUntil:
    notVisible:
      id: 'reportar-hoja'
    timeout: 5000

# Mi turno's row, between «Registros por enviar» and «Ajustes de la caja».
- scrollUntilVisible:
    element:
      id: 'otros-reportar'
    direction: DOWN
    timeout: 8000
    centerElement: true
- assertVisible:
    id: 'otros-reportar'
    text: '.*¿Algo no funciona\?.*'
- tapOn:
    id: 'otros-reportar'
- extendedWaitUntil:
    visible:
      id: 'reportar-hoja'
    timeout: 5000
- tapOn:
    id: 'reportar-cancelar'
- extendedWaitUntil:
    notVisible:
      id: 'reportar-hoja'
    timeout: 5000

# Ajustes: a row with its icon under «Ayuda», no longer a grey button.
- runFlow: shared/navigate-to-settings.yaml
- scrollUntilVisible:
    element:
      id: 'settings-open-bug-report'
    direction: DOWN
    timeout: 8000
    centerElement: true
- assertVisible:
    id: 'settings-open-bug-report'
    text: '.*Reportar un problema.*'
- tapOn:
    id: 'settings-open-bug-report'
- extendedWaitUntil:
    visible:
      id: 'reportar-hoja'
    timeout: 5000
- tapOn:
    id: 'reportar-cancelar'
- extendedWaitUntil:
    notVisible:
      id: 'reportar-hoja'
    timeout: 5000
