# Open the Bug Report sheet from Settings → Sistema → "Reportar un problema".
# Verifies: the bug report sheet opens, shows description input,
# the share/submit button is visible, and the sheet can be closed.
#
# The BugReportSheet is a bottom sheet triggered from the "Reportar un
# problema" button in Settings Sistema. It auto-attaches audit events +
# errors and supports server-first submit (when consent on) or
# file-share fallback.
# x-entrypoint: activated
appId: mx.xangarro.mobile
tags:
  - settings
  - observability
  - regression
---
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/login-operator.yaml
- runFlow: shared/navigate-to-settings.yaml

# The sheet opens from Ajustes' device section, below the fold.
- scrollUntilVisible:
    element:
      id: 'settings-open-bug-report'
    direction: DOWN
    timeout: 8000
    centerElement: true
- tapOn:
    id: 'settings-open-bug-report'
- extendedWaitUntil:
    visible:
      id: 'bug-report-sheet'
    timeout: 5000
- assertVisible:
    id: 'bug-report-description-input'
# The primary action depends on the device, not on this flow (N-81): a linked
# phone with reports turned on sends through the device API («enviar») and
# keeps sharing as the fallback row; otherwise sharing is the only door. One of
# the two must be there (ids are regular expressions): a sheet with no way out
# is the failure.
- assertVisible:
    id: 'bug-report-(submit|share)-btn'
- runFlow:
    when:
      visible:
        id: 'bug-report-submit-btn'
    commands:
      - assertVisible:
          id: 'bug-report-share-fallback-btn'
- tapOn:
    text: '✕'
- extendedWaitUntil:
    notVisible:
      id: 'bug-report-sheet'
    timeout: 5000
