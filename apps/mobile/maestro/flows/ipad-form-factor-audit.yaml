# iPad form-factor audit — walk every capture surface and assert the testIDs
# the flow library drives stay reachable at the iPad ($gtMd) breakpoint.
#
# PURPOSE: responsive breakpoints can reflow, hide or clip controls on iPad.
# This is a fast tripwire before the full regression.
#
# What it audits:
#   1. Ventas POS — product grid, search, a tile, cart strip, Cobrar, method picker
#   2. Gastos — Nuevo pago sheet fields and submit
#   3. Productos — quick-add form fields and submit
#   4. Caja — status card and the tool grid (Cancelaciones)
#   5. Configuración — reachable from the top bar
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- runFlow: shared/ensure-caja-open.yaml

# 1. Ventas POS.
- tapOn:
    id: 'tab-ventas'
- extendedWaitUntil:
    visible:
      id: 'ventas-product-grid'
    timeout: 8000
- tapOn:
    id: 'ventas-product-search'
- eraseText
- inputText: 'Quesadilla'
- hideKeyboard
- tapOn:
    id: 'producto-tile-.*'
- assertVisible:
    id: 'cart-strip'
- tapOn:
    id: 'cart-checkout-btn'
- extendedWaitUntil:
    visible:
      id: 'checkout-method-picker'
    timeout: 6000
- assertVisible:
    id: 'checkout-method-continue'
- tapOn:
    id: 'top-bar-back'
    optional: true

# 2. Gastos: the Nuevo pago sheet.
- tapOn:
    id: 'tab-gastos'
- tapOn:
    id: 'egresos-nuevo'
- extendedWaitUntil:
    visible:
      id: 'gasto-concepto'
    timeout: 6000
- assertVisible:
    id: 'gasto-monto'
- assertVisible:
    id: 'gasto-submit'
- tapOn:
    id: 'nuevo-egreso-cancel'

# 3. Productos: quick-add.
- tapOn:
    id: 'tab-productos'
- tapOn:
    id: 'stock-nuevo-producto'
- extendedWaitUntil:
    visible:
      id: 'producto-nombre'
    timeout: 6000
- assertVisible:
    id: 'producto-scan'
- assertVisible:
    id: 'producto-precio-venta'
- scrollUntilVisible:
    element:
      id: 'producto-submit'
    direction: DOWN
    timeout: 8000
- tapOn:
    id: 'top-bar-back'

# 4. Caja.
- tapOn:
    id: 'tab-caja'
- assertVisible:
    id: 'caja-status-card'
- scrollUntilVisible:
    element:
      id: 'otros-cancelaciones'
    direction: DOWN
    timeout: 5000

# 5. Configuración.
- runFlow: shared/navigate-to-settings.yaml
