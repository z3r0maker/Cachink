# A merma with its reason and a note (Track M, M-09; MvInventario): «Se
# rompió» and the note show together under «Movimientos».
#
# Precondition: signed in with an open turno, and a tracked product "Tortilla"
# with stock.
# x-entrypoint: demo
appId: mx.xangarro.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- runFlow: shared/find-producto-stock.yaml
- tapOn:
    id: 'inventario-fila-.*'
- tapOn:
    id: 'mover-tipo-Merma'
- assertNotVisible:
    id: 'mover-proveedor'
- tapOn:
    id: 'mover-motivo-Se rompió'
- tapOn:
    id: 'mover-nota'
- inputText: 'Se cayó al piso'
- hideKeyboard
- tapOn:
    id: 'mover-registrar'
- extendedWaitUntil:
    visible:
      id: 'inventario-toast'
    timeout: 5000
- tapOn:
    id: 'inventario-tabs-movimientos'
- assertVisible: '.*Se rompió · Se cayó al piso.*'
