# Stock salida with motivo + nota fields.
#
# Verifies:
#   1. Navigate to product → tap "Salida"
#   2. movimiento-tipo-toggle visible in modal
#   3. Fill movimiento-motivo (reason for salida)
#   4. Fill movimiento-nota (optional note)
#   5. Submit → movement recorded
#
# Precondition: wizard complete, product "Tortilla" exists with stock ≥ 3.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/inventario-producto.yaml
#   maestro test apps/mobile/maestro/flows/producto-entrada-stock.yaml
#   maestro test apps/mobile/maestro/flows/movimiento-salida-con-motivo.yaml
# x-entrypoint: demo
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to the Productos tab.
- tapOn:
    id: "tab-productos"

# Tap the product card to open ProductoDetailPopover.
- tapOn: "Tortilla"
- assertVisible:
    id: "producto-detail-popover"

# Tap "Salida" to open MovimientoModal.
- tapOn:
    id: "producto-detail-salida"

# MovimientoModal opens.
- assertVisible:
    id: "movimiento-modal"

# Verify the tipo toggle is visible.
- assertVisible:
    id: "movimiento-tipo-toggle"

# Enter quantity.
- tapOn:
    id: "movimiento-cantidad"
- eraseText
- inputText: "2"

# Fill the motivo (reason) field.
- tapOn:
    id: "movimiento-motivo"
- inputText: "Producto dañado"

# Fill the nota (optional note) field.
- tapOn:
    id: "movimiento-nota"
- inputText: "Encontrado en revisión matutina"

# Submit the movement.
- tapOn:
    id: "movimiento-submit"

# Modal closes — movement recorded.
- assertNotVisible:
    id: "movimiento-modal"
