# Stock salida with motivo + nota fields.
#
# Verifies:
#   1. Navigate to product → tap "Salida"
#   2. movimiento-tipo-toggle visible in modal
#   3. Fill movimiento-motivo (reason for salida)
#   4. Fill movimiento-nota (optional note)
#   5. Submit → movement recorded
#
# Precondition: wizard complete, product "Tortilla" exists with stock ≥ 3.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/inventario-producto.yaml
#   maestro test apps/mobile/maestro/flows/producto-entrada-stock.yaml
#   maestro test apps/mobile/maestro/flows/movimiento-salida-con-motivo.yaml
# x-entrypoint: demo
appId: mx.cachink.mobile
# TODO(e2e): selectors here are correct (find-producto-stock, text-regex detail
# buttons, MOTIVO dropdown select, REGISTRAR), but the final salida submit does
# NOT close the modal — validateCantidad appears not to see the WheelQuantityPicker
# value on the salida path (entrada with the identical field submits fine). Needs
# an app-behavior look at MovimientoModal submit for tipo=salida. Not yet green.
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Open the product's detail via search (onPress-cards match by text-regex).
- runFlow: shared/find-producto-stock.yaml
- tapOn:
    id: "producto-card-.*"

# Tap "Salida" to open the MovimientoModal (pre-set to tipo=salida).
- assertVisible:
    text: "Salida.*"
- tapOn:
    text: "Salida.*"

# MovimientoModal open — CANTIDAD / MOTIVO / NOTA.
- assertVisible:
    text: "CANTIDAD.*"

# CANTIDAD is a WheelQuantityPicker (scroll drum). Interacting with it commits the
# selected value into form state (needed for validateCantidad on submit).
- tapOn:
    id: "movimiento-cantidad"
- eraseText
- inputText: "2"

# Fill the motivo (reason) — for Salida it's a DROPDOWN; open it and pick a reason.
- tapOn:
    id: "movimiento-motivo"
- tapOn:
    text: "Merma.*"

# (NOTA is optional and not always rendered for Salida — skipped.)

# Submit the movement — the "REGISTRAR" button.
- tapOn:
    text: "REGISTRAR.*"

# Modal closes — movement recorded.
- assertNotVisible:
    text: "CANTIDAD.*"
