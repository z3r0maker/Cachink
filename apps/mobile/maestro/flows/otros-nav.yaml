# Otros tab navigation E2E — tap grid items → verify screens render.
#
# Verifies:
#   1. Tap Otros tab → grid renders with enabled items
#   2. Tap each enabled item → screen renders → back
#
# Precondition: wizard + director-setup complete, feature flags with
# caja + usuarios enabled (default for Director). Logged in as Director.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/otros-nav.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to Otros tab.
- tapOn:
    id: "tab-otros"

# Grid renders.
- assertVisible:
    id: "otros-route"

# --- Usuarios ---
- scrollUntilVisible:
    element:
      id: "otros-usuarios"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "otros-usuarios"
- extendedWaitUntil:
    visible:
      id: "usuarios-route"
    timeout: 5000
- tapOn:
    id: "top-bar-back"

# --- Funciones ---
- scrollUntilVisible:
    element:
      id: "otros-funciones"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "otros-funciones"
- extendedWaitUntil:
    visible:
      id: "funciones-route"
    timeout: 5000
- tapOn:
    id: "top-bar-back"

# Back on Otros grid.
- assertVisible:
    id: "otros-route"
