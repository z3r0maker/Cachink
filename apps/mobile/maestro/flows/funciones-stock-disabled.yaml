# Stock-disabled UX E2E — toggle stock OFF → verify no stock impact.
#
# Verifies:
#   1. Toggle stock OFF → create venta → no stock movement created
#   2. Products list doesn't show stock column
#
# Precondition: demo mode seeded (products + users exist).
appId: mx.cachink.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Toggle stock OFF via Otros → Funciones.
- tapOn:
    id: "tab-otros"
- tapOn:
    id: "otros-funciones"
- tapOn:
    id: "flag-stock-switch"

# Navigate to Productos via Otros — stock sub-tab hidden.
- tapOn:
    id: "tab-otros"
- tapOn:
    id: "otros-productos"
- assertNotVisible:
    id: "productos-tab-stock"

# Verify no stock column in products list.
- assertNotVisible:
    id: "producto-stock-column"

# Create a venta (to verify no stock movement is created).
- tapOn:
    id: "tab-ventas"

# Add product to cart and checkout.
- tapOn: "Quesadilla"
- assertVisible:
    id: "cart-strip"
- tapOn:
    id: "cart-checkout-btn"
- extendedWaitUntil:
    visible:
      id: "checkout-method-picker"
    timeout: 5000
- tapOn:
    id: "checkout-method-continue"
- extendedWaitUntil:
    visible:
      id: "checkout-efectivo"
    timeout: 5000
- tapOn: "\\$50"
- tapOn:
    id: "checkout-efectivo-submit"

# Switch back to Director, check Productos → Movimientos tab absent.
- tapOn:
    id: "top-bar-role-chip"
    optional: true
- tapOn:
    id: "role-director-select"
    optional: true
- tapOn:
    id: "tab-otros"
- tapOn:
    id: "otros-productos"
- assertNotVisible:
    id: "productos-tab-movimientos"
