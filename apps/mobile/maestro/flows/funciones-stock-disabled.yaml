# Stock-disabled UX E2E — toggle stock OFF → verify no stock impact.
#
# NOTE: Requires a RELEASE build. In the Expo dev-client, the gear icon
# triggers the Expo developer menu instead of the app Settings screen.
#
# Verifies:
#   1. Toggle stock OFF → create venta → no stock movement created
#   2. Products list doesn't show stock column
#
# Precondition: demo mode seeded (products + users exist).
# x-entrypoint: demo
appId: mx.cachink.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate-director.yaml

# Toggle stock OFF via Settings → Funciones.
# Navigate to Otros first (gear on Home opens Expo dev menu).
- tapOn:
    id: "tab-otros"
- runFlow: shared/navigate-to-settings.yaml
- extendedWaitUntil:
    visible:
      id: "settings-funciones"
    timeout: 5000
- tapOn:
    id: "settings-funciones"
- tapOn:
    id: "flag-stock-switch"
- tapOn:
    id: "top-bar-back"
- back

# Navigate to Productos via Otros — stock sub-tab hidden.
- tapOn:
    id: "tab-otros"
- scrollUntilVisible:
    element:
      id: "otros-productos"
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn:
    id: "otros-productos"
- assertNotVisible:
    id: "productos-tab-stock"

# Verify no stock column in products list.
- assertNotVisible:
    id: "producto-stock-column"

# Create a venta (to verify no stock movement is created).
- tapOn:
    id: "tab-ventas"

# Add product to cart and checkout.
- tapOn: "Quesadilla"
- assertVisible:
    id: "cart-strip"
- tapOn:
    id: "cart-checkout-btn"
- extendedWaitUntil:
    visible:
      id: "checkout-method-picker"
    timeout: 5000
- tapOn:
    id: "checkout-method-continue"
- extendedWaitUntil:
    visible:
      id: "checkout-efectivo"
    timeout: 5000
- tapOn: "\\$50"
- tapOn:
    id: "checkout-efectivo-submit"

# Switch back to Director, check Productos → Movimientos tab absent.
- tapOn:
    id: "top-bar-role-chip"
    optional: true
- tapOn:
    id: "role-director-select"
    optional: true
- tapOn:
    id: "tab-otros"
- tapOn:
    id: "otros-productos"
- assertNotVisible:
    id: "productos-tab-movimientos"
