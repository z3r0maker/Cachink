# Corte de día duplicate — second corte same day rejected.
#
# After running a corte de día, attempt to run another one for the
# same date. The use-case throws "Ya existe un corte" — assert
# the UI shows the error or disables the button.
#
# Precondition: wizard mode + caja opened + closed + corte done.
# x-entrypoint: wizard
appId: mx.cachink.mobile
tags:
  - caja
  - corte
  - edge-case
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Open and close caja to enable corte.
- tapOn:
    id: "tab-caja"
- tapOn:
    id: "numpad-5"
    optional: true
- tapOn:
    id: "numpad-0"
    optional: true
- tapOn:
    id: "numpad-0"
    optional: true
- tapOn:
    id: "caja-abrir-submit"
    optional: true
- extendedWaitUntil:
    visible:
      id: "caja-status-card"
    timeout: 10000

# Close the turno.
- tapOn:
    id: "caja-cerrar-btn"
- extendedWaitUntil:
    visible:
      id: "caja-cerrar-sheet"
    timeout: 5000
- tapOn:
    id: "numpad-5"
- tapOn:
    id: "numpad-0"
- tapOn:
    id: "numpad-0"
- tapOn:
    id: "caja-cerrar-submit"
- extendedWaitUntil:
    visible:
      id: "caja-cerrado-banner"
    timeout: 5000

# Run first corte de día.
- tapOn:
    id: "corte-de-dia-btn"
- extendedWaitUntil:
    visible:
      id: "corte-sheet"
    timeout: 5000
- tapOn:
    id: "numpad-5"
- tapOn:
    id: "numpad-0"
- tapOn:
    id: "numpad-0"
- tapOn:
    id: "corte-submit"
- extendedWaitUntil:
    visible:
      id: "corte-success"
    timeout: 5000

# Try to run second corte — should be blocked.
# The corte button should be disabled or show "already exists" message.
- tapOn:
    id: "corte-de-dia-btn"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Ya existe un corte"
    timeout: 5000
    optional: true
