# Gastos with nothing recorded yet (Track M, M-08; MvGastos): Don and the
# empty state, and «Registrar gasto» still in the thumb zone.
#
# Precondition: fresh install, wizard complete, no gastos today.
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/login-operator.yaml
- runFlow: shared/ensure-caja-open.yaml
- tapOn:
    id: 'tab-inicio|rail-inicio|sidebar-inicio'
- extendedWaitUntil:
    visible:
      id: 'inicio-hero-listo'
    timeout: 8000
- waitForAnimationToEnd
- runFlow:
    file: shared/abrir-atajo.yaml
    env:
      ATAJO: gastos
- extendedWaitUntil:
    visible:
      id: 'mobile-gastos'
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: 'mobile-gastos'
    timeout: 8000
# A just-opened turno has no gastos: Don's empty state owns the middle, no
# figures or chips, and «Registrar gasto» is fixed at the foot (RvGastos).
- assertVisible:
    id: 'gastos-sin-gastos'
- assertVisible:
    id: 'gastos-abrir-registrar'
- assertNotVisible:
    id: 'gastos-cifras'
