# Egresos empty state — verify empty state renders on fresh install.
#
# Verifies:
#   1. Navigate to Egresos tab before any egresos exist
#   2. empty-egresos empty state visible
#   3. empty-egresos-cta button visible
#   4. Tap CTA → NuevoEgreso modal opens
#
# Precondition: wizard complete, NO egresos created yet.
# Must run BEFORE any egreso-creating flow in regression suite.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/empty-egresos.yaml
# x-entrypoint: demo
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate-wizard.yaml

# Navigate to the Egresos tab.
- tapOn:
    id: "tab-gastos"

# No egresos yet → empty state should render.
- assertVisible:
    id: "empty-egresos"

# CTA button to create first egreso should be visible.
- assertVisible:
    id: "empty-egresos-cta"

# Tap the CTA to verify it opens the NuevoEgreso modal.
- tapOn:
    id: "empty-egresos-cta"
- assertVisible: "Nuevo egreso"
