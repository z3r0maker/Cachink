# Gastos with nothing recorded yet (Track M, M-08; MvGastos): Don and the
# empty state, and «Registrar gasto» still in the thumb zone.
#
# Precondition: fresh install, wizard complete, no gastos today.
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/login-operator.yaml
- runFlow: shared/ensure-caja-open.yaml
- tapOn:
    id: 'tab-inicio|rail-inicio|sidebar-inicio'
- extendedWaitUntil:
    visible:
      id: 'inicio-hero-listo'
    timeout: 8000
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: 'inicio-atajo-gastos'
    commands:
      - tapOn: { id: 'inicio-atajo-gastos' }
- runFlow:
    when:
      # Still on Inicio = the atajo never existed (the tablet drops
      # it); «atajo gone» would also be true a beat AFTER the phone
      # taps it and navigates away, and the deep link would then
      # fight the navigation with the iOS «Open in …?» dialog.
      visible:
        id: 'inicio-hero-listo'
    commands:
      # The atajos are phone-only (inicio-screen drops them when wide); the
      # tablet deep-links the same screen (the navigate-to-settings pattern).
      - openLink: 'xangarro://gastos'
- extendedWaitUntil:
    visible:
      id: 'mobile-gastos'
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: 'mobile-gastos'
    timeout: 8000
# A just-opened turno has no gastos: the empty state owns the middle, and
# «Registrar gasto» stays in the thumb zone.
- assertVisible:
    id: 'gastos-sin-gastos'
- assertVisible:
    id: 'gastos-abrir-registrar'
