# Wizard Step 1 → tap join-existing link → Step 3 renders → tap back → Step 1.
# Covers Gap T (Phase 17): wizard-step1-join-existing-link testID.
# Validates navigation without requiring cloud/LAN backend.
#
# testIDs exercised:
#   wizard-step1-join-existing-link, wizard-step3-lan, wizard-step3-cloud,
#   wizard-back
#
# Precondition: fresh install. Run via the wrapper script:
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-join-existing-link.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Review items #1/#2: the wizard is no longer the first-run entry
# point. It lives in Configuración → Sistema → "Sincronización y
# dispositivos"; the shared subflow owns that path.
- runFlow: shared/open-sync-wizard.yaml

# Verify the "join existing" secondary link is visible.
- assertVisible:
    id: "wizard-step1-join-existing-link"

# Tap the join-existing link → Step 3 (join existing) renders.
- tapOn:
    id: "wizard-step1-join-existing-link"
- extendedWaitUntil:
    visible:
      id: "wizard-step3-lan"
    timeout: 5000

# Verify both join cards render (LAN + Cloud).
- assertVisible:
    id: "wizard-step3-lan"
- assertVisible:
    id: "wizard-step3-cloud"

# MVP: cloud sign-in is disabled — note explains why, tap is a no-op.
- assertVisible:
    id: "wizard-step3-cloud-note"
- tapOn:
    id: "wizard-step3-cloud-card"
- assertNotVisible:
    id: "cloud-onboarding-screen"
- assertVisible:
    id: "wizard-step3-lan"

# Tap back → returns to Step 1.
- tapOn:
    id: "wizard-back"
- assertVisible:
    id: "wizard-step1-solo-card"
- assertVisible:
    id: "wizard-step1-multi-card"
