# «Reportar un problema», sent with a tap and no typing (M-23, ADR-162 §5;
# board RpHoja): from Cobrar, the help button opens the sheet, one card is
# tapped, «Enviar a Xangarro» sends the report through the device API
# (`POST /api/v1/support/bug-report` on the mock, with the device's own token)
# and the sheet says «Gracias, …. Ya nos llegó.». «Listo» closes it.
#
# It sends whatever the automatic-reports switch in Ajustes says: the flow
# never touches that switch, and a freshly linked phone has it off.
# x-entrypoint: activated
appId: mx.xangarro.mobile
tags:
  - settings
  - observability
  - regression
---
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/login-operator.yaml

- tapOn:
    id: 'tab-cobrar|rail-cobrar|sidebar-cobrar'
- tapOn:
    id: 'ayuda-reportar'
- extendedWaitUntil:
    visible:
      id: 'reportar-hoja'
    timeout: 5000

# One tap is the whole report; nothing is typed.
- tapOn:
    id: 'reportar-opcion-froze_or_closed'
- tapOn:
    id: 'reportar-enviar'
- extendedWaitUntil:
    visible:
      id: 'reportar-resultado-sent'
    timeout: 15000
- assertVisible: 'Gracias.*Ya nos llegó\.'
- assertNotVisible: 'No se pudo enviar'

- tapOn:
    id: 'reportar-listo'
- extendedWaitUntil:
    notVisible:
      id: 'reportar-hoja'
    timeout: 5000
