# Verify egresos total card and date display after creating egresos.
#
# Verifies:
#   1. After creating egresos, navigate to Egresos tab
#   2. egresos-total-card visible with formatted total
#   3. egresos-fecha shows today's date
#
# Precondition: wizard complete, at least one egreso exists.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/egreso-gasto.yaml
#   maestro test apps/mobile/maestro/flows/egresos-total-y-fecha.yaml
# x-entrypoint: demo
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to the Egresos tab.
- tapOn:
    id: "tab-gastos"

# Verify the total card is visible with a formatted negative amount.
- assertVisible:
    id: "egresos-total-card"

# Verify the date display shows today.
- assertVisible:
    id: "egresos-fecha"
