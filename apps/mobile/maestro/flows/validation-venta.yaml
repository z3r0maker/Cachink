# POS guard: a sale cannot be settled with an empty cart.
#
# Verifies:
#   1. Empty cart → empty-cart-hint shown, no "Cobrar" button
#   2. Tapping a product adds it → cart strip + "Cobrar" appear
#
# The free-text manual sale form was retired with the tap-to-cart POS (A-16).
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- runFlow: shared/ensure-caja-open.yaml

- tapOn:
    id: 'tab-ventas'
- extendedWaitUntil:
    visible:
      id: 'ventas-product-grid'
    timeout: 5000

- assertVisible:
    id: 'empty-cart-hint'
- assertNotVisible:
    id: 'cart-checkout-btn'

- tapOn: 'Quesadilla'
- assertVisible:
    id: 'cart-strip'
- assertVisible:
    id: 'cart-checkout-btn'
