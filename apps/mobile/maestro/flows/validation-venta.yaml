# POS guard: a sale cannot be settled with an empty cart.
#
# Verifies:
#   1. Empty cart → empty-cart-hint shown, no "Cobrar" button
#   2. Tapping a product adds it → "Cobrar" and the cart strip appear
#      (on phones the cart sits below the grid, so the flow scrolls to it)
#
# The free-text manual sale form was retired with the tap-to-cart POS (A-16).
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- runFlow: shared/ensure-caja-open.yaml

- tapOn:
    id: 'tab-ventas'
- extendedWaitUntil:
    visible:
      id: 'ventas-product-grid'
    timeout: 5000

- scrollUntilVisible:
    element:
      id: 'empty-cart-hint'
    direction: DOWN
    timeout: 20000
- assertNotVisible:
    id: 'cart-checkout-btn'

- runFlow:
    file: shared/add-to-cart.yaml
    env:
      PRODUCT: 'Quesadilla'
- scrollUntilVisible:
    element:
      id: 'cart-strip'
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: 'cart-checkout-btn'
