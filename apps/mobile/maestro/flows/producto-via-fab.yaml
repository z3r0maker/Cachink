# Create a new producto via the add-product affordance and verify it appears.
#
# The FAB (stock-fab) is iPhone-only; the header button (stock-nuevo-producto) renders
# on both devices and drives the same create flow. Tapping it navigates to the full
# /nuevo-producto quick-add screen (A-09). Required fields: nombre and
# precio-venta.
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Productos tab -> add product (header button; FAB is iPhone-only).
- tapOn:
    id: 'tab-productos'
- tapOn:
    id: 'stock-nuevo-producto'

# Full-page create form.
- assertVisible:
    id: 'producto-nombre'
- tapOn:
    id: 'producto-nombre'
- inputText: 'Refresco Cola'
# Return walks nombre → código → precio (the keyboard covers precio on phones).
- pressKey: Enter
- pressKey: Enter
- inputText: '25'
- runFlow: shared/dismiss-keyboard-by-drag.yaml

# Submit (fullWidth Btn inside the scroll — scroll to it if needed).
- runFlow: shared/scroll-form-to-end.yaml
- tapOn:
    id: 'producto-submit'

# Back on the stock list — verify the new product via search.
- extendedWaitUntil:
    visible:
      id: 'stock-buscar'
    timeout: 8000
- tapOn:
    id: 'stock-buscar'
- eraseText
- inputText: 'Refresco Cola'
- assertVisible:
    text: '.*Refresco Cola.*'
- hideKeyboard
