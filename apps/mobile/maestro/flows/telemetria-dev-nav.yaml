# Navigate to Telemetría dev dashboard (Director, __DEV__ only).
# Route: /telemetria (via Otros grid → telemetria card, dev builds only)
# Verifies: telemetria screen renders, timeline + filter bar visible.
#
# NOTE: This flow only works in development builds (__DEV__ === true).
# The telemetria card is hidden in production builds.
# x-entrypoint: wizard
appId: mx.cachink.mobile
tags:
  - otros
  - telemetria
  - debug
  - observability
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate-director.yaml

# Director Otros tab should show telemetria card in dev
- tapOn:
    id: "tab-otros"
- extendedWaitUntil:
    visible:
      id: "otros-route"
    timeout: 5000

# Scroll to telemetria card (last card in grid, below fold)
- scrollUntilVisible:
    element:
      id: "otros-telemetria"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "otros-telemetria"
# Verify key sub-components render (the telemetria screen shows
# operation stats and filter buttons).
- extendedWaitUntil:
    visible: "Operaciones"
    timeout: 5000
- assertVisible: "Errores"
