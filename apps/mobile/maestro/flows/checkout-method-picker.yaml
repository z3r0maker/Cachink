# Verify the multi-step checkout flow renders the method picker.
# Precondition: demo mode seeded (products + users exist).
# x-entrypoint: demo
appId: mx.cachink.mobile
tags:
  - ventas
  - checkout
  - regression
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- runFlow: shared/ensure-caja-open.yaml

# Navigate to Ventas tab and tap a product to add to cart.
- tapOn:
    id: "tab-ventas"
- extendedWaitUntil:
    visible:
      id: "ventas-product-grid"
    timeout: 5000
- tapOn: "Quesadilla"

# Cart strip appears — tap checkout.
- assertVisible:
    id: "cart-strip"
- tapOn:
    id: "cart-checkout-btn"

# The checkout method picker screen should appear.
- extendedWaitUntil:
    visible:
      id: "checkout-method-picker"
    timeout: 5000

# Verify payment method options are visible.
- assertVisible:
    id: "checkout-payment-method"

# Verify the continue button exists.
- assertVisible:
    id: "checkout-method-continue"
