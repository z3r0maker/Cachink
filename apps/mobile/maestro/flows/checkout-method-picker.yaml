# «¿Cómo paga?» (Track M, M-07; MvCobro): the three methods, Fiado as its own
# row, never QR/CoDi, and each method's panel.
# Precondition: demo mode seeded (products + users exist).
# x-entrypoint: demo
appId: mx.xangarro.mobile
tags:
  - ventas
  - checkout
  - regression
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- runFlow: shared/ensure-caja-open.yaml

- tapOn:
    id: 'tab-cobrar'
- extendedWaitUntil:
    visible:
      id: 'ventas-product-grid'
    timeout: 5000
- tapOn: 'Agregar Quesadilla.*'
- tapOn:
    id: 'cart-checkout-btn'
- tapOn:
    id: 'ticket-cobrar'
- extendedWaitUntil:
    visible:
      id: 'checkout-cobro'
    timeout: 5000

- assertVisible:
    id: 'cobro-metodo-Efectivo'
- assertVisible:
    id: 'cobro-efectivo'
- assertVisible:
    id: 'cobro-fiado'
- assertNotVisible: 'QR/CoDi'

- tapOn:
    id: 'cobro-metodo-Tarjeta'
- assertVisible:
    id: 'cobro-panel-Tarjeta'
- tapOn:
    id: 'cobro-metodo-Transferencia'
- assertVisible:
    id: 'cobro-panel-Transferencia'

# Fiado goes on to choose the client.
- tapOn:
    id: 'cobro-fiado'
- extendedWaitUntil:
    visible:
      id: 'checkout-fiado'
    timeout: 5000
- assertVisible: 'Anótalo a su cuenta'
- assertVisible: 'Elige a quién se lo anotas'
