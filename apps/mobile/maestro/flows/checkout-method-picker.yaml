# Verify the multi-step checkout flow renders the method picker.
# Route: /checkout (triggered after adding item to cart)
# Prerequisite: at least one product must exist (created by Phase 2).
# Verifies: checkout-method-picker testID, payment options, continue CTA.
appId: mx.cachink.mobile
tags:
  - ventas
  - checkout
  - regression
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to Ventas tab and tap a product to add to cart
- tapOn:
    id: "tab-ventas"
- extendedWaitUntil:
    visible:
      id: "ventas-product-grid"
    timeout: 5000

# Tap a product in the grid ("Tortilla" from precondition flow).
- tapOn: "Tortilla"

# The checkout sheet / method picker should appear
- extendedWaitUntil:
    visible:
      id: "checkout-method-picker"
    timeout: 5000

# Verify payment method options are visible
- assertVisible:
    id: "checkout-payment-method"

# Verify the continue button exists
- assertVisible:
    id: "checkout-method-continue"
