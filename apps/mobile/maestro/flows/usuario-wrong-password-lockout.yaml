# Multiple wrong password attempts — error messages + recovery link.
#
# Verifies:
#   1. On QuickSwitch, enter wrong password multiple times
#   2. Error messages appear each time
#   3. forgot-password-link visible after failures
#
# Precondition: wizard + director-setup complete, app relaunched.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/usuario-wrong-password-lockout.yaml
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml

# QuickSwitchScreen should be showing.
- extendedWaitUntil:
    visible:
      id: "quick-switch"
    timeout: 10000

# --- Attempt 1: Wrong password ---
- tapOn:
    id: "password-input"
- inputText: "WrongPass1"
- tapOn:
    id: "login-submit"

# Error message should appear.
- assertVisible: "Contraseña incorrecta"

# --- Attempt 2: Wrong password ---
- tapOn:
    id: "password-input"
- eraseText
- inputText: "WrongPass2"
- tapOn:
    id: "login-submit"

# Error message still visible.
- assertVisible: "Contraseña incorrecta"

# --- Attempt 3: Wrong password ---
- tapOn:
    id: "password-input"
- eraseText
- inputText: "WrongPass3"
- tapOn:
    id: "login-submit"

# Error message still visible.
- assertVisible: "Contraseña incorrecta"

# Forgot password link should be visible after multiple failures.
- assertVisible:
    id: "forgot-password-link"
