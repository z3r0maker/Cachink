# Cierre que cuadra (Track M, M-17; board MvCierreFlujo): from Mi turno's
# «Cerrar mi turno», step 1 counts the drawer by denomination with the
# esperado out of sight; «Ver resultado» shows «¡Cuadra!» $0.00 with no
# motivo asked; the close lands on «¡Turno cerrado!» with the «Cuadró» chip,
# the corte as a ticket and the cash reminder for los patrones.
#
# Precondition: activated device, turno open with the $500 fondo
# (shared/ensure-caja-open.yaml) and nothing else captured, so the expected
# cash is exactly the fondo.
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/login-operator.yaml
- runFlow: shared/ensure-caja-open.yaml
# Start from a sent queue, so the only row the hecho waits for is the close.
- extendedWaitUntil:
    visible:
      id: 'cloud-sync-pill-synced'
    timeout: 30000

# «Cerrar mi turno» opens the Cierre flow, a full page under the Turno tab.
- tapOn:
    id: 'tab-turno|rail-turno|sidebar-turno'
- extendedWaitUntil:
    visible:
      id: 'turno-cerrar-mi-turno'
    timeout: 10000
- tapOn:
    id: 'turno-cerrar-mi-turno'
- extendedWaitUntil:
    visible:
      id: 'mobile-cierre'
    timeout: 10000
- assertVisible: '.*Paso 1 de 2.*'
- assertVisible: '.*Cuenta la caja.*'
# Step 1 never shows what is expected.
- assertNotVisible:
    id: 'cierre-esperado'

# Count one $500 bill, the only piece the expected $500 needs. The steppers
# write whole pieces (cierre-conteo-fila.tsx: conteo-mas-<clave>); the fixed
# foot says the running Contado.
- tapOn:
    id: 'conteo-mas-billete-500'
- assertVisible:
    id: 'cierre-contado'
- assertVisible: '.*Contaste.*'

# Step 1 ends at its fixed foot (M-17): «Ver resultado» shows the esperado.
- tapOn:
    id: 'cierre-ver-resultado'
- extendedWaitUntil:
    visible:
      id: 'cierre-paso-resultado'
    timeout: 10000
- assertVisible: '.*Paso 2 de 2.*'
- assertVisible: '.*¡Cuadra!.*'
- assertVisible: '.*Lo contado coincide con lo esperado. Puedes cerrar\..*'
- assertVisible:
    id: 'cierre-esperado'
- assertNotVisible:
    id: 'cierre-motivo-Cambio mal dado'

# «Volver a contar» keeps the count; the header's back goes there too.
- tapOn:
    id: 'cierre-volver-a-contar'
- extendedWaitUntil:
    visible:
      id: 'cierre-paso-contar'
    timeout: 10000
- assertVisible: '.*\$500\.00.*'
- tapOn:
    id: 'cierre-ver-resultado'
- extendedWaitUntil:
    visible:
      id: 'cierre-paso-resultado'
    timeout: 10000

# Close: the plain «Cerrar turno», in the fixed foot.
- assertVisible: '.*Se guarda con tu nombre. Para seguir vendiendo, abres otro turno\..*'
- tapOn:
    id: 'cierre-cerrar-turno'

# Hecho: the «Cuadró» chip, Don celebrating, the line to los patrones.
- extendedWaitUntil:
    visible:
      id: 'cierre-hecho'
    timeout: 10000
- assertVisible: '.*Cuadró.*'
- assertVisible: '.*¡Turno cerrado!.*'
- assertVisible: '.*Cuadró al centavo\..*'
# The close goes up right away; «ya lo tienen» only once a sync run confirmed
# it (review M7). lineaHecho appends «Gracias por tu turno, <nombre>.».
- extendedWaitUntil:
    visible: '.*El conteo cuadró con lo esperado\. Los patrones ya lo tienen en su portal\..*'
    timeout: 30000
- assertVisible:
    id: 'cierre-corte'
- assertVisible: '.*Guarda \$500\.00 para los patrones\..*'
# No handover dialog any more (ADR-147).
- assertNotVisible:
    id: 'cierre-entregar-efectivo'
- assertVisible:
    id: 'cierre-mandar'
- assertVisible:
    id: 'cierre-otro-turno'
