# Wizard — BusinessForm back button returns to mode selection.
#
# No flow ever taps "Back" on the BusinessForm. This exercises:
#   - business-back
#
# Precondition: fresh install.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-business-back.yaml
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any consent modals.
- runFlow: shared/dismiss-modals.yaml

- assertVisible: "¡Bienvenido a Cachink!"

# Step 1 → Solo → Step 2A → Local (reach BusinessForm).
- tapOn:
    id: "wizard-step1-solo-card"
- extendedWaitUntil:
    visible:
      id: "wizard-step2a-local"
    timeout: 5000
- tapOn:
    id: "wizard-step2a-local-card"

# Consent step (dismiss if shown).
- tapOn:
    id: "consent-no"
    optional: true

# BusinessForm renders.
- extendedWaitUntil:
    visible:
      id: "business-nombre"
    timeout: 10000

# Tap the back button to return to mode selection.
- tapOn:
    id: "business-back"

# Verify we returned to the wizard step 1 (mode selection).
- extendedWaitUntil:
    visible:
      id: "wizard-step1-solo-card"
    timeout: 5000
