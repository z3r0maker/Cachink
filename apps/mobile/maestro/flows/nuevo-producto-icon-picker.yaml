# NuevoProducto icon picker E2E — navigate to icon picker and select an icon.
#
# Verifies:
#   1. Tap "Seleccionar ícono" button on NuevoProducto form
#   2. Icon picker screen appears with icon tiles
#   3. Select an icon (pizza)
#   4. Tap "Aceptar" to confirm
#   5. Back on NuevoProducto, icon picker button still visible (icon selected)
#
# Precondition: wizard + director-setup complete.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/funciones-toggle.yaml
#   maestro test apps/mobile/maestro/flows/nuevo-producto-icon-picker.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
tags:
  - productos
  - regression
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to Productos tab.
- tapOn:
    id: "tab-productos"

# Tap "Nuevo producto" to open the full-page form.
- tapOn:
    id: "stock-nuevo-producto"

# Wait for the NuevoProducto screen to mount.
- extendedWaitUntil:
    visible:
      id: "nuevo-producto-screen"
    timeout: 5000

# Scroll down to reach the icon picker button.
- scrollUntilVisible:
    element:
      id: "producto-icon-picker-btn"
    direction: DOWN

# Tap the icon picker button.
- tapOn:
    id: "producto-icon-picker-btn"

# Icon picker screen should appear.
- extendedWaitUntil:
    visible:
      id: "icon-picker-screen"
    timeout: 5000

# Select a pizza icon from the Alimentos category.
- tapOn:
    id: "icon-tile-pizza"

# Tap accept to confirm selection.
- tapOn:
    id: "icon-picker-accept"

# Back on NuevoProducto form — icon picker button should still be visible.
- extendedWaitUntil:
    visible:
      id: "producto-icon-picker-btn"
    timeout: 5000

# Verify we're back on the nuevo-producto screen.
- assertVisible:
    id: "nuevo-producto-screen"
