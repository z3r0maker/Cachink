# Tap venta → popover opens → assert share + delete visible → close.
# Covers Gap L (Phase 17): verifies the popover renders all detail
# elements correctly without performing a destructive action.
#
# testIDs exercised:
#   venta-detail-popover, venta-detail-share, venta-detail-delete
#
# Precondition: wizard + product + at least one venta exist.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/inventario-producto.yaml
#   maestro test apps/mobile/maestro/flows/venta-efectivo.yaml
#   maestro test apps/mobile/maestro/flows/venta-detail-popover-inspect.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to the Ventas tab (Operativo role).
- tapOn:
    id: "tab-ventas"

# Verify the existing sale is visible.
- assertVisible: "Tortilla"

# Tap the venta card to open the detail popover.
- tapOn: "Tortilla"
- assertVisible:
    id: "venta-detail-popover"

# Verify all popover elements are present.
- assertVisible:
    id: "venta-detail-share"
- assertVisible:
    id: "venta-detail-delete"

# Close the popover without taking action (tap the backdrop or back).
- tapOn:
    id: "top-bar-back"

# Popover closes, venta is still in the list.
- assertNotVisible:
    id: "venta-detail-popover"
- assertVisible: "Tortilla"
