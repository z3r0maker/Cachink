# Verify the Director can toggle stock-low notifications in Settings
# (P1C-M11-T01..T03, S4-C13).
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Director is already on Home after authenticate.yaml.
# Open settings via the cog in the TopBar.
- runFlow: shared/navigate-to-settings.yaml

# On phones the toggle sits low on Configuración, under the bottom tab bar;
# bring it fully into view so the tap doesn't land on a tab.
- scrollUntilVisible:
    element:
      id: 'settings-notifications-btn'
    direction: DOWN
    timeout: 10000
    centerElement: true
- assertVisible:
    id: 'settings-notifications-toggle'

# Toggle off.
- tapOn:
    id: 'settings-notifications-btn'
- assertVisible: 'No'

# Toggle on again.
- tapOn:
    id: 'settings-notifications-btn'
- assertVisible: 'Sí'
