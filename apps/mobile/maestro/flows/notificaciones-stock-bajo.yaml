# Verify the Director can toggle stock-low notifications in Settings
# (P1C-M11-T01..T03, S4-C13).
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Director is already on Home after authenticate.yaml.
# Open settings via the cog in the TopBar.
- tapOn:
    id: "top-bar-open-settings"

- assertVisible:
    id: "settings-notifications-toggle"

# Toggle off.
- tapOn:
    id: "settings-notifications-btn"
- assertVisible: "No"

# Toggle on again.
- tapOn:
    id: "settings-notifications-btn"
- assertVisible: "Sí"
