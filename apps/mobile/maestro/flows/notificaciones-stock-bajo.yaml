# Verify the Director can toggle stock-low notifications in Settings
# (P1C-M11-T01..T03, S4-C13).
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/login-operator.yaml

# Director is already on Home after authenticate.yaml.
# Open settings via the cog in the TopBar.
- runFlow: shared/navigate-to-settings.yaml

# The toggle lives below the fold on Ajustes' one page.
- scrollUntilVisible:
    element:
      id: 'settings-notifications-toggle'
    direction: DOWN
    timeout: 8000
    centerElement: true

# Toggle off.
- tapOn:
    id: 'settings-notifications-btn'
- assertVisible: 'No'

# Toggle on again.
- tapOn:
    id: 'settings-notifications-btn'
- assertVisible: 'Sí'
