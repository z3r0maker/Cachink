# Delete a payment with swipe-to-delete (swipe left → Borrar → confirm) and
# verify it's gone from the list. Covers CRUD Delete for Egresos.
# The flow creates its own uniquely named payment first.
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
# Create the gasto this flow edits/deletes (no demo data on an activated device).
# A payment with a name no other flow uses, so "gone after delete" is meaningful
# on the shared device.
- runFlow:
    file: shared/create-gasto.yaml
    env:
      CONCEPTO: 'Pago a borrar'
      MONTO: '123'
- assertVisible: '.*Pago a borrar.*'

# Swipe left on the payment's row to reveal Borrar, then confirm.
- swipe:
    from:
      text: '.*Pago a borrar.*'
    direction: LEFT
- extendedWaitUntil:
    visible:
      id: 'confirm-dialog'
    timeout: 5000
- tapOn:
    id: 'confirm-dialog-confirm'

- assertNotVisible:
    id: 'confirm-dialog'
- assertNotVisible: '.*Pago a borrar.*'
