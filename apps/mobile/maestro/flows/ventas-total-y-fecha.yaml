# Ventas "Total del día" bar: after a sale the bar on the Ventas tab shows the
# day's total and sale count (TotalBar, testID total-bar).
# Re-scoped for A-16 from the retired ventas-total-card / ventas-list checks.
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- runFlow: shared/ensure-caja-open.yaml
- runFlow:
    file: shared/sell-cash.yaml
    env:
      PRODUCT: 'Quesadilla'

# The bar is one accessibility element labelled "Total del día".
- assertVisible:
    text: '.*Total del día.*'
