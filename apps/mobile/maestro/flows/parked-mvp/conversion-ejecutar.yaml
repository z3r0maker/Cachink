# Execute a conversion and verify stock changes.
#
# Depends on conversion-crear-receta.yaml having run first (products + recipe exist).
#
# Verifies:
#   1. Select a recipe → set multiplier
#   2. Confirm conversion → success
#
# Precondition: conversion-crear-receta.yaml has been run.
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to conversion screen.
- tapOn:
    id: "tab-otros"
- scrollUntilVisible:
    element:
      id: "otros-conversion"
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn:
    id: "otros-conversion"
- extendedWaitUntil:
    visible:
      id: "conversion-screen"
    timeout: 5000

# Tap the convert button on the first recipe.
- tapOn:
    id: "receta-convertir-btn"

# Verify the convertir sheet opens.
- extendedWaitUntil:
    visible:
      id: "convertir-sheet"
    timeout: 3000

# Set multiplier.
- inputText:
    id: "convertir-multiplicador"
    text: "1"

# Confirm conversion.
- tapOn:
    id: "convertir-confirm"

# Verify sheet closes (conversion successful).
- extendedWaitUntil:
    notVisible:
      id: "convertir-sheet"
    timeout: 5000
