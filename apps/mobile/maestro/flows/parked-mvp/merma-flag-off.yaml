# Merma tab hidden when merma feature flag is OFF.
#
# Verifies:
#   1. Toggle merma flag OFF via Settings → Funciones
#   2. Merma tab disappears from the bottom bar / Otros grid
#
# Precondition: demo mode seeded (merma flag initially ON).
# x-entrypoint: demo
appId: mx.cachink.mobile
tags:
  - merma
  - feature-flags
  - edge-case
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate-director.yaml

# Navigate to Otros → Funciones and toggle merma OFF.
- tapOn:
    id: "tab-otros"
- scrollUntilVisible:
    element:
      id: "otros-funciones"
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn:
    id: "otros-funciones"
- assertVisible:
    id: "funciones-route"
- tapOn:
    id: "flag-merma-switch"

# Go back to Otros — merma nav item should be hidden.
- tapOn:
    id: "top-bar-back"
- assertNotVisible:
    id: "otros-merma-reportes"

# Also verify the Merma tab is hidden from bottom bar.
- assertNotVisible:
    id: "tab-merma"
