# Create a cliente with ALL optional fields (email + nota).
#
# Extends cliente-crear.yaml which only fills nombre + teléfono.
# This flow exercises the remaining uncovered fields:
#   - nuevo-cliente-email
#   - nuevo-cliente-nota
#
# Precondition: wizard + business + role already set up.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/cliente-crear-full-form.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: ../shared/dismiss-modals.yaml
- runFlow: ../shared/authenticate.yaml

# Navigate to the Clientes screen via Expo Router deep link.
- openLink: "cachink:///clientes"

- assertVisible:
    id: "clientes-screen"
- tapOn:
    id: "clientes-nuevo"

# Fill ALL fields: nombre, telefono, email, nota.
- tapOn:
    id: "nuevo-cliente-nombre"
- inputText: "Luis Hernández"

- tapOn:
    id: "nuevo-cliente-telefono"
- inputText: "5598765432"

- tapOn:
    id: "nuevo-cliente-email"
- inputText: "luis@correo.com"

- tapOn:
    id: "nuevo-cliente-nota"
- inputText: "Cliente frecuente, descuento 10%"

- tapOn:
    id: "nuevo-cliente-submit"

# Modal closes and the new cliente appears in the list.
- assertNotVisible:
    id: "nuevo-cliente-modal"
- assertVisible: "Luis Hernández"
