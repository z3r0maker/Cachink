# Open a venta detail and preview the comprobante (receipt).
#
# Covers the "Compartir comprobante" flow: tap venta → detail
# popover → "Compartir comprobante" → ComprobantePreview renders.
#
# Precondition: wizard complete + at least one venta exists.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/inventario-producto.yaml
#   maestro test apps/mobile/maestro/flows/venta-efectivo.yaml
#   maestro test apps/mobile/maestro/flows/venta-comprobante.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to the Ventas tab.
- tapOn:
    id: "tab-ventas"

# Verify an existing sale is visible.
- assertVisible: "Tortilla"

# Tap the venta card to open VentaDetailPopover.
- tapOn: "Tortilla"
- assertVisible:
    id: "venta-detail-popover"

# Tap the "Compartir comprobante" button.
- tapOn:
    id: "venta-detail-share"

# ComprobantePreview modal opens.
- extendedWaitUntil:
    visible:
      id: "comprobante-preview"
    timeout: 5000

# Verify the share and close buttons are visible.
- assertVisible:
    id: "comprobante-share"
- assertVisible:
    id: "comprobante-close"

# Close the comprobante preview.
- tapOn:
    id: "comprobante-close"
- assertNotVisible:
    id: "comprobante-preview"
