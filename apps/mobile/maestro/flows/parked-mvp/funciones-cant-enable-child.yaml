# Feature flag cascade: child flag blocked when parent is OFF.
#
# Verifies:
#   1. Toggle stock OFF
#   2. Tap conversionMateriaPrima switch → nothing changes (canToggle false)
#   3. Tap merma switch → nothing changes
#   4. Dependency hint text is visible ("Requiere Stock")
#
# Precondition: wizard + director-setup complete, logged in as Director.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/funciones-cant-enable-child.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: ../shared/dismiss-modals.yaml
- runFlow: ../shared/authenticate.yaml

# Navigate to Otros → Funciones.
# Review item #7: the Director bar is Inicio | Ventas | Gastos |
# Estados — no Otros tab. The tool grid moved into Configuración.
# This subflow opens it for whichever role is logged in.
- runFlow: ../shared/open-director-tools.yaml
- scrollUntilVisible:
    element:
      id: "otros-funciones"
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn:
    id: "otros-funciones"

# Ensure stock is OFF.
- tapOn:
    id: "flag-stock-switch"

# Attempt to enable conversionMateriaPrima — should be blocked.
- tapOn:
    id: "flag-conversionMateriaPrima-switch"

# Verify the dependency hint text is visible.
- assertVisible: "Requiere Stock"

# Attempt to enable merma — should also be blocked.
- tapOn:
    id: "flag-merma-switch"

# Verify the products screen doesn't show stock-dependent features.
# Review item #7: the Director bar is Inicio | Ventas | Gastos |
# Estados — no Otros tab. The tool grid moved into Configuración.
# This subflow opens it for whichever role is logged in.
- runFlow: ../shared/open-director-tools.yaml
- scrollUntilVisible:
    element:
      id: "otros-productos"
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn:
    id: "otros-productos"
- assertNotVisible:
    id: "productos-tab-stock"

# Re-enable stock for subsequent flows.
# Review item #7: the Director bar is Inicio | Ventas | Gastos |
# Estados — no Otros tab. The tool grid moved into Configuración.
# This subflow opens it for whichever role is logged in.
- runFlow: ../shared/open-director-tools.yaml
- scrollUntilVisible:
    element:
      id: "otros-funciones"
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn:
    id: "otros-funciones"
- tapOn:
    id: "flag-stock-switch"
