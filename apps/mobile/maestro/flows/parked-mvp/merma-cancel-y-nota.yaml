# Merma — exercise the nota field and cancel action.
#
# Extends merma-registro.yaml which fills cantidad + reason but never:
#   - merma-nota (optional note field)
#   - merma-cancel (cancel button on the confirm sheet)
#
# Verifies:
#   1. Open merma confirm sheet → fill nota → tap merma-cancel → sheet closes
#   2. Re-open → fill all fields including nota → submit successfully
#
# Precondition: wizard + director-setup complete, merma flag ON,
# at least one product exists.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/inventario-producto.yaml
#   maestro test apps/mobile/maestro/flows/merma-cancel-y-nota.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: ../shared/dismiss-modals.yaml
- runFlow: ../shared/authenticate.yaml

# Ensure merma feature flag is ON via Otros → Funciones.
# Review item #7: the Director bar is Inicio | Ventas | Gastos |
# Estados — no Otros tab. The tool grid moved into Configuración.
# This subflow opens it for whichever role is logged in.
- runFlow: ../shared/open-director-tools.yaml
- scrollUntilVisible:
    element:
      id: "otros-funciones"
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn:
    id: "otros-funciones"
- tapOn:
    id: "flag-merma-switch"
    optional: true

# Switch to Operativo — merma appears as a bottom tab.

# Navigate to the Merma tab.
- tapOn:
    id: "tab-merma"

# Merma screen renders with the product grid.
- extendedWaitUntil:
    visible:
      id: "merma-screen"
    timeout: 5000

# Tap a product to open the confirm sheet.
- tapOn: "Tortilla"
- extendedWaitUntil:
    visible:
      id: "merma-confirm-sheet"
    timeout: 5000

# --- Test 1: Fill nota then cancel ---
- tapOn:
    id: "merma-nota"
- inputText: "Nota de prueba cancelada"

# Tap cancel — sheet should close without submitting.
- tapOn:
    id: "merma-cancel"
- assertNotVisible:
    id: "merma-confirm-sheet"

# --- Test 2: Re-open → fill all fields including nota → submit ---
- tapOn: "Tortilla"
- extendedWaitUntil:
    visible:
      id: "merma-confirm-sheet"
    timeout: 5000

- tapOn:
    id: "merma-cantidad"
- inputText: "2"

- tapOn:
    id: "merma-reason"
- inputText: "Producto dañado"

- tapOn:
    id: "merma-nota"
- inputText: "Revisado por supervisor"

# Submit successfully.
- tapOn:
    id: "merma-submit"
- assertNotVisible:
    id: "merma-confirm-sheet"
