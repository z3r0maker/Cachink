# Director Home → CxC card → full Cuentas por Cobrar screen.
#
# Verifies:
#   1. From Director Home, tap cxc-card-ver-todo
#   2. cuentas-por-cobrar-screen renders
#   3. cxc-avg-days KPI card visible
#   4. cuentas-por-cobrar-list visible
#
# Precondition: wizard complete, at least one crédito venta exists.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/inventario-producto.yaml
#   maestro test apps/mobile/maestro/flows/cliente-crear.yaml
#   maestro test apps/mobile/maestro/flows/venta-credito.yaml
#   maestro test apps/mobile/maestro/flows/director-home-cxc-nav.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate-director.yaml

# Director Home should be showing. Verify the CxC card.
- assertVisible:
    id: "director-home-route"
- assertVisible:
    id: "cxc-card"

# Tap "Ver todo" on the CxC card.
- tapOn:
    id: "cxc-card-ver-todo"

# Cuentas por Cobrar screen renders.
- extendedWaitUntil:
    visible:
      id: "cuentas-por-cobrar-screen"
    timeout: 5000

# Verify KPI and list sections.
- assertVisible:
    id: "cxc-avg-days"
- assertVisible:
    id: "cuentas-por-cobrar-list"
