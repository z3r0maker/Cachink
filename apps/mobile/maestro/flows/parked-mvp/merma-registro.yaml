# Merma (shrinkage) registration E2E — Merma tab → grid → confirm.
#
# Verifies:
#   1. Merma tab visible (flag ON in demo mode)
#   2. Product grid renders with demo products
#   3. Tap product → cart → checkout → confirm sheet → submit
#
# Precondition: demo mode seeded (products + merma flag ON).
# x-entrypoint: demo
appId: mx.cachink.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to the Merma tab (direct tab in Operativo layout).
- tapOn:
    id: "tab-merma"

# Merma screen renders with the product grid.
- extendedWaitUntil:
    visible:
      id: "merma-screen"
    timeout: 5000
- assertVisible:
    id: "merma-grid"

# Tap a demo product to add to cart.
- tapOn: "Quesadilla"

# Cart strip should appear with the item.
- assertVisible:
    id: "cart-strip"

# Tap checkout to open the confirm sheet.
- tapOn:
    id: "cart-checkout-btn"

# Merma checkout sheet appears.
- extendedWaitUntil:
    visible:
      id: "merma-checkout-sheet"
    timeout: 5000

# Submit the merma registration.
- tapOn:
    id: "merma-checkout-submit"

# Sheet closes on success.
- assertNotVisible:
    id: "merma-checkout-sheet"
