# Conversion with insufficient materia prima stock — verify error.
#
# Attempt to execute a conversion with a multiplier that exceeds
# available stock of the materia prima. The use-case throws
# "Stock insuficiente" — assert the UI shows the error.
#
# Precondition: conversion-crear-receta.yaml has been run.
# x-entrypoint: wizard
appId: mx.cachink.mobile
tags:
  - conversion
  - stock
  - edge-case
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to conversion screen.
- tapOn:
    id: "tab-otros"
- scrollUntilVisible:
    element:
      id: "otros-conversion"
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn:
    id: "otros-conversion"
- extendedWaitUntil:
    visible:
      id: "conversion-screen"
    timeout: 5000

# Tap the convert button on the first recipe.
- tapOn:
    id: "receta-convertir-btn"
- extendedWaitUntil:
    visible:
      id: "convertir-sheet"
    timeout: 3000

# Set a very high multiplier to exceed stock.
- tapOn:
    id: "convertir-multiplicador"
- eraseText:
    charactersToErase: 10
- inputText:
    id: "convertir-multiplicador"
    text: "9999"

# Try to confirm conversion.
- tapOn:
    id: "convertir-confirm"

# Expect stock-insufficient error toast or inline message.
- extendedWaitUntil:
    visible:
      text: "Stock insuficiente"
    timeout: 5000
