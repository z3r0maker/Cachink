# Edit an existing venta changing ALL editable fields (categoría, monto, método de pago).
#
# Extends editar-venta.yaml which only edits concepto.
# This flow exercises the remaining uncovered fields:
#   - editar-venta-categoria
#   - editar-venta-monto
#   - editar-venta-metodo
#
# Precondition: wizard + product + at least one venta exist.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/inventario-producto.yaml
#   maestro test apps/mobile/maestro/flows/venta-efectivo.yaml
#   maestro test apps/mobile/maestro/flows/editar-venta-full-form.yaml
#
# The venta-efectivo flow creates a sale for "Tortilla".
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to the Ventas tab (Operativo role).
- tapOn:
    id: "tab-ventas"

# Verify the existing sale is visible.
- assertVisible: "Tortilla"

# Swipe the venta row left to reveal the edit action.
- swipe:
    id: "ventas-list"
    direction: LEFT
    startX: 300
    endX: 50

# Wait for the EditarVentaModal to appear.
- extendedWaitUntil:
    visible:
      id: "editar-venta-modal"
    timeout: 5000

# --- Change categoría to "Servicio" ---
- tapOn:
    id: "editar-venta-categoria"
- tapOn: "Servicio"

# --- Change monto ---
- tapOn:
    id: "editar-venta-monto"
- eraseText
- inputText: "250"

# --- Change método de pago to "Transferencia" ---
- tapOn:
    id: "editar-venta-metodo"
- tapOn: "Transferencia"

# Submit the edit.
- tapOn:
    id: "editar-venta-submit"

# Modal closes and the updated sale appears in the list.
- assertNotVisible:
    id: "editar-venta-modal"
