# Clientes empty state — verify the empty state renders when
# no clientes exist.
#
# Verifies:
#   1. Fresh install → navigate to Clientes
#   2. empty-clientes empty state visible
#   3. CTA to create a cliente is tappable → modal opens
#
# Precondition: wizard complete, NO clientes created yet.
# Must run BEFORE cliente-crear.yaml in the regression suite.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/empty-clientes.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: ../shared/dismiss-modals.yaml
- runFlow: ../shared/authenticate-wizard.yaml

# Navigate to the Clientes screen via deep link.
- runFlow: ../shared/navigate-to-clientes.yaml

# No clientes yet → empty state should render.
- assertVisible:
    id: "empty-clientes"

# Tap the CTA to verify it opens the nuevo cliente modal.
- tapOn:
    id: "clientes-nuevo"
- assertVisible:
    id: "nuevo-cliente-modal"
