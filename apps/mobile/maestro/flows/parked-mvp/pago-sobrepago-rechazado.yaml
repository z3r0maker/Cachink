# CxC overpayment rejected at UI — verify error message.
#
# After a partial payment, attempt to pay more than the remaining
# balance. The use-case throws "excede el monto" — assert the UI
# shows the rejection.
#
# Precondition: demo mode with a client + credit sale.
# x-entrypoint: demo
appId: mx.cachink.mobile
tags:
  - cxc
  - pagos
  - edge-case
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- runFlow: shared/ensure-caja-open.yaml

# Navigate to Clientes.
- runFlow: shared/navigate-to-clientes.yaml
- extendedWaitUntil:
    visible:
      id: "clientes-screen"
    timeout: 5000

# Tap the first client with pending debt.
- tapOn:
    id: "client-row-0"
    optional: true
- tapOn:
    id: "client-detail-deudas-tab"
    optional: true

# Tap "Registrar Pago" on a credit sale.
- tapOn:
    id: "registrar-pago-btn"
    optional: true

# If pago sheet appears, enter an excessively large amount.
- extendedWaitUntil:
    visible:
      id: "pago-monto-input"
    timeout: 5000
    optional: true

# Enter a huge amount that exceeds the sale total.
- eraseText:
    charactersToErase: 20
    optional: true
- inputText:
    id: "pago-monto-input"
    text: "999999"
    optional: true

# Submit — should show overpayment error.
- tapOn:
    id: "pago-submit-btn"
    optional: true
- extendedWaitUntil:
    visible:
      text: "excede"
    timeout: 5000
    optional: true
