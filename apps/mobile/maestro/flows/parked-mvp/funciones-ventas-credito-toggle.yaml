# Feature flag: ventasCredito toggle affects UX (Crédito payment method).
#
# NOTE: Requires a RELEASE build. In the Expo dev-client, the gear icon
# triggers the Expo developer menu instead of the app Settings screen.
#
# Verifies:
#   1. Toggle ventasCredito ON → Crédito appears as a payment method
#   2. Toggle ventasCredito OFF → Crédito no longer available
#
# Precondition: demo mode seeded (products + users + clients exist).
# x-entrypoint: demo
appId: mx.cachink.mobile
---
- launchApp
- runFlow: ../shared/dismiss-modals.yaml
- runFlow: ../shared/authenticate-director.yaml

# --- Step 1: Enable ventasCredito via Settings → Funciones ---
# Review item #7: the Director bar is Inicio | Ventas | Gastos |
# Estados — no Otros tab. The tool grid moved into Configuración.
# This subflow opens it for whichever role is logged in.
- runFlow: ../shared/open-director-tools.yaml
- runFlow: ../shared/navigate-to-settings.yaml
- extendedWaitUntil:
    visible:
      id: "settings-funciones"
    timeout: 5000
- tapOn:
    id: "settings-funciones"
- tapOn:
    id: "flag-ventasCredito-switch"
- tapOn:
    id: "top-bar-back"
- back

# Verify Director Otros shows the CxC link.
# Review item #7: the Director bar is Inicio | Ventas | Gastos |
# Estados — no Otros tab. The tool grid moved into Configuración.
# This subflow opens it for whichever role is logged in.
- runFlow: ../shared/open-director-tools.yaml
- assertVisible:
    id: "otros-ventas-credito"

# --- Step 2: Switch to Operativo → checkout → Crédito available ---
- tapOn:
    id: "tab-ventas"

# Add product to cart and go to checkout.
- tapOn: "Quesadilla"
- assertVisible:
    id: "cart-strip"
- tapOn:
    id: "cart-checkout-btn"

# On checkout method picker — Crédito should be present.
- extendedWaitUntil:
    visible:
      id: "checkout-method-picker"
    timeout: 5000
- assertVisible: "Crédito"

# Go back without submitting.
- tapOn:
    id: "top-bar-back"
- back
    optional: true

# Clear the cart if still visible.
- tapOn:
    id: "cart-strip-clear"
    optional: true

# --- Step 3: Disable ventasCredito via Settings → Funciones ---
# Review item #7: the Director bar is Inicio | Ventas | Gastos |
# Estados — no Otros tab. The tool grid moved into Configuración.
# This subflow opens it for whichever role is logged in.
- runFlow: ../shared/open-director-tools.yaml
- runFlow: ../shared/navigate-to-settings.yaml
- extendedWaitUntil:
    visible:
      id: "settings-funciones"
    timeout: 5000
- tapOn:
    id: "settings-funciones"
- tapOn:
    id: "flag-ventasCredito-switch"
- tapOn:
    id: "top-bar-back"
- back

# Verify Director Otros no longer shows CxC link.
# Review item #7: the Director bar is Inicio | Ventas | Gastos |
# Estados — no Otros tab. The tool grid moved into Configuración.
# This subflow opens it for whichever role is logged in.
- runFlow: ../shared/open-director-tools.yaml
- assertNotVisible:
    id: "otros-ventas-credito"

# Switch to Operativo → Ventas → confirm Crédito is gone.
- tapOn:
    id: "tab-ventas"
- tapOn: "Quesadilla"
- assertVisible:
    id: "cart-strip"
- tapOn:
    id: "cart-checkout-btn"
- extendedWaitUntil:
    visible:
      id: "checkout-method-picker"
    timeout: 5000
- assertNotVisible: "Crédito"
