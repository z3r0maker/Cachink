# Search/filter clientes by name using the search bar.
#
# Verifies:
#   1. Navigate to Clientes screen
#   2. Tap clientes-buscar search bar
#   3. Type partial name → verify filtered results
#   4. Clear search → full list returns
#
# Precondition: wizard complete, at least one cliente exists.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/cliente-crear.yaml
#   maestro test apps/mobile/maestro/flows/cliente-buscar.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to the Clientes screen via deep link.
- runFlow: shared/navigate-to-clientes.yaml

# Verify the clientes list renders.
- assertVisible:
    id: "clientes-list"

# Tap the search bar.
- tapOn:
    id: "clientes-buscar"
- inputText: "Carla"

# Verify filtered results show "Carla Márquez".
- assertVisible: "Carla Márquez"

# Clear the search and verify full list returns.
- eraseText
- inputText: "ZZZNOTFOUND"

# No results for garbage input — the name should not be visible.
- assertNotVisible: "Carla Márquez"

# Clear again to restore full list.
- eraseText

# Full list restored — the existing cliente is visible again.
- assertVisible: "Carla Márquez"
