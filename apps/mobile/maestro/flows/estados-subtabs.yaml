# Navigate through all 4 Estados Financieros sub-tabs and verify
# each screen renders.
#
# Covers the EstadosShell sub-tab navigation: Resultados → Balance
# → Flujo → Indicadores.
#
# Precondition: wizard complete + Director role. The role-switch
# flow (venta-credito.yaml) demonstrates how to switch to Director.
# This flow assumes the user is already in Director role (or
# switches inline).
#
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/inventario-producto.yaml
#   maestro test apps/mobile/maestro/flows/venta-efectivo.yaml
#   maestro test apps/mobile/maestro/flows/estados-subtabs.yaml
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Director is already authenticated after authenticate.yaml.
# Navigate to the Estados tab.
- tapOn:
    id: "tab-estados"

# Verify EstadosShell renders.
- assertVisible:
    id: "estados-shell"

# --- Sub-tab 1: Resultados (default) ---
- assertVisible:
    id: "estados-tab-resultados"

# --- Sub-tab 2: Balance ---
- tapOn:
    id: "estados-tab-balance"
# Wait for the sub-screen to render.
- extendedWaitUntil:
    visible:
      id: "estados-tab-balance"
    timeout: 3000

# --- Sub-tab 3: Flujo ---
- tapOn:
    id: "estados-tab-flujo"
- extendedWaitUntil:
    visible:
      id: "estados-tab-flujo"
    timeout: 3000

# --- Sub-tab 4: Indicadores ---
- tapOn:
    id: "estados-tab-indicadores"
- extendedWaitUntil:
    visible:
      id: "estados-tab-indicadores"
    timeout: 3000

# Navigate back to Resultados to confirm cycling works.
- tapOn:
    id: "estados-tab-resultados"
- assertVisible:
    id: "estados-tab-resultados"
