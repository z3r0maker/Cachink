# Navigate to Caja Movimientos screen and verify empty state.
# Route: /caja-movimientos (via Otros → caja-movimientos card)
# Verifies: screen renders, empty-state message visible.
# x-entrypoint: activated
appId: mx.xangarro.mobile
tags:
  - otros
  - caja
  - regression
---
# Mi turno's row opens the movements log (the route kept its `otros-` row id).
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/login-operator.yaml
- runFlow: shared/ensure-caja-open.yaml
- runFlow:
    file: shared/open-turno-row.yaml
    env:
      ROW: 'otros-caja-movimientos'
- extendedWaitUntil:
    visible:
      id: 'top-bar-back'
    timeout: 5000
- assertVisible: { id: 'top-bar-back' }
- assertVisible: 'Sin movimientos registrados hoy'
