# Navigate to Caja Movimientos screen and verify empty state.
# Route: /caja-movimientos (via Otros → caja-movimientos card)
# Verifies: screen renders, empty-state message visible.
# x-entrypoint: wizard
appId: mx.cachink.mobile
tags:
  - otros
  - caja
  - regression
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Review item #7: the Director bar is Inicio | Ventas | Gastos |
# Estados — no Otros tab. The tool grid moved into Configuración.
# This subflow opens it for whichever role is logged in.
- runFlow: shared/open-director-tools.yaml

- scrollUntilVisible:
    element:
      id: "otros-caja-movimientos"
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn:
    id: "otros-caja-movimientos"
- extendedWaitUntil:
    visible:
      text: "Movimientos de Caja"
    timeout: 5000

# Verify empty state renders (no movements today)
- assertVisible: "Sin movimientos registrados hoy"
