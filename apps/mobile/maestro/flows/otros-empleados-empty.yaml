# Otros → Empleados — assert empty state and add button.
#
# No flow directly asserts the Empleados screen empty state or the
# add button before any empleado exists:
#   - empleados-empty
#   - empleados-add-btn
#
# Precondition: wizard complete, no empleados created yet.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/otros-empleados-empty.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to Otros tab.
- tapOn:
    id: "tab-otros"

# Tap the Empleados card in the Otros grid.
- tapOn:
    id: "otros-empleados"
- assertVisible:
    id: "settings-empleados-screen"

# Assert the empty state is visible (no empleados yet).
- assertVisible:
    id: "empleados-empty"

# Assert the add button is visible.
- assertVisible:
    id: "empleados-add-btn"

# Tap the add button to verify it opens the nuevo empleado modal.
- tapOn:
    id: "empleados-add-btn"
- extendedWaitUntil:
    visible:
      id: "nuevo-empleado-modal"
    timeout: 5000

# Close the modal without creating.
- back
