# Reusable subflow: authenticate as Director (Juan Director).
#
# Use this for Director-specific flows (home dashboard, estados
# financieros, indicadores, etc.). Most flows should use the
# default shared/authenticate.yaml (Operativo) instead.
#
# Uses the test PIN: 000000
# PIN auto-submits after 6 digits.
#
# Usage (from Director flows):
#   - launchApp
#   - runFlow: shared/dismiss-modals.yaml
#   - runFlow: shared/authenticate-director.yaml
appId: mx.cachink.mobile
---
# Tap the Director avatar on QuickSwitch screen.
- tapOn:
    text: "J, Juan Director, Director"
    optional: true

# Wait for numpad and let animation settle.
- extendedWaitUntil:
    visible:
      id: "pin-numpad"
    timeout: 5000
    optional: true
- waitForAnimationToEnd

# Enter PIN: 000000
- tapOn:
    id: "numpad-0"
    optional: true
- tapOn:
    id: "numpad-0"
    optional: true
- tapOn:
    id: "numpad-0"
    optional: true
- tapOn:
    id: "numpad-0"
    optional: true
- tapOn:
    id: "numpad-0"
    optional: true
- tapOn:
    id: "numpad-0"
    optional: true

# Wait for Director tabs to mount.
- extendedWaitUntil:
    visible:
      id: "tab-ventas"
    timeout: 10000
    optional: true
