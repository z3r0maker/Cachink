# Reusable subflow: authenticate as Director.
#
# Supports BOTH entry points:
#   - Demo mode → Juan Director (PIN 000000)
#   - Wizard mode → Director Test (PIN 123456)
#
# Tries Juan Director first (demo user). If he doesn't exist
# (wizard-only state), falls back to Director Test.
#
# PIN auto-submits after 6 digits via inline numpad.
#
# Usage (from Director flows):
#   - launchApp
#   - runFlow: shared/dismiss-modals.yaml
#   - runFlow: shared/authenticate-director.yaml
appId: mx.cachink.mobile
---
# --- Attempt 1: Demo mode — Juan Director (PIN 000000) ---
- tapOn:
    text: "J, Juan Director, Director"
    optional: true

# If Juan exists, numpad shows. Enter PIN 000000.
- tapOn:
    id: "numpad-0"
    optional: true
- tapOn:
    id: "numpad-0"
    optional: true
- tapOn:
    id: "numpad-0"
    optional: true
- tapOn:
    id: "numpad-0"
    optional: true
- tapOn:
    id: "numpad-0"
    optional: true
- tapOn:
    id: "numpad-0"
    optional: true

# --- Attempt 2: Wizard mode — Director Test (PIN 123456) ---
# If Juan didn't exist, we're still on QuickSwitch. Tap Director Test.
- tapOn:
    text: "D, Director Test, Director"
    optional: true

# If Director Test exists, numpad shows. Enter PIN 123456.
- tapOn:
    id: "numpad-1"
    optional: true
- tapOn:
    id: "numpad-2"
    optional: true
- tapOn:
    id: "numpad-3"
    optional: true
- tapOn:
    id: "numpad-4"
    optional: true
- tapOn:
    id: "numpad-5"
    optional: true
- tapOn:
    id: "numpad-6"
    optional: true

# Wait for Director tabs to mount.
- extendedWaitUntil:
    visible:
      id: "tab-estados"
    timeout: 10000
    optional: true
