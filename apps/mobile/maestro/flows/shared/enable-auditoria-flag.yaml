# Reusable subflow: enable the auditoriaInventario feature flag.
#
# Navigates to Otros → Funciones and ensures the flag is ON.
# The auditoria flag requires stock to be ON (dependency chain).
# If the flag is already ON, the optional tap is a no-op.
#
# Precondition: user is authenticated as Director.
#
# Usage (from any auditoria-dependent flow):
#   - runFlow: shared/enable-auditoria-flag.yaml
appId: mx.cachink.mobile
---
- tapOn:
    id: "tab-otros"
- tapOn:
    id: "otros-funciones"

# Ensure stock is ON first (auditoria depends on it).
- tapOn:
    id: "flag-stock-switch"
    optional: true

# Tap the auditoria switch — optional so it's safe if already ON.
- tapOn:
    id: "flag-auditoriaInventario-switch"
    optional: true
