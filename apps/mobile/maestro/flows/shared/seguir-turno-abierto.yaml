# One open turno per caja (M-21, ADR-071 §3; board MvTurnoDeOtro): right
# after a NIP, when someone else's turno is open on the device, the phone asks
# whether to continue it or count and close it. This subflow continues it
# («Seguir con este turno» is the default card), so a flow that only needed
# another operator keeps going on the caja's turno. A no-op on the operator's
# own turno, with no turno open, or once they already chose. The overlay
# comes up after its queries settle, hence the wait before the check.
appId: mx.xangarro.mobile
---
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible:
        id: 'turno-de-otro'
    commands:
      - tapOn:
          id: 'turno-de-otro-cta'
      - extendedWaitUntil:
          notVisible:
            id: 'turno-de-otro'
          timeout: 8000
