# Reusable subflow: lock the caja (Track M, M-05). The header's avatar
# chip is gone; on the phone «Bloquear la caja» sits at the foot of Mi turno,
# on a tablet in the rail's or the sidebar's turno card.
# Locking clears the signed-in operator, so the operator list comes back.
#
# Precondition: signed in, any tab.
appId: mx.xangarro.mobile
---
# Decide the layout once: after tapping «Bloquear» the phone's tab bar is gone,
# so a second «when» would wrongly take the tablet branch (M-11).
# Phone: Mi turno, «Bloquear la caja» at its foot.
- runFlow:
    when:
      visible:
        id: 'tab-turno'
    commands:
      - tapOn:
          id: 'tab-turno'
      - scrollUntilVisible:
          element:
            id: 'turno-bloquear'
          direction: DOWN
          visibilityPercentage: 60
          # Center it: at the scroll's end the bar sits under the tab bar
          # and the home indicator, where taps never land.
          centerElement: true
      - tapOn:
          id: 'turno-bloquear'
# Tablet: the rail's or the sidebar's item.
- runFlow:
    when:
      visible:
        id: 'rail-bloquear|sidebar-bloquear'
    commands:
      - tapOn:
          id: 'rail-bloquear|sidebar-bloquear'
