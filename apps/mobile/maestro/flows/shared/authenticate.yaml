# Reusable subflow: authenticate as the primary user (deterministic, both entry points).
#
#   - Demo mode  → Ana Operativa   (PIN 000000)  — an Operativo avatar is present
#   - Wizard mode → Director Test    (PIN 123456)  — no Operativo avatar
#
# Selects by the stable role testIDs (`user-avatar-role-operativo` /
# `user-avatar-role-director`) and branches on whether the Operativo avatar
# exists to pick user + PIN. Every step inside the taken branch is REQUIRED, so a
# failed login fails at auth (loudly) instead of silently proceeding.
#
# Usage (from any flow):
#   - launchApp
#   - runFlow: shared/dismiss-modals.yaml
#   - runFlow: shared/authenticate.yaml
appId: mx.cachink.mobile
---
- assertVisible:
    id: "quick-switch"

# Demo mode: Operativo avatar present → Ana Operativa, PIN 000000.
- runFlow:
    when:
      visible:
        id: "user-avatar-role-operativo"
    commands:
      - tapOn:
          id: "user-avatar-role-operativo"
      - assertVisible:
          id: "pin-numpad"
      - waitForAnimationToEnd
      # On short screens (iPhone) the numpad's bottom row (0) sits below the fold.
      # Scroll the login ScrollView up by swiping over the avatar/greeting area
      # (NOT the numpad, which would capture the gesture) — only when numpad-0 is
      # not already visible, so this is skipped on iPad.
      - runFlow:
          when:
            notVisible:
              id: "numpad-0"
          commands:
            - swipe:
                start: "50%, 45%"
                end: "50%, 12%"
            - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: "numpad-0"
          timeout: 8000
      - tapOn: { id: "numpad-0" }
      - tapOn: { id: "numpad-0" }
      - tapOn: { id: "numpad-0" }
      - tapOn: { id: "numpad-0" }
      - tapOn: { id: "numpad-0" }
      - tapOn: { id: "numpad-0" }

# Wizard mode: no Operativo avatar → Director Test, PIN 123456.
# Guard on `quick-switch` still being visible so this branch does NOT fire after
# the demo branch above already logged in (which removes the operativo avatar and
# would otherwise make `notVisible operativo` true here).
- runFlow:
    when:
      visible:
        id: "quick-switch"
      notVisible:
        id: "user-avatar-role-operativo"
    commands:
      - tapOn:
          id: "user-avatar-role-director"
      - assertVisible:
          id: "pin-numpad"
      - waitForAnimationToEnd
      - tapOn: { id: "numpad-1" }
      - tapOn: { id: "numpad-2" }
      - tapOn: { id: "numpad-3" }
      - tapOn: { id: "numpad-4" }
      - tapOn: { id: "numpad-5" }
      - tapOn: { id: "numpad-6" }

# Either role lands with the bottom tab bar mounted.
- extendedWaitUntil:
    visible:
      id: "bottom-tab-bar"
    timeout: 10000
