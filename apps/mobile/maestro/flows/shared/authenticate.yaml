# Reusable subflow: authenticate as the primary Operativo user.
#
# Supports BOTH entry points:
#   - Demo mode → Ana Operativa (PIN 000000)
#   - Wizard mode → Director Test (PIN 123456)
#
# Tries Ana Operativa first (demo user). If she doesn't exist
# (wizard-only state), falls back to Director Test.
#
# PIN auto-submits after 6 digits via inline numpad.
#
# Usage (from any flow):
#   - launchApp
#   - runFlow: shared/dismiss-modals.yaml
#   - runFlow: shared/authenticate.yaml
appId: mx.cachink.mobile
---
# --- Attempt 1: Demo mode — Ana Operativa (PIN 000000) ---
- tapOn:
    text: "A, Ana Operativa, Operativo"
    optional: true

# If Ana exists, numpad shows. Enter PIN 000000.
- tapOn:
    id: "numpad-0"
    optional: true
- tapOn:
    id: "numpad-0"
    optional: true
- tapOn:
    id: "numpad-0"
    optional: true
- tapOn:
    id: "numpad-0"
    optional: true
- tapOn:
    id: "numpad-0"
    optional: true
- tapOn:
    id: "numpad-0"
    optional: true

# --- Attempt 2: Wizard mode — Director Test (PIN 123456) ---
# If Ana didn't exist, we're still on QuickSwitch. Tap Director Test.
- tapOn:
    text: "D, Director Test, Director"
    optional: true

# If Director Test exists, numpad shows. Enter PIN 123456.
- tapOn:
    id: "numpad-1"
    optional: true
- tapOn:
    id: "numpad-2"
    optional: true
- tapOn:
    id: "numpad-3"
    optional: true
- tapOn:
    id: "numpad-4"
    optional: true
- tapOn:
    id: "numpad-5"
    optional: true
- tapOn:
    id: "numpad-6"
    optional: true

# Wait for any tab to mount (Operativo sees tab-ventas, Director sees tab-estados).
- extendedWaitUntil:
    visible:
      id: "bottom-tab-bar"
    timeout: 10000
    optional: true
