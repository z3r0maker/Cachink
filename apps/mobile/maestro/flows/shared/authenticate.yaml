# Reusable subflow: authenticate as Operativo (Ana Operativa).
#
# This is the DEFAULT auth flow — most flows (70-80%) test Operativo.
# For Director flows, use shared/authenticate-director.yaml instead.
#
# Uses the test PIN: 000000
# Enters PIN via inline numpad (no system keyboard).
# PIN auto-submits after 6 digits.
#
# Usage (from any flow):
#   - launchApp
#   - runFlow: shared/dismiss-modals.yaml
#   - runFlow: shared/authenticate.yaml
appId: mx.cachink.mobile
---
# Tap the Operativo avatar on QuickSwitch screen.
- tapOn:
    text: "A, Ana Operativa, Operativo"
    optional: true

# Wait for numpad and let animation settle.
- extendedWaitUntil:
    visible:
      id: "pin-numpad"
    timeout: 5000
    optional: true
- waitForAnimationToEnd

# Enter PIN: 000000
- tapOn:
    id: "numpad-0"
    optional: true
- tapOn:
    id: "numpad-0"
    optional: true
- tapOn:
    id: "numpad-0"
    optional: true
- tapOn:
    id: "numpad-0"
    optional: true
- tapOn:
    id: "numpad-0"
    optional: true
- tapOn:
    id: "numpad-0"
    optional: true

# Wait for Operativo tabs to mount.
- extendedWaitUntil:
    visible:
      id: "tab-ventas"
    timeout: 10000
    optional: true
