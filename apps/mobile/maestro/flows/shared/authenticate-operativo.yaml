# Reusable subflow: authenticate as Operativo (Ana Operativa, PIN 000000).
#
# Deterministic: selects by the stable role testID `user-avatar-role-operativo`
# (added in user-avatar.tsx) instead of a brittle composite accessibility label,
# and every step is REQUIRED — a failed login fails here, loudly, instead of
# silently proceeding and failing 100s later at the first real step.
#
# Usage (from any Operativo flow):
#   - launchApp
#   - runFlow: shared/dismiss-modals.yaml
#   - runFlow: shared/authenticate-operativo.yaml
appId: mx.cachink.mobile
---
- assertVisible:
    id: "quick-switch"
- tapOn:
    id: "user-avatar-role-operativo"
- assertVisible:
    id: "pin-numpad"
- waitForAnimationToEnd

# Enter PIN 000000 (auto-submits after 6 digits).
- tapOn: { id: "numpad-0" }
- tapOn: { id: "numpad-0" }
- tapOn: { id: "numpad-0" }
- tapOn: { id: "numpad-0" }
- tapOn: { id: "numpad-0" }
- tapOn: { id: "numpad-0" }

# Operativo lands on the ventas tab.
- extendedWaitUntil:
    visible:
      id: "tab-ventas"
    timeout: 10000
