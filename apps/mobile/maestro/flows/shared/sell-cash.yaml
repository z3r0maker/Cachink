# Sell one unit of PRODUCT (the product's name) in cash with
# a $50 bill. Precondition: signed in, caja open.
appId: mx.xangarro.mobile
---
- tapOn:
    id: 'tab-ventas'
- extendedWaitUntil:
    visible:
      id: 'ventas-product-grid'
    timeout: 8000
- runFlow:
    file: add-to-cart.yaml
    env:
      PRODUCT: ${PRODUCT}
# The item is in the cart: the sticky Cobrar footer appears (the cart strip
# itself sits below the grid on phones).
- assertVisible:
    id: 'cart-checkout-btn'
- tapOn:
    id: 'cart-checkout-btn'
- extendedWaitUntil:
    visible:
      id: 'checkout-method-picker'
    timeout: 8000
- tapOn:
    id: 'checkout-method-continue'
- extendedWaitUntil:
    visible:
      id: 'checkout-efectivo'
    timeout: 8000
- tapOn: "\\$50"
- tapOn:
    id: 'checkout-efectivo-submit'
- extendedWaitUntil:
    visible:
      id: 'ventas-product-grid'
    timeout: 8000
