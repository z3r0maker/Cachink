# Reusable subflow: open Inventario (Track M, M-09; MvInventario) from Mi turno
# and filter the Existencias list to the standard test product "pastor" (demo
# seeds "Taco al pastor"; the wizard's inventario-producto flow creates
# "pastor") with the search box (the contracts mock seeds «Taco al pastor»), so one row remains on any device.
#
# Leaves the filtered list showing. The caller opens the product's movement
# sheet («¿Qué pasó con la mercancía?») with:
#   - tapOn: { id: "inventario-fila-.*" }
appId: mx.xangarro.mobile
---
- runFlow:
    file: open-turno-row.yaml
    env:
      ROW: 'otros-inventario'
- tapOn:
    id: 'inventario-buscar'
- inputText: 'pastor'
- assertVisible:
    id: 'inventario-fila-.*'
- hideKeyboard
