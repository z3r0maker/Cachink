# Reusable subflow: open Inventario (Track M, M-09; MvInventario) from Mi turno
# and filter the Existencias list to the standard test product "Tortilla" (demo
# seeds "Tortilla maíz kg"; the wizard's inventario-producto flow creates
# "Tortilla") with the search box, so one row remains on any device.
#
# Leaves the filtered list showing. The caller opens the product's movement
# sheet («¿Qué pasó con la mercancía?») with:
#   - tapOn: { id: "inventario-fila-.*" }
appId: mx.xangarro.mobile
---
- runFlow:
    file: open-turno-row.yaml
    env:
      ROW: 'otros-inventario'
- tapOn:
    id: 'inventario-buscar'
- inputText: 'Tortilla'
- assertVisible:
    id: 'inventario-fila-.*'
- hideKeyboard
