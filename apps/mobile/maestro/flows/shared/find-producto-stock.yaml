# Open Productos and narrow the stock list to the mock product "Gringa" (unique
# in the mock catalog) via the search box, so exactly one producto card is on
# screen for the calling flow to tap.
appId: mx.xangarro.mobile
---
- tapOn:
    id: 'tab-productos'
- tapOn:
    id: 'stock-buscar'
- inputText: 'Gringa'
- assertVisible:
    id: 'producto-card-.*'
# Dismiss the keyboard so the caller's tap opens the row detail (the stock list is
# keyboardShouldPersistTaps="never", so with the keyboard up the first tap would
# only dismiss it). Assert the row first — it's visible above the keyboard — then
# dismiss, so a flaky hideKeyboard can't hide a genuine "no product" failure.
- hideKeyboard
