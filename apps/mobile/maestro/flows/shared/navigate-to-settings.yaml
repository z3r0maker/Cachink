# Reusable subflow: navigate to the Settings Hub screen.
#
# Uses Otros tab → scroll to Configuración card → tap it.
# Expo Dev Client floating gear icon blocks top-bar-open-settings,
# so we navigate via the Otros grid instead.
#
# Precondition: user is authenticated and on any tab.
appId: mx.cachink.mobile
---
- tapOn:
    id: "tab-otros"
- extendedWaitUntil:
    visible: "Otros"
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "otros-configuracion"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "otros-configuracion"
- extendedWaitUntil:
    visible: "Ajustes"
    timeout: 5000
