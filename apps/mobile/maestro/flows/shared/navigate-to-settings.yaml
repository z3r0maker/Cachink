# Reusable subflow: navigate to the Settings Hub screen.
#
# Uses Otros tab → scroll to reveal Configuración → tap it.
# In dev builds, the ResetDemoAction section at bottom can cover
# lower grid cards, requiring careful scroll positioning.
#
# Precondition: user is authenticated and on any tab.
appId: mx.cachink.mobile
---
- tapOn:
    id: "tab-otros"
- extendedWaitUntil:
    visible: "Otros"
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "otros-configuracion"
    direction: DOWN
    timeout: 5000
# Extra scroll to move Configuración away from the BORRAR overlay.
- swipe:
    start: "50%,60%"
    end: "50%,40%"
- tapOn:
    id: "otros-configuracion"
- extendedWaitUntil:
    visible: "Ajustes"
    timeout: 8000
