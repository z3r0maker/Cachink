# Reusable subflow: navigate to the device's Ajustes (Configuración).
#
# Track M (M-05): the header lost its cog. Ajustes is a stack route opened
# from Mi turno's «Ajustes de la caja» row (`otros-configuracion`).
#
# Caveat: the Expo Dev Client's floating gear can sit over the header.
# Disable "Tools button" in the dev menu before running the suite — see
# E2E-SESSION-NOTES.md.
#
# Precondition: user is authenticated and on any tab.
appId: mx.xangarro.mobile
---
- runFlow:
    file: open-turno-row.yaml
    env:
      ROW: 'otros-configuracion'

- extendedWaitUntil:
    visible: 'Ajustes'
    timeout: 5000
