# Reusable subflow: navigate to the Settings Hub screen.
#
# Review item #7 removed the "Otros" tab from BOTH bars, so the
# role-branching this flow used to do is gone: the top-bar cog is now
# the single way into Configuración for every role.
#
#   Director  → Inicio | Ventas | Gastos | Estados
#   Operativo → Ventas | Caja | Gastos | Productos
#
# (The old Operativo branch went Otros grid → "Configuración" card.
# That card only ever existed in the *Director* grid, so the branch was
# dead weight even before the tab left.)
#
# Caveat that motivated the old branching: the Expo Dev Client's
# floating gear can sit over the top bar. Disable "Tools button" in the
# dev menu before running the suite — see E2E-SESSION-NOTES.md.
#
# Precondition: user is authenticated and on any tab.
appId: mx.cachink.mobile
---
- tapOn:
    id: "top-bar-open-settings"

- extendedWaitUntil:
    visible: "Ajustes"
    timeout: 5000
