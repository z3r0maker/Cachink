# Open Configuración through the top-bar cog (A-12: one device-only screen).
# The dev client's floating "Tools button" can cover the cog on iPad — turn it
# off in the dev menu before running the suite.
# Precondition: signed in, any tab.
appId: mx.xangarro.mobile
---
- tapOn:
    id: 'top-bar-open-settings'
- extendedWaitUntil:
    visible:
      id: 'settings-screen'
    timeout: 10000
