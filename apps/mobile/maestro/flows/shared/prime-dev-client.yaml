# Harness subflow (M-11): point the Expo dev-client at the local Metro and wait
# until the app's first screen is up. entry-setup.sh runs it after every reset.
# Handles the iOS «Open in …?» prompt and the dev menu's one-time welcome sheet
# (A-16 harness gotcha).
appId: mx.xangarro.mobile
---
- tapOn:
    text: 'Open'
    optional: true
- openLink: 'exp+xangarro://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081%3Fts%3D${BUNDLE_BUSTER}'
# The «Open in …?» dialog sometimes shows without a text the driver can see;
# its button sits mid-screen — one coordinate tap accepts it either way.
- tapOn:
    point: '50%,57%'
    optional: true
- tapOn:
    text: 'Open'
    optional: true
- extendedWaitUntil:
    visible:
      text: 'Continue'
    timeout: 8000
    optional: true
- tapOn:
    text: 'Continue'
    optional: true
- tapOn:
    id: 'xmark'
    optional: true
# The dialog can eat the deep link's url param: the launcher then lands on
# its home («Runtime version …») instead of connecting. Re-sending the link
# connects — the scheme is already authorized, so no dialog intervenes again.
- runFlow:
    when:
      visible:
        text: '.*Runtime version.*'
    commands:
      - openLink: 'exp+xangarro://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081%3Fts%3D${BUNDLE_BUSTER}'
# The manual-entry dialog with the URL prefilled: Connect submits it.
- runFlow:
    when:
      visible:
        text: 'Enter URL manually'
    commands:
      - tapOn:
          text: 'Connect'
- runFlow:
    when:
      visible:
        text: '.*Runtime version.*'
    commands:
      - openLink: 'exp+xangarro://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081%3Fts%3D${BUNDLE_BUSTER}'
# The floating «Tools» button covers the header's bell on phones. Switch it off
# once per simulator in the dev menu (gear › Tools button); the dev-client
# remembers it across resets.
- extendedWaitUntil:
    visible:
      id: 'activation-screen|quick-switch|tab-inicio|tab-turno'
    timeout: 300000
