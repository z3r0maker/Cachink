# Reusable subflow: complete DirectorSetup with test credentials.
# Called by wizard-local-standalone.yaml after BusinessForm submit.
#
# Test credentials (hardcoded for E2E):
#   Name:              Director Test
#   PIN (login):       123456
#
# Note: Email and recovery password fields are hidden (email recovery
# not yet available). Recovery password is auto-set to PIN at UI layer.
#
# ADR-049: PIN first (login), recovery password second.
appId: mx.cachink.mobile
---
- extendedWaitUntil:
    visible:
      id: "director-setup"
    timeout: 10000

- tapOn:
    id: "director-nombre"
- inputText: "Director Test"

- tapOn:
    id: "director-pin"
- inputText: "123456"

- tapOn:
    id: "director-confirm-pin"
- inputText: "123456"

# Scroll to submit button.
- scrollUntilVisible:
    element:
      id: "director-setup-submit"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "director-setup-submit"

# After submit, the user is auto-logged in as Director.
#
# FeatureDiscoveryGate is ONE-SHOT on `discoveryShown`
# (app/gated-navigation.tsx). On a fresh DB it fires at launch, BEFORE the
# business form — which is where shared/first-run-onboarding.yaml already
# consumes it. So by the time we get here it has normally been dismissed and
# will NOT appear again.
#
# It is left optional rather than deleted because a path that reaches
# DirectorSetup without going through first-run-onboarding (e.g. a re-run
# from Configuración → Sistema) can still surface it here.
- extendedWaitUntil:
    visible:
      id: "feature-discovery"
    timeout: 3000
    optional: true
- tapOn:
    id: "discovery-continue"
    optional: true

# Wait for the app shell (tabs) to render.
- extendedWaitUntil:
    visible:
      id: "tab-estados"
    timeout: 10000
