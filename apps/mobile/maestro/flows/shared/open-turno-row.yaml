# Reusable subflow: open one of Mi turno's rows (Track M, M-05).
#
# Gastos, Fiado y abonos, Inventario, Avisos, Registros por enviar and
# Ajustes are stack routes opened from Mi turno's «Lo de tu turno» rows
# (MvTurno), each with the `otros-<key>` testID (the rename is A-15):
# otros-gastos, otros-fiado, otros-inventario, otros-avisos,
# otros-no-enviados, otros-configuracion.
#
# Usage:
#   - runFlow:
#       file: shared/open-turno-row.yaml
#       env:
#         ROW: 'otros-gastos'
#
# Precondition: signed in, any tab.
appId: mx.xangarro.mobile
---
# Phone: the Mi turno tab. Tablet: the rail's or the sidebar's item.
- runFlow:
    when:
      visible:
        id: 'tab-turno'
    commands:
      - tapOn:
          id: 'tab-turno'
- runFlow:
    when:
      notVisible:
        id: 'tab-turno'
    commands:
      - tapOn:
          id: 'rail-turno|sidebar-turno'
# The rows end Mi turno's scroll, over the fixed foot: give the scroll room
# to cross the hero and the figures, and centre the row clear of the foot.
- scrollUntilVisible:
    element:
      id: ${ROW}
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn:
    id: ${ROW}
