# Reusable subflow: enable the conversionMateriaPrima feature flag.
#
# Navigates to Otros → Funciones and ensures the flag is ON.
# The conversion flag requires stock to be ON (dependency chain).
# If the flag is already ON, the optional tap is a no-op.
#
# Precondition: user is authenticated as Director.
#
# Usage (from any conversion-dependent flow):
#   - runFlow: shared/enable-conversion-flag.yaml
appId: mx.cachink.mobile
---
- tapOn:
    id: "tab-otros"
- scrollUntilVisible:
    element:
      id: "otros-funciones"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "otros-funciones"

# Ensure stock is ON first (conversion depends on it).
- tapOn:
    id: "flag-stock-switch"
    optional: true

# Tap the conversion switch — optional so it's safe if already ON.
- tapOn:
    id: "flag-conversionMateriaPrima-switch"
    optional: true
