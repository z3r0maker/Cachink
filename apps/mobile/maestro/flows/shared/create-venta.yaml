# Reusable subflow: create one cash sale on Cobrar so a venta exists in today's
# sales (the seeded sales are past-dated and don't show in the day view).
#
# Precondition: authenticated Operativo + caja open (shared/ensure-caja-open.yaml).
# Leaves the app on Cobrar with an empty ticket.
appId: mx.xangarro.mobile
---
- tapOn:
    id: 'tab-cobrar'
- extendedWaitUntil:
    visible:
      id: 'ventas-product-grid'
    timeout: 8000

# Add a product to the ticket and charge it (Efectivo, «Exacto»).
# The grid lists alphabetically; this tile is below the fold.
- scrollUntilVisible:
    element:
      id: 'cobrar-tile-01JPRD00000000000000000001'
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 60
    centerElement: true
- tapOn: { id: 'cobrar-tile-01JPRD00000000000000000001' }
- assertVisible:
    id: 'cobrar-bar'
- runFlow:
    file: cobrar-ticket.yaml
    env:
      METODO: Efectivo
