# Reusable subflow: open Gastos from Mi turno and its «Registrar gasto» sheet
# (Track M, M-08; MvGastos).
#
# Usage:
#   - runFlow: shared/abrir-registrar-gasto.yaml
#
# Precondition: signed in, any tab.
appId: mx.xangarro.mobile
---
# The flows that use this subflow speak the MvGastos sheet's ids (the
# numpad, gasto-concepto, gasto-categoria-*, gasto-guardar) — so they open
# the mostrador gastos screen, not the older /egresos list.
- runFlow: ensure-caja-open.yaml
- tapOn:
    id: 'tab-inicio|rail-inicio|sidebar-inicio'
- extendedWaitUntil:
    visible:
      id: 'inicio-hero-listo'
    timeout: 8000
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: 'inicio-atajo-gastos'
    commands:
      - tapOn: { id: 'inicio-atajo-gastos' }
- runFlow:
    when:
      notVisible:
        id: 'inicio-atajo-gastos'
    commands:
      # The atajos are phone-only (inicio-screen drops them when wide); the
      # tablet deep-links the same screen (the navigate-to-settings pattern).
      - openLink: 'xangarro://gastos'
- extendedWaitUntil:
    visible:
      id: 'gastos-abrir-registrar'
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: 'gastos-abrir-registrar'
    timeout: 8000
- tapOn:
    id: 'gastos-abrir-registrar'
- extendedWaitUntil:
    visible:
      id: 'registrar-gasto-sheet'
    timeout: 5000
