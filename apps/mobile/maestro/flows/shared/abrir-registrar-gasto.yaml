# Reusable subflow: open Gastos from Mi turno's «Lo de tu turno» row and its
# «Registrar gasto» sheet (Track M, M-08; MvGastos).
#
# Usage:
#   - runFlow: shared/abrir-registrar-gasto.yaml
#
# Precondition: signed in, any tab.
appId: mx.xangarro.mobile
---
# The row opens the mostrador Gastos screen (`mobile-gastos`, with its
# figures), the same one as Inicio's atajo: the older /egresos list is gone
# (it only redirects there now). Phone row, tablet rail or sidebar alike.
- runFlow: ensure-caja-open.yaml
- runFlow:
    file: open-turno-row.yaml
    env:
      ROW: 'otros-gastos'
- extendedWaitUntil:
    visible:
      id: 'mobile-gastos'
    timeout: 8000
- assertVisible:
    id: 'gastos-cifras'
- extendedWaitUntil:
    visible:
      id: 'gastos-abrir-registrar'
    timeout: 8000
- tapOn:
    id: 'gastos-abrir-registrar'
- extendedWaitUntil:
    visible:
      id: 'registrar-gasto-sheet'
    timeout: 5000
