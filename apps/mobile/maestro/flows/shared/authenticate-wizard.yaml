# Reusable subflow: authenticate as Director Test (wizard-created user, PIN 123456).
#
# Use this in regression-path flows that start from the wizard setup
# (director-setup.yaml creates "Director Test" with PIN 123456).
# For demo-mode flows, use shared/authenticate.yaml instead.
#
# Deterministic: selects by the stable role testID `user-avatar-role-director`
# and every step is REQUIRED, so a failed login fails here (loudly) rather than
# silently proceeding and failing later at the first real step.
#
# Usage (from regression-path flows):
#   - launchApp
#   - runFlow: shared/dismiss-modals.yaml
#   - runFlow: shared/authenticate-wizard.yaml
appId: mx.cachink.mobile
---
- assertVisible:
    id: "quick-switch"
- tapOn:
    id: "user-avatar-role-director"
- assertVisible:
    id: "pin-numpad"
- waitForAnimationToEnd

# Enter PIN 123456 (auto-submits after 6 digits).
- tapOn: { id: "numpad-1" }
- tapOn: { id: "numpad-2" }
- tapOn: { id: "numpad-3" }
- tapOn: { id: "numpad-4" }
- tapOn: { id: "numpad-5" }
- tapOn: { id: "numpad-6" }

# Director lands on the estados tab.
- extendedWaitUntil:
    visible:
      id: "tab-estados"
    timeout: 10000
