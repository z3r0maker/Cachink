# Reusable subflow: authenticate as Director Test (wizard-created user).
#
# Use this in regression-path flows that start from the wizard setup
# (director-setup.yaml creates "Director Test" with PIN 123456).
# For demo-mode flows, use shared/authenticate.yaml instead.
#
# Uses the test PIN: 123456
# PIN auto-submits after 6 digits.
#
# Usage (from regression-path flows):
#   - launchApp
#   - runFlow: shared/dismiss-modals.yaml
#   - runFlow: shared/authenticate-wizard.yaml
appId: mx.cachink.mobile
---
# Tap the Director Test avatar on QuickSwitch screen.
- tapOn:
    text: "D, Director Test, Director"
    optional: true

# Wait for numpad and let animation settle.
- extendedWaitUntil:
    visible:
      id: "pin-numpad"
    timeout: 5000
    optional: true
- waitForAnimationToEnd

# Enter PIN: 123456
- tapOn:
    id: "numpad-1"
    optional: true
- tapOn:
    id: "numpad-2"
    optional: true
- tapOn:
    id: "numpad-3"
    optional: true
- tapOn:
    id: "numpad-4"
    optional: true
- tapOn:
    id: "numpad-5"
    optional: true
- tapOn:
    id: "numpad-6"
    optional: true

# Wait for Director tabs to mount.
- extendedWaitUntil:
    visible:
      id: "tab-estados"
    timeout: 10000
    optional: true
