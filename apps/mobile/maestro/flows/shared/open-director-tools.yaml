# Reusable subflow: open Mi turno's rows («Lo de tu turno», Track M M-05).
#
# The name is historical: the Operativo tool grid ("Otros") became Mi
# turno's big rows, and the rows keep their `otros-<key>` testIDs:
# otros-gastos, otros-inventario, otros-caja-movimientos, otros-no-enviados,
# otros-configuracion. Callers scroll to the row they need and tap it.
#
# Precondition: user is authenticated and on any tab.
appId: mx.xangarro.mobile
---
# Phone: the Mi turno tab. Tablet: the rail's or the sidebar's item.
- runFlow:
    when:
      visible:
        id: 'tab-turno'
    commands:
      - tapOn:
          id: 'tab-turno'
- runFlow:
    when:
      notVisible:
        id: 'tab-turno'
    commands:
      - tapOn:
          id: 'rail-turno|sidebar-turno'
- scrollUntilVisible:
    element:
      id: 'turno-rows'
    direction: DOWN
    timeout: 5000
