# Reusable subflow: open the tool grid, whatever the role.
#
# Review item #7 removed the "Otros" tab from BOTH bars. The grid
# itself did not go away — it renders with the *same* `otros-<key>`
# testIDs it always had, just in the place each role can reach fastest:
#
#   Director  → Configuración (top-bar cog), above the category cards
#   Operativo → inside the Caja tab, below the turn
#
# So a caller that used to do
#
#   - tapOn: { id: "tab-otros" }
#   - tapOn: { id: "otros-usuarios" }
#
# now does
#
#   - runFlow: shared/open-director-tools.yaml
#   - tapOn: { id: "otros-usuarios" }
#
# Role detection: only the Operativo bar has a Caja tab (Director is
# Inicio | Ventas | Gastos | Estados), so `tab-caja` is the discriminator.
#
# Precondition: user is authenticated and on any tab.
appId: mx.cachink.mobile
---
# Operativo: the tools live inside Caja.
- runFlow:
    when:
      visible:
        id: "tab-caja"
    commands:
      - tapOn:
          id: "tab-caja"
      - extendedWaitUntil:
          visible:
            id: "settings-nav-section"
          timeout: 5000

# Director: no Caja tab → the cog opens Configuración, which hosts the grid.
- runFlow:
    when:
      notVisible:
        id: "tab-caja"
    commands:
      - tapOn:
          id: "top-bar-open-settings"
      - extendedWaitUntil:
          visible:
            id: "settings-nav-section"
          timeout: 5000
