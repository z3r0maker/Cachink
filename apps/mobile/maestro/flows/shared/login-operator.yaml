# Operator sign-in on an activated device (A-05/A-07; Acceso, Track M M-06):
# pick Toni (mock operator, NIP 1234), type the four digits and tap «Entrar»;
# the caja lands on Inicio. No-op when someone is already signed in.
appId: mx.xangarro.mobile
---
- runFlow:
    when:
      notVisible:
        id: 'tab-turno'
    commands:
      - extendedWaitUntil:
          visible:
            id: 'quick-switch'
          timeout: 60000
      - tapOn:
          text: 'Toni'
      - extendedWaitUntil:
          visible:
            id: 'numpad-1'
          timeout: 8000
      - tapOn: { id: 'numpad-1' }
      - tapOn: { id: 'numpad-2' }
      - tapOn: { id: 'numpad-3' }
      - tapOn: { id: 'numpad-4' }
      - tapOn: { id: 'nip-enviar' }
- extendedWaitUntil:
    visible:
      id: 'tab-turno'
    timeout: 15000
