# Operator sign-in on an activated device (A-05/A-07; Acceso, Track M M-06):
# pick Toni (mock operator, NIP 1234, contracts fixtures.ts OPERATOR_PINS),
# type the four digits and tap «Entrar»; the caja lands on Inicio. No-op when
# someone is already signed in.
#
# Preseleccion (acceso-screen.tsx) picks whoever holds the open turno when the
# list comes up — and after a sync pull that can be ANA (operator 02, a
# NIP this subflow does not know), not Toni. So the row is ALWAYS tapped, pad
# up or not: it switches the pad when someone else is preselected and is a
# no-op when Toni already is (the rows stay listed beside the pad). The old
# "pad visible → skip the row" shortcut typed Toni's NIP into Ana's pad and
# failed every login after the first synced turno. Toni's row id is
# deterministic (fixtures.ts: users: [operator(1, 'Toni', …)], the ulidOf
# ('PRS', 1) the row stamps as acceso-operador-<id>).
appId: mx.xangarro.mobile
---
- runFlow:
    when:
      notVisible:
        id: 'tab-turno|rail-turno|sidebar-turno'
    commands:
      - extendedWaitUntil:
          visible:
            id: 'acceso-operador-01JPRS00000000000000000001'
          timeout: 20000
      - tapOn:
          id: 'acceso-operador-01JPRS00000000000000000001'
      - extendedWaitUntil:
          visible:
            id: 'numpad-1'
          timeout: 8000
      - tapOn: { id: 'numpad-1' }
      - tapOn: { id: 'numpad-2' }
      - tapOn: { id: 'numpad-3' }
      - tapOn: { id: 'numpad-4' }
      - tapOn: { id: 'nip-enviar' }
- extendedWaitUntil:
    visible:
      id: 'tab-turno|rail-turno|sidebar-turno'
    timeout: 15000
