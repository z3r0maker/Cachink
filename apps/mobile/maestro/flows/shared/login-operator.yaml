# Operator sign-in on an activated device (A-05/A-07): pick Toni (mock
# operator, PIN 123456) on QuickSwitch and land on the capture tabs.
# No-op when someone is already signed in.
appId: mx.xangarro.mobile
---
- runFlow:
    when:
      notVisible:
        id: 'tab-caja'
    commands:
      - extendedWaitUntil:
          visible:
            id: 'quick-switch'
          timeout: 60000
      - tapOn:
          text: '.*Toni.*'
      - extendedWaitUntil:
          visible:
            id: 'numpad-1'
          timeout: 8000
      - tapOn: { id: 'numpad-1' }
      - tapOn: { id: 'numpad-2' }
      - tapOn: { id: 'numpad-3' }
      - tapOn: { id: 'numpad-4' }
      - tapOn: { id: 'numpad-5' }
      # Optional: under load a digit tap can register twice and submit early,
      # hiding the keypad before this tap — the retry below recovers.
      - tapOn:
          id: 'numpad-6'
          optional: true
# One retry when the first PIN did not land on the tabs.
- runFlow:
    when:
      notVisible:
        id: 'tab-caja'
    commands:
      - extendedWaitUntil:
          visible:
            id: 'numpad-1'
          timeout: 10000
      - tapOn: { id: 'numpad-1' }
      - tapOn: { id: 'numpad-2' }
      - tapOn: { id: 'numpad-3' }
      - tapOn: { id: 'numpad-4' }
      - tapOn: { id: 'numpad-5' }
      - tapOn: { id: 'numpad-6' }
- extendedWaitUntil:
    visible:
      id: 'tab-caja'
    timeout: 15000
