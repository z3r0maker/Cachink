# Reusable subflow: pick the newest photo in the iOS system picker (the
# fixture a flow added with `addMedia`). Each cell reads «Photo, <date>,
# <time>» («Foto, …» in Spanish); the pattern takes one cell only, never the
# «Photos» tab or the grid, whose label strings every cell's together. The
# picker may ask to confirm («Add» / «Agregar»).
#
# Usage:
#   - runFlow: shared/elegir-foto-galeria.yaml
#
# Precondition: the picker is opening (a long press or a gallery button).
appId: mx.xangarro.mobile
---
- extendedWaitUntil:
    visible: '(Photo|Foto), [^,]+(, [^,]+){1,2}'
    timeout: 10000
- tapOn:
    text: '(Photo|Foto), [^,]+(, [^,]+){1,2}'
    index: 0
- runFlow:
    when:
      visible: '^(Add|Agregar)$'
    commands:
      - tapOn: '^(Add|Agregar)$'
