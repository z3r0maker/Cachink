# Reusable subflow: ensure the current operator has a turno open (M-06/M-09).
#
# Inicio's hero carries the one «Abrir turno» (Mi turno's sin-turno state only
# points back to Inicio, mi-turno-estados.tsx). When no turno is open the hero
# reads «Abre tu turno para empezar» (tono cerrado) and its action opens the
# fondo sheet (AbrirTurnoSheet); the $500 quick chip funds it. With a turno
# already open the hero reads «La caja está lista» (tono listo) and every
# step is skipped.
#
# Usage:
#   - runFlow: shared/login-operator.yaml
#   - runFlow: shared/ensure-caja-open.yaml
appId: mx.xangarro.mobile
---
- tapOn:
    id: 'tab-inicio'
- runFlow:
    when:
      visible:
        id: 'inicio-hero-cerrado'
    commands:
      - tapOn:
          id: 'inicio-hero-accion'
      - extendedWaitUntil:
          visible:
            id: 'abrir-caja-modal'
          timeout: 5000
      - tapOn:
          id: 'fondo-rapido-500'
      - tapOn:
          id: 'caja-abrir-submit'
- extendedWaitUntil:
    visible:
      id: 'inicio-hero-listo'
    timeout: 10000
