# Reusable subflow: ensure caja is open for the current Operativo.
#
# Handles 3 possible states:
#   1. No turno → abrir-caja-modal visible → enter amount → submit
#   2. Director already opened → "CONFIRMAR MONTO" prompt → tap confirm
#   3. Already open → caja-status-card visible → nothing to do
#
# Usage (from any flow that needs caja open):
#   - runFlow: shared/authenticate.yaml
#   - runFlow: shared/ensure-caja-open.yaml
appId: mx.xangarro.mobile
---
- tapOn:
    id: 'tab-caja'
# A close left half done by an earlier flow blocks opening: finish it first.
- runFlow: finish-caja-close.yaml

# State 2: Director already opened — confirm prompt visible.
- tapOn:
    text: 'CONFIRMAR MONTO'
    optional: true

# State 1: No turno — abrir-caja-modal. Enter 500 and submit.
- tapOn:
    id: 'numpad-5'
    optional: true
- tapOn:
    id: 'numpad-0'
    optional: true
- tapOn:
    id: 'numpad-0'
    optional: true
- tapOn:
    id: 'caja-abrir-submit'
    optional: true

# Opening with a different amount than the last close asks for confirmation.
- extendedWaitUntil:
    visible:
      id: 'discrepancy-continue'
    timeout: 3000
    optional: true
- runFlow:
    when:
      visible:
        id: 'discrepancy-continue'
    commands:
      - tapOn:
          id: 'discrepancy-continue'

# All states should now show the active turn.
- extendedWaitUntil:
    visible:
      id: 'caja-status-card'
    timeout: 10000
