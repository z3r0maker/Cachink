# Reusable subflow: ensure the current operator has a turno open (M-06).
#
# Mi turno with no turno shows the «Antes de cobrar» card; its «Abrir turno»
# opens the fondo sheet (MvAbrirTurno). Type 500 (the next digit replaces
# the suggested last close) and open. With a turno already open the card is
# not there and every step is skipped.
#
# Usage:
#   - runFlow: shared/login-operator.yaml
#   - runFlow: shared/ensure-caja-open.yaml
appId: mx.xangarro.mobile
---
- tapOn:
    id: 'tab-turno'
- runFlow:
    when:
      visible:
        id: 'inicio-hero-accion'
    commands:
      - tapOn:
          id: 'inicio-hero-accion'
      - extendedWaitUntil:
          visible:
            id: 'abrir-caja-modal'
          timeout: 5000
      - tapOn: { id: 'numpad-5' }
      - tapOn: { id: 'numpad-0' }
      - tapOn: { id: 'numpad-0' }
      - tapOn:
          id: 'caja-abrir-submit'
- extendedWaitUntil:
    visible:
      id: 'caja-status-card'
    timeout: 10000
