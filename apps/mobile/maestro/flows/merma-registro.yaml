# Merma (shrinkage) registration E2E — Productos → Merma tab → grid.
#
# Verifies:
#   1. Merma tab visible when feature flag is ON
#   2. Tap product in grid → confirm sheet appears → fill cantidad + reason → submit
#   3. Confirm sheet closes on success
#
# Precondition: wizard + director-setup complete, merma flag ON,
# at least one product exists.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/inventario-producto.yaml
#   maestro test apps/mobile/maestro/flows/merma-registro.yaml
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Ensure merma feature flag is ON via Otros → Funciones.
- tapOn:
    id: "tab-otros"
- tapOn:
    id: "otros-funciones"
- tapOn:
    id: "flag-merma-switch"
    optional: true

# Switch to Operativo — merma appears as a bottom tab for Operativo.

# Navigate to the Merma tab.
- tapOn:
    id: "tab-merma"

# Merma screen renders with the product grid.
- extendedWaitUntil:
    visible:
      id: "merma-screen"
    timeout: 5000
- assertVisible:
    id: "merma-grid"

# Tap a product directly in the grid (product created by inventario-producto.yaml).
- tapOn: "Tortilla"

# Confirm sheet appears.
- extendedWaitUntil:
    visible:
      id: "merma-confirm-sheet"
    timeout: 5000

# Enter quantity and reason.
- tapOn:
    id: "merma-cantidad"
- inputText: "3"

- tapOn:
    id: "merma-reason"
- inputText: "Producto caducado"

# Submit.
- tapOn:
    id: "merma-submit"

# Confirm sheet closes on success.
- assertNotVisible:
    id: "merma-confirm-sheet"
