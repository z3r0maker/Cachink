# After the close, Mi turno has no turno (Track M, M-09): the «Abrir turno»
# card is back, «Cerrar turno» is gone, and Cierre says there is nothing to
# close. The phone has no depósito/retiro buttons any more (the web caja has
# none); «Movimientos de caja» stays a read-only history.
#
# Precondition: demo mode seeded, the operator's turno not yet open or open
# with no sales.
# x-entrypoint: demo
appId: mx.xangarro.mobile
tags:
  - caja
  - edge-case
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- runFlow: shared/ensure-caja-open.yaml

- tapOn:
    id: 'turno-cerrar'
- extendedWaitUntil:
    visible:
      id: 'cierre-esperado'
    timeout: 8000
- tapOn:
    id: 'conteo-billete-500-mas'
- scrollUntilVisible:
    element:
      id: 'cierre-cerrar'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'cierre-cerrar'
- extendedWaitUntil:
    visible:
      id: 'cierre-hecho'
    timeout: 8000

# Salir locks the caja; sign back in and look at Mi turno.
- tapOn:
    id: 'cierre-salir'
- runFlow: shared/authenticate.yaml
- tapOn:
    id: 'tab-turno'
- extendedWaitUntil:
    visible:
      id: 'caja-open-turn'
    timeout: 8000
- assertNotVisible:
    id: 'turno-cerrar'
- assertVisible:
    id: 'otros-caja-movimientos'
