# Caja movement on closed turno — verify rejection.
#
# After closing a caja turn, attempt to make a retiro or depósito.
# The UI should not allow the action (button disabled or error shown).
#
# Precondition: wizard mode (fresh state, open + close caja first).
# x-entrypoint: activated
appId: mx.xangarro.mobile
tags:
  - caja
  - edge-case
---
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- runFlow: shared/ensure-caja-closed.yaml

# Open caja.
- runFlow: shared/ensure-caja-open.yaml

# Close the turno immediately.
- runFlow: shared/ensure-caja-closed.yaml

# Now verify retiro/depósito buttons are disabled or not visible.
- assertNotVisible:
    id: 'caja-retiro-btn'
- assertNotVisible:
    id: 'caja-deposito-btn'
