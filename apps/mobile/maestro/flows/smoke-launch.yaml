# Smoke test: app launches and the JS bundle drives all the way
# through the first-launch flow.
#
# What this verifies:
#   - expo-sqlite init + Drizzle migration runs without crashing
#     (P1C C1-C4).
#   - Btn taps fire `onPress` end-to-end (Audit M-1 STEP0-T01 swap
#     to `<Pressable>` in `btn.tsx` — the prior Tamagui
#     `<View onPress>` silently no-op'd on Maestro/iOS taps).
#   - The wizard renders on fresh launch and exposes its primary CTAs
#     to the accessibility tree.
#   - Consent step appears inline within the wizard after mode
#     selection (Audit M-1 PR 6 moved consent into the wizard).
#
# Precondition: cachink.db does NOT exist (fresh install). Run via
# the wrapper script to get a clean slate without breaking Metro:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/smoke-launch.yaml
#
# DO NOT use `clearState: true` — on iOS 18+ / Expo SDK 55, it
# wipes the dev-client's stored Metro URL and the app fails to
# reconnect to the JS bundler. See Finding 1 in the Maestro audit.
# x-entrypoint: fresh
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal legacy, etc.)
- runFlow: shared/dismiss-modals.yaml

# Wizard renders directly on fresh launch.
- assertVisible: "¡Bienvenido a Cachink!"
- assertVisible:
    id: "wizard-step1-solo"
