# Nómina — assert field testIDs (nomina-empleado, nomina-monto) directly.
#
# Extends egreso-nomina.yaml which creates an empleado inline but
# never directly asserts the nomina-specific field testIDs:
#   - nomina-empleado (combobox showing the selected empleado)
#   - nomina-monto (auto-filled from empleado salario)
#
# Precondition: wizard complete, at least one empleado already exists.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/egreso-nomina.yaml
#   maestro test apps/mobile/maestro/flows/egreso-nomina-field-assertions.yaml
#
# The mock business syncs one empleado: "Ana — Cajera".
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to Egresos → open new egreso → switch to Nómina tab.
- tapOn:
    id: 'tab-gastos'
- tapOn:
    id: 'egresos-nuevo'
- tapOn:
    id: 'egreso-tab-nomina'

# With the synced empleado present, the combobox renders.
# Assert the nomina-empleado combobox is visible.
- assertVisible:
    id: 'nomina-empleado'

# Tap the empleado combobox and select Ana.
- tapOn:
    id: 'nomina-empleado'
- tapOn: 'Ana — Cajera'

# Assert nomina-monto is visible and auto-filled from salario.
- assertVisible:
    id: 'nomina-monto'

# Submit the nómina egreso.
- scrollUntilVisible:
    element:
      id: 'nomina-submit'
    direction: DOWN
    timeout: 10000
- tapOn:
    id: 'nomina-submit'

# Modal closes + egreso visible.
- assertNotVisible: 'Nuevo pago'
- assertVisible: '.*Nómina Ana.*'
