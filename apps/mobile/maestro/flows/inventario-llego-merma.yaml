# Inventario (Track M, M-09; RvInventario): /productos lists the existencias;
# one tap on a row opens «¿Qué pasó con la mercancía?» on that product, with
# the kind its stock calls for already chosen. Low stock opens «Llegó
# mercancía»: the count rises and the toast confirms. Once stocked, the same
# row opens the merma, which writes off with its motivo and the count falls.
#
# «Agua de horchata» is PRD-7 (inventario-fila-<productId>). Stock is 0 on a
# fresh sync (no ledger rows), so every row reads «Reponer» (porReponer,
# caja/inventario/derive.ts).
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/login-operator.yaml
- runFlow: shared/ensure-caja-open.yaml
- runFlow:
    file: shared/open-turno-row.yaml
    env:
      ROW: 'otros-inventario'
- extendedWaitUntil:
    visible:
      id: 'mobile-inventario'
    timeout: 10000
# Existencias listed, first row below the KPIs and the toolbar.
- scrollUntilVisible:
    element:
      id: 'inventario-cantidad-01JPRD00000000000000000007'
    direction: DOWN
    timeout: 5000
- assertVisible:
    id: 'inventario-existencias'
- assertVisible: '.*Reponer.*'
# Llegó mercancía: the row's one tap (shared/llego-mercancia.yaml); the toast
# confirms (mov-toast.tsx, copy from toastDe).
- runFlow:
    file: shared/llego-mercancia.yaml
    env:
      ID: '01JPRD00000000000000000007'
      CANTIDAD: '15'
- assertVisible: '.*Entrada registrada.*'
- assertVisible: '.*\+15 de Agua de horchata\. Queda en tu turno\..*'
- tapOn:
    id: 'mov-toast-entendido'
# 0 + 15; the pill turned (15 > umbral 3).
- assertVisible:
    id: 'inventario-cantidad-01JPRD00000000000000000007'
- assertVisible: '.*15.*'
- assertVisible: '.*Suficiente.*'
# Merma: 15 is above the aviso (3), so the same row now opens the merma
# (tipoAlAbrir); the amount, and the reason a write-off always needs.
- scrollUntilVisible:
    element:
      id: 'inventario-fila-01JPRD00000000000000000007'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'inventario-fila-01JPRD00000000000000000007'
- extendedWaitUntil:
    visible:
      id: 'mover-sheet'
    timeout: 5000
- waitForAnimationToEnd
- assertVisible: '.*¿Cuánto se echó a perder\?.*'
- tapOn:
    id: 'mover-cantidad'
- eraseText: 6
- inputText: '2'
# Dismiss before the motivo chips: they sit under the open keyboard (the
# hideKeyboard command does not reliably dismiss it) and the tap would hit
# a key instead — the form then stays incomplete and the save is a no-op.
- swipe:
    start: '50%, 45%'
    end: '50%, 25%'
- waitForAnimationToEnd
- tapOn:
    id: 'mover-motivo-Se rompió'
- waitForAnimationToEnd
- tapOn:
    id: 'mover-guardar'
- extendedWaitUntil:
    visible:
      id: 'mov-toast'
    timeout: 8000
- assertVisible: '.*Merma registrada.*'
- assertVisible: '.*−2 de Agua de horchata · Se rompió\. Queda en tu turno\..*'
- tapOn:
    id: 'mov-toast-entendido'
# 15 − 2.
- scrollUntilVisible:
    element:
      id: 'inventario-cantidad-01JPRD00000000000000000007'
    direction: DOWN
    timeout: 5000
- assertVisible: '.*13.*'
