# Wizard → BusinessForm → fill ALL fields (nombre + régimen + ISR) → submit.
# Covers Gap C (Phase 17): business-isr + business-regimen testIDs during
# the create path (wizard), not just the edit path (settings).
#
# testIDs exercised:
#   business-nombre, business-regimen, business-isr,
#   business-form-content, business-submit
#
# Precondition: fresh install. Run via the wrapper script:
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-business-full-form.yaml
# x-entrypoint: fresh
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml

- assertVisible: "¡Bienvenido a Cachink!"

# Step 1 → Solo → Step 2A → Local (fastest path to BusinessForm).
- tapOn:
    id: "wizard-step1-solo-card"
- extendedWaitUntil:
    visible:
      id: "wizard-step2a-local"
    timeout: 5000
- tapOn:
    id: "wizard-step2a-local-card"

# Consent step
- extendedWaitUntil:
    visible:
      id: "consent-no"
    timeout: 5000
    optional: true
- tapOn:
    id: "consent-no"
    optional: true

# BusinessForm — wait for the screen transition animation.
- extendedWaitUntil:
    visible:
      id: "business-nombre"
    timeout: 5000

# Verify the full form content is rendered.
- assertVisible:
    id: "business-form-content"
- assertVisible:
    id: "business-regimen"
- assertVisible:
    id: "business-isr"

# Fill nombre.
- tapOn:
    id: "business-nombre"
- inputText: "Café Don Pedro"

# Change régimen to RESICO (default is likely RIF or empty).
- tapOn:
    id: "business-regimen"
- tapOn: "RESICO"

# Set ISR tasa to 1.25%.
- tapOn:
    id: "business-isr"
- eraseText
- inputText: "1.25"

# Submit.
- tapOn:
    id: "business-submit"

# DirectorSetup — verify it renders.
- runFlow: shared/director-setup.yaml

# After DirectorSetup, verify the app shell mounts.
- assertVisible:
    id: "tab-estados"
