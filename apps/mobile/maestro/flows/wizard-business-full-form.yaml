# Wizard → BusinessForm → fill ALL fields (nombre + régimen + ISR) → submit.
# Covers Gap C (Phase 17): business-isr + business-regimen testIDs during
# the create path (wizard), not just the edit path (settings).
#
# testIDs exercised:
#   business-nombre, business-regimen, business-isr,
#   business-form-content, business-submit
#
# Precondition: fresh install. Run via the wrapper script:
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-business-full-form.yaml
# x-entrypoint: fresh
appId: mx.cachink.mobile
---
- launchApp

# Review items #1/#2: first run is welcome → negocio, no device or
# cloud question in between. The shared subflow owns those steps.
- runFlow: shared/first-run-onboarding.yaml

# BusinessForm — wait for the screen transition animation.
- extendedWaitUntil:
    visible:
      id: "business-nombre"
    timeout: 5000

# Verify the full form content is rendered.
- assertVisible:
    id: "business-form-content"
- assertVisible:
    id: "business-regimen"
- assertVisible:
    id: "business-isr"

# Fill nombre.
- tapOn:
    id: "business-nombre"
- inputText: "Café Don Pedro"

# Change régimen to RESICO (default is likely RIF or empty).
- tapOn:
    id: "business-regimen"
- tapOn: "RESICO"

# Set ISR tasa to 1.25%.
- tapOn:
    id: "business-isr"
- eraseText
- inputText: "1.25"

# Review item #3: with RESICO selected and the ISR field focused, the
# soft keyboard used to cover GUARDAR with no way to scroll to it.
# BusinessForm now sits in a KeyboardAwareForm, so the button is
# reachable. Assert it while the keyboard is still up — that is the
# exact state that was broken.
- assertVisible:
    id: "business-submit"
- hideKeyboard

# Submit.
- tapOn:
    id: "business-submit"

# DirectorSetup — verify it renders.
- runFlow: shared/director-setup.yaml

# After DirectorSetup, verify the app shell mounts.
- assertVisible:
    id: "tab-estados"
