# Register a salida on an existing producto; verify stock decrement +
# movimiento visible in the Movimientos view.
# Covers P1C-M5-T04 (Entrada/Salida modal).
#
# Precondition: producto 'Tortilla' with stock >= 5 exists (create via
# inventario-producto.yaml and an entrada flow, or seed e2e-seed.json).
# x-entrypoint: demo
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Open the product's detail via search (onPress cards match by text-regex).
- runFlow: shared/find-producto-stock.yaml
- tapOn:
    id: "producto-card-.*"

# Detail screen — open the "Salida" movimiento.
- assertVisible:
    text: "Salida.*"
- tapOn:
    text: "Salida.*"

# MovimientoModal (tipo=salida): CANTIDAD visible, COSTO hidden for salida.
- assertVisible:
    text: "CANTIDAD.*"
- assertNotVisible:
    id: "movimiento-costo"

# Enter the salida quantity (< stock).
- tapOn:
    id: "movimiento-cantidad"
- eraseText
- inputText: "3"

# Submit the movement — the "REGISTRAR" button.
- tapOn:
    text: "REGISTRAR"

# Modal closes — CANTIDAD gone, stock decremented.
- assertNotVisible:
    text: "CANTIDAD.*"
