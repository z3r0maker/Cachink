# «Se echó a perder o se dañó (merma)» (Track M, M-09; MvInventario): a merma
# always says what happened; the stepper never goes past the stock, and the
# movement lowers the stock as a salida for «Merma / daño».
#
# Precondition: signed in with an open turno, and a tracked product "Tortilla"
# with stock.
# x-entrypoint: demo
appId: mx.xangarro.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- runFlow: shared/find-producto-stock.yaml
- tapOn:
    id: 'inventario-fila-.*'
- tapOn:
    id: 'mover-tipo-Merma'
- assertVisible: '¿Qué le pasó?'
- tapOn:
    id: 'mover-motivo-Se echó a perder'
- tapOn:
    id: 'mover-registrar'
- extendedWaitUntil:
    visible:
      id: 'inventario-toast'
    timeout: 5000
- assertVisible: '.*Se echó a perder. Queda en tu turno.*'
