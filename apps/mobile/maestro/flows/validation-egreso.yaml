# «Registrar gasto» asks for what is missing before it saves (Track M, M-08):
# the amount, then the concept, then the category; the button stays off.
#
# Precondition: wizard complete, business set, a turno open.
# x-entrypoint: demo
appId: mx.xangarro.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- runFlow: shared/abrir-registrar-gasto.yaml

- assertVisible: 'Escribe cuánto fue.'
- tapOn:
    id: 'gasto-guardar'
- assertVisible:
    id: 'registrar-gasto'

- tapOn: { id: 'numpad-1' }
- tapOn: { id: 'numpad-2' }
- assertVisible: 'Escribe qué compraste.'
- tapOn:
    id: 'gasto-concepto'
- inputText: 'Hielo'
- assertVisible: 'Elige una categoría.'
- tapOn:
    id: 'gasto-guardar'
- assertVisible:
    id: 'registrar-gasto'

- tapOn: { id: 'numpad-backspace' }
- tapOn: { id: 'numpad-backspace' }
- assertVisible: 'Escribe cuánto fue.'
