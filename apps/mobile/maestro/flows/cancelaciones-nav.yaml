# Navigate to the Cancelaciones screen from the Caja tool grid.
# Route: /cancelaciones (Caja → cancelaciones card)
# Verifies: the screen renders. Earlier flows on the shared device have sold
# today, so the empty state is not asserted.
# x-entrypoint: activated
appId: mx.xangarro.mobile
tags:
  - otros
  - cancelaciones
  - regression
---
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# The tool grid lives on the Caja tab.
- runFlow: shared/open-director-tools.yaml

- scrollUntilVisible:
    element:
      id: 'otros-cancelaciones'
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn:
    id: 'otros-cancelaciones'
- extendedWaitUntil:
    visible:
      id: 'mobile-cancelaciones'
    timeout: 5000
