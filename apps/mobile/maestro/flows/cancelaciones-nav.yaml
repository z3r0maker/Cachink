# Navigate to Cancelaciones screen and verify empty state renders.
# Route: /cancelaciones (via Otros → cancelaciones card)
# Verifies: cancelaciones-screen testID, empty-state text.
# x-entrypoint: wizard
appId: mx.cachink.mobile
tags:
  - otros
  - cancelaciones
  - regression
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

- tapOn:
    id: "tab-otros"
- extendedWaitUntil:
    visible:
      id: "otros-route"
    timeout: 5000

- scrollUntilVisible:
    element:
      id: "otros-cancelaciones"
    direction: DOWN
    timeout: 5000
# Extra swipe to position card in clear area (away from tab bar overlap).
- swipe:
    start: "50%,60%"
    end: "50%,40%"
- tapOn:
    id: "otros-cancelaciones"
- extendedWaitUntil:
    visible:
      id: "mobile-cancelaciones"
    timeout: 5000

# Verify the screen title renders
- assertVisible: "Cancelaciones"
# Empty state (no sales today expected at test start)
- assertVisible: "No hay ventas registradas hoy"
