# The Ventas tab (Track M, M-08; MvVentas): the turno's sales, each opened
# in its sheet and cancelled only with a reason. At test start there is
# either no turno or no sale yet.
# x-entrypoint: wizard
appId: mx.xangarro.mobile
tags:
  - otros
  - cancelaciones
  - regression
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

- tapOn:
    id: 'tab-ventas'
- extendedWaitUntil:
    visible:
      id: 'mobile-ventas-tab'
    timeout: 5000
- assertVisible: 'Ventas'
- assertVisible:
    id: 'ventas-vacio|ventas-sin-turno|ventas-lista'
