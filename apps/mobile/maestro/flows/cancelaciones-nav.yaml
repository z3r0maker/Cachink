# The Ventas tab (Track M-11): /cancelaciones became /ventas (M-05; the old
# route redirects, apps/mobile/src/app/cancelaciones.tsx) and the M-08 rebuild
# turned it into «Ventas del turno». With no turno open the tab answers «Sin
# turno abierto» and opens one right there (MvTurnoCerrado); the operator stays
# on Ventas, now empty, and «Cobrar la primera» goes on to the catalogue. The
# list itself, the sheet and the cancel path live in ventas-lista.yaml and
# venta-detalle-cancelar.yaml.
#
# Must run before any flow that opens the operator's turno (alphabetical
# ordering within the activated batch already does).
# x-entrypoint: activated
appId: mx.xangarro.mobile
tags:
  - ventas
  - cancelaciones
  - regression
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/login-operator.yaml

- tapOn: { id: 'tab-ventas|rail-ventas|sidebar-ventas' }
- extendedWaitUntil: { visible: { id: 'ventas-sin-turno' }, timeout: 8000 }
- assertVisible: '.*Sin turno abierto.*'
- assertVisible: '.*Las ventas de cada turno aparecen aquí.*'
- assertNotVisible: 'Ir a cobrar'

- runFlow:
    file: shared/abrir-turno-aqui.yaml
    env:
      CTA: 'ventas-sin-turno-cta'
- extendedWaitUntil: { visible: { id: 'ventas-vacio' }, timeout: 10000 }
- assertVisible: 'Todavía no hay ventas en este turno'

- tapOn: { id: 'ventas-vacio-cta' }
- extendedWaitUntil: { visible: { id: 'ventas-product-grid' }, timeout: 8000 }
