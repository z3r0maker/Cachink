# «Compra de inventario» with no products says so instead of an empty picker
# (Track M, M-08): the owner registers products in the portal.
#
# Precondition: fresh install, wizard complete, no products.
# x-entrypoint: wizard
appId: mx.xangarro.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- runFlow:
    file: shared/open-turno-row.yaml
    env:
      ROW: 'otros-gastos'
- tapOn:
    id: 'gastos-compra'
- assertVisible:
    id: 'compra-sin-productos'
