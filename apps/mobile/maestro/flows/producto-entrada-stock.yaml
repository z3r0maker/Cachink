# Add stock to an existing product via the "Entrada" action in the
# ProductoDetailPopover → MovimientoModal.
#
# Complements the existing inventario-salida.yaml which tests
# stock decrements. This flow tests stock INCREMENTS.
#
# Precondition: wizard + at least one product exists.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/inventario-producto.yaml
#   maestro test apps/mobile/maestro/flows/producto-entrada-stock.yaml
# x-entrypoint: demo
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Open the product's detail via search (see find-producto-stock.yaml). On
# iOS/Fabric, Tamagui onPress-cards expose a merged accessibilityText but NOT
# their testID, so the row/detail buttons are matched by `text: "<label>.*"`
# (anchored regex) — containers/inputs keep working by `id:`.
- runFlow: shared/find-producto-stock.yaml

# Tap the product row → navigates to the product detail route.
- tapOn:
    id: "producto-card-.*"

# Detail screen — open the "Entrada" movimiento.
- assertVisible:
    text: "Entrada.*"
- tapOn:
    text: "Entrada.*"

# MovimientoModal (tipo pre-set to "entrada"): CANTIDAD / MOTIVO / NOTA.
- assertVisible:
    text: "CANTIDAD.*"

# Enter quantity for the stock entrada.
- tapOn:
    id: "movimiento-cantidad"
- eraseText
- inputText: "50"

# Submit the movement — the "REGISTRAR" button (NOT the "Registrar entrada" title).
- tapOn:
    text: "REGISTRAR"

# Modal closes — the CANTIDAD field is gone.
- assertNotVisible:
    text: "CANTIDAD.*"
