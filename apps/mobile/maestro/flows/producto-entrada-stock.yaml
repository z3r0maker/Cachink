# «Llegó mercancía» (Track M, M-09; MvInventario): a product's movement sheet
# records an entrada with the stepper, who brought it and a note; the toast
# confirms it and it shows under «Movimientos».
#
# Precondition: signed in with an open turno, and a tracked product "Tortilla".
# x-entrypoint: demo
appId: mx.xangarro.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- runFlow: shared/find-producto-stock.yaml
- tapOn:
    id: 'inventario-fila-.*'
- assertVisible:
    id: 'mover-sheet'
- tapOn:
    id: 'mover-tipo-Entrada'
- tapOn:
    id: 'mover-mas'
- tapOn:
    id: 'mover-proveedor'
- inputText: 'Tortillería Esperanza'
- hideKeyboard
- tapOn:
    id: 'mover-registrar'
- extendedWaitUntil:
    visible:
      id: 'inventario-toast'
    timeout: 5000
- assertNotVisible:
    id: 'mover-sheet'
- tapOn:
    id: 'inventario-tabs-movimientos'
- assertVisible:
    id: 'inventario-mov-.*'
- assertVisible: '.*Llegó mercancía.*'
