# Settings → Negocio → Edit → toggle ISR and change régimen.
#
# No flow exercises the ISR toggle or régimen selector in the
# EditBusinessModal:
#   - edit-business-isr (toggle)
#   - edit-business-regimen (selector)
#
# Precondition: wizard complete (business already set up).
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/settings-edit-business-isr.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Open Settings via the top-bar cog icon.
- tapOn:
    id: "top-bar-open-settings"

# Navigate to the Negocio sub-screen.
- tapOn:
    id: "settings-hub-negocio"
- assertVisible:
    id: "settings-negocio-screen"

# Tap the edit button to open EditBusinessModal.
- tapOn:
    id: "settings-edit-business"
- assertVisible:
    id: "edit-business-modal"

# Toggle the ISR switch.
- tapOn:
    id: "edit-business-isr"

# Select a régimen from the picker.
- tapOn:
    id: "edit-business-regimen"
- tapOn: "Persona Física"

# Save the changes.
- tapOn:
    id: "edit-business-save"

# Modal closes.
- assertNotVisible:
    id: "edit-business-modal"
