# MVP: Cloud card disabled — verify "Próximamente" state (ADR-039 WUX-M4-T02).
#
# Step 1 → Solo → Step 2A → assert cloud card shows disabled note →
# tap cloud card → assert still on Step 2A (no cloud-onboarding-screen) →
# tap local card and proceed through consent.
#
# Precondition: fresh install. Run via wrapper:
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-cloud-solo.yaml
#
# x-entrypoint: fresh
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

- assertVisible: "¡Bienvenido a Cachink!"
- tapOn: { id: "wizard-step1-solo-card" }

# Cloud card should be visible but disabled with the "Próximamente" note.
- assertVisible: { id: "wizard-step2a-cloud" }
- assertVisible: { id: "wizard-step2a-cloud-note" }

# Tapping the disabled cloud card should NOT navigate away.
- tapOn: { id: "wizard-step2a-cloud-card" }
- assertNotVisible: { id: "cloud-onboarding-screen" }
- assertVisible: { id: "wizard-step2a-local" }

# Proceed with local mode instead.
- tapOn: { id: "wizard-step2a-local-card" }
- assertVisible: { id: "consent-yes" }
- tapOn: { id: "consent-yes" }
