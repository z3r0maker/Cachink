# Create ventas paid by Transferencia and Tarjeta (Track M, M-07; MvCobro).
#
# Precondition: demo mode seeded (products + users exist).
# x-entrypoint: demo
appId: mx.xangarro.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- runFlow: shared/ensure-caja-open.yaml

- tapOn:
    id: 'tab-cobrar'
- extendedWaitUntil:
    visible:
      id: 'ventas-product-grid'
    timeout: 5000

# --- Sale 1: Transferencia ---
- tapOn: 'Agregar Quesadilla.*'
- runFlow:
    file: shared/cobrar-ticket.yaml
    env:
      METODO: Transferencia

# --- Sale 2: Tarjeta ---
- tapOn: 'Agregar Quesadilla.*'
- runFlow:
    file: shared/cobrar-ticket.yaml
    env:
      METODO: Tarjeta
