# Create ventas using Transferencia and Tarjeta payment methods.
#
# Covers additional payment methods beyond Efectivo and Crédito
# which are already tested in venta-efectivo.yaml and venta-credito.yaml.
#
# Precondition: wizard + at least one product exists.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/inventario-producto.yaml
#   maestro test apps/mobile/maestro/flows/venta-otros-metodos.yaml
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to the Ventas tab.
- tapOn:
    id: "tab-ventas"
- assertVisible: "Tortilla"

# --- Sale 1: Transferencia ---

# Tap the product to open VentaConfirmSheet.
- tapOn: "Tortilla"
- assertVisible:
    id: "venta-confirm-sheet"

# Switch payment method to Transferencia.
- tapOn:
    id: "venta-confirm-metodo"
- tapOn: "Transferencia"

# Submit the sale.
- tapOn:
    id: "venta-confirm-submit"

# Sheet closes and the sale appears in the list.
- assertNotVisible:
    id: "venta-confirm-sheet"
- assertVisible: "Tortilla"

# --- Sale 2: Tarjeta ---

# Tap the product again.
- tapOn:
    id: "ventas-product-grid"
- tapOn: "Tortilla"
- assertVisible:
    id: "venta-confirm-sheet"

# Switch payment method to Tarjeta.
- tapOn:
    id: "venta-confirm-metodo"
- tapOn: "Tarjeta"

# Submit the sale.
- tapOn:
    id: "venta-confirm-submit"

# Sheet closes — both sales now exist.
- assertNotVisible:
    id: "venta-confirm-sheet"
