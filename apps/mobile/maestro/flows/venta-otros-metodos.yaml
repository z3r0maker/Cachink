# Create ventas using Transferencia and Tarjeta payment methods.
#
# Covers additional payment methods beyond Efectivo and Crédito
# which are already tested in venta-efectivo.yaml and venta-credito.yaml.
#
# Precondition: demo mode seeded (products + users exist).
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- runFlow: shared/ensure-caja-open.yaml

# Navigate to the Ventas tab.
- tapOn:
    id: 'tab-ventas'
- extendedWaitUntil:
    visible:
      id: 'ventas-product-grid'
    timeout: 5000

# --- Sale 1: Transferencia ---

# Tap a product to add to cart.
- runFlow:
    file: shared/add-to-cart.yaml
    env:
      PRODUCT: 'Quesadilla'
# The item is in the cart: the sticky Cobrar footer appears (the cart strip
# itself sits below the grid on phones).
- assertVisible:
    id: 'cart-checkout-btn'
- tapOn:
    id: 'cart-checkout-btn'

# Method picker — select Transferencia.
- extendedWaitUntil:
    visible:
      id: 'checkout-method-picker'
    timeout: 5000
- tapOn:
    id: 'option-card-Transferencia'
- tapOn:
    id: 'checkout-method-continue'

# Confirm screen for Transferencia — submit.
- extendedWaitUntil:
    visible:
      id: 'checkout-confirm-Transferencia'
    timeout: 5000
- tapOn:
    id: 'checkout-confirm-Transferencia-submit'

# Returns to Ventas.
- extendedWaitUntil:
    visible:
      id: 'ventas-product-grid'
    timeout: 5000

# --- Sale 2: Tarjeta ---

- runFlow:
    file: shared/add-to-cart.yaml
    env:
      PRODUCT: 'Quesadilla'
# The item is in the cart: the sticky Cobrar footer appears (the cart strip
# itself sits below the grid on phones).
- assertVisible:
    id: 'cart-checkout-btn'
- tapOn:
    id: 'cart-checkout-btn'

# Method picker — select Tarjeta.
- extendedWaitUntil:
    visible:
      id: 'checkout-method-picker'
    timeout: 5000
- tapOn:
    id: 'option-card-Tarjeta'
- tapOn:
    id: 'checkout-method-continue'

# Confirm screen for Tarjeta — submit.
- extendedWaitUntil:
    visible:
      id: 'checkout-confirm-Tarjeta'
    timeout: 5000
- tapOn:
    id: 'checkout-confirm-Tarjeta-submit'

# Returns to Ventas — both sales exist.
- extendedWaitUntil:
    visible:
      id: 'ventas-product-grid'
    timeout: 5000
