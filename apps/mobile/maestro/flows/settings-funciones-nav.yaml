# Otros → Funciones — verify Funciones screen renders from Otros grid.
#
# Covers navigation to the funciones screen via the Otros tab card.
#
# testIDs exercised:
#   otros-funciones, funciones-route
#
# Precondition: wizard complete, Director role.
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to Otros tab.
- tapOn:
    id: "tab-otros"
- extendedWaitUntil:
    visible: "Otros"
    timeout: 5000

# Scroll to Funciones card and tap it.
- scrollUntilVisible:
    element:
      id: "otros-funciones"
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn:
    id: "otros-funciones"

# Funciones screen renders.
- extendedWaitUntil:
    visible:
      id: "funciones-route"
    timeout: 5000
