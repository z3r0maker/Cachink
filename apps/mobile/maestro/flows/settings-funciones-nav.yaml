# Settings → tap settings-funciones → funciones-negocio screen renders.
# Covers Gap P (Phase 17): settings-funciones testID as alternative entry
# to the funciones screen (vs the Otros tab path).
#
# testIDs exercised:
#   settings-funciones, funciones-negocio
#
# Precondition: wizard complete, Director role.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/settings-funciones-nav.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Open Settings via the top-bar cog icon.
- runFlow: shared/navigate-to-settings.yaml

# Scroll down to find the Funciones link.
- scrollUntilVisible:
    element:
      id: "settings-funciones"
    direction: DOWN
    timeout: 5000

# Tap the Funciones link → funciones screen renders.
- tapOn:
    id: "settings-funciones"
- assertVisible:
    id: "funciones-route"
