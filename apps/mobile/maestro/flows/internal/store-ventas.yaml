# Store-screenshot helper: three sales and shots 03–05. Cash with change
# (2 Alambre, 2 Agua de horchata, 1 Café: $265.00, pays with $500), transfer
# (2 Cerveza, 1 Consomé), card (1 Arroz con leche, 2 Agua de jamaica, 1 Bolsa de hielo):
# the first sale's tiles are in the three rows every screen size shows; the
# later sales scroll to theirs (store-tile.yaml). Tile ids are the mock's
# ULIDs (Crockford base 32: PRD-15 is …0F).
appId: mx.xangarro.mobile
---
- tapOn:
    id: 'tab-cobrar|rail-cobrar|sidebar-cobrar'
- extendedWaitUntil:
    visible:
      id: 'ventas-product-grid'
    timeout: 8000
- tapOn: { id: 'cobrar-tile-01JPRD0000000000000000000F' }
- tapOn: { id: 'cobrar-tile-01JPRD0000000000000000000F' }
- tapOn: { id: 'cobrar-tile-01JPRD00000000000000000007' }
- tapOn: { id: 'cobrar-tile-01JPRD00000000000000000007' }
- tapOn: { id: 'cobrar-tile-01JPRD0000000000000000000H' }
- runFlow: store-pausa.yaml
- takeScreenshot: ${OUT}/03-cobrar
- runFlow: ../shared/abrir-cobro.yaml
- tapOn:
    id: 'cobro-rapido-1'
- runFlow: store-pausa.yaml
- takeScreenshot: ${OUT}/04-checkout
- tapOn:
    id: 'cobro-submit'
- extendedWaitUntil:
    visible:
      id: 'venta-hecha'
    timeout: 8000
- runFlow: store-pausa.yaml
- takeScreenshot: ${OUT}/05-venta-hecha
- tapOn:
    id: 'venta-hecha-nueva'
- extendedWaitUntil:
    visible:
      id: 'ventas-product-grid'
    timeout: 8000

- runFlow: { file: store-tile.yaml, env: { TILE: 01JPRD0000000000000000000A } }
- runFlow: { file: store-tile.yaml, env: { TILE: 01JPRD0000000000000000000A } }
- runFlow: { file: store-tile.yaml, env: { TILE: 01JPRD0000000000000000000D } }
- runFlow:
    file: ../shared/cobrar-ticket.yaml
    env:
      METODO: Transferencia

- runFlow: { file: store-tile.yaml, env: { TILE: 01JPRD0000000000000000000K } }
- runFlow: { file: store-tile.yaml, env: { TILE: 01JPRD00000000000000000008 } }
- runFlow: { file: store-tile.yaml, env: { TILE: 01JPRD00000000000000000008 } }
- runFlow: { file: store-tile.yaml, env: { TILE: 01JPRD0000000000000000000M } }
- runFlow:
    file: ../shared/cobrar-ticket.yaml
    env:
      METODO: Tarjeta
