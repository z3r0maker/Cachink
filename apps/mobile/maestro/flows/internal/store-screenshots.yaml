# The store screenshots (X-05): the real app against the contracts mock, eight
# screens, saved to ${OUT}/0N-<name>.png. One flow for every device: the App
# Store's iPhone 6.9" and iPad 13", Play's phone and tablet. The number is the
# store's order, not the capture's: Inicio first (it shows Don), Vincular last.
#
# Run with -e OUT=<folder> -e FORMA=telefono|tableta (a floating sheet on a
# tablet closes on the drag that hides a phone's keyboard), and -e MOCK=<url>
# when the mock is not on :3000 (another run already holds it).
#
# Before it (README «Reproducing» in app-registration/apple/SCREENSHOTS.md):
# the mock on :3000, Metro with EXPO_PUBLIC_E2E=1, the database reset with
# fresh-install.sh (never clearState: it forgets the dev client's settings),
# the dev menu's «Tools button» off, the status bar at 9:41, the simulator
# renamed «Caja 1» (the header says the device's name).
#
# The story: a taquería's morning. The turno opens with a $2,000 fondo, ten
# products arrive (their «Compra inventario» carries no turno, so the expected
# cash never subtracts it), then three sales: cash with change, transfer,
# card, and one gasto: $180.00 of tortillas.
appId: mx.xangarro.mobile
---
# The gasto's receipt comes from the gallery (store-gasto.yaml).
- addMedia:
    - '../../fixtures/producto-foto.png'
- runScript:
    file: ../shared/mock-reset.js
    env:
      MOCK_API: ${MOCK || MAESTRO_LANE_MOCK_API || 'http://127.0.0.1:3000'}
- launchApp
# The Android dev client can come back on its launcher, its «Recently opened»
# entry pointing at a port Metro never served: open Metro's server by hand.
- runFlow:
    when:
      platform: Android
    commands:
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible: 'http://10\.0\.2\.2:8081'
          commands:
            - tapOn: 'http://10\.0\.2\.2:8081'
- runFlow: ../shared/dismiss-modals.yaml
- extendedWaitUntil:
    visible:
      id: 'activation-screen'
    timeout: 120000
- tapOn:
    id: 'vincular-escribir'
- tapOn:
    id: 'activation-email'
    point: '95%,50%'
- eraseText: 60
- inputText: 'dueno@tacoslaesquina.mx'
# Android shrinks the screen for the keyboard: the code field leaves the view.
- scrollUntilVisible:
    element:
      id: 'activation-code'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'activation-code'
    point: '95%,50%'
- eraseText: 20
- inputText: 'VALDK7M3'
- hideKeyboard
# A portrait Android tablet keeps Gboard up after hideKeyboard; a tap on the
# title (keyboardShouldPersistTaps="handled") puts it away. Optional: on a
# phone the scroll to the code field has already taken the title off screen,
# and there hideKeyboard is enough.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: 'Escribe el código'
          optional: true
# Back to the top, so the shot opens on the title and the correo. The swipe
# runs down the left margin: mid-screen it can start on the code's boxes (a
# portrait tablet) and focus them again.
- repeat:
    times: 2
    commands:
      - swipe:
          start: '5%, 30%'
          end: '5%, 80%'
- runFlow: store-pausa.yaml
- takeScreenshot: ${OUT}/08-activacion

- tapOn:
    id: 'activation-submit'
- runFlow: ../shared/login-operator.yaml
- extendedWaitUntil:
    visible:
      id: 'cloud-sync-pill-synced'
    timeout: 120000
- tapOn:
    id: 'tab-inicio|rail-inicio|sidebar-inicio'
- tapOn:
    id: 'inicio-hero-accion'
- extendedWaitUntil:
    visible:
      id: 'abrir-caja-modal'
    timeout: 5000
- tapOn:
    id: 'fondo-rapido-2000'
- tapOn:
    id: 'caja-abrir-submit'
- extendedWaitUntil:
    visible:
      id: 'inicio-hero-listo'
    timeout: 10000

- runFlow: store-surtir.yaml
- runFlow: store-ventas.yaml
# The gasto lands before Inicio's shot, so every figure tells the same day.
- runFlow: store-gasto.yaml
- runFlow: store-pausa.yaml
- takeScreenshot: ${OUT}/07-gastos

# Gastos sits on Mi turno's stack: back to the root before switching tabs.
- runFlow:
    when:
      visible:
        id: 'top-bar-back'
    commands:
      - tapOn: { id: 'top-bar-back' }
- tapOn:
    id: 'tab-inicio|rail-inicio|sidebar-inicio'
- extendedWaitUntil:
    visible:
      id: 'inicio-hero-listo'
    timeout: 10000
- runFlow: store-pausa.yaml
- takeScreenshot: ${OUT}/01-inicio

- tapOn:
    id: 'tab-ventas|rail-ventas|sidebar-ventas'
- runFlow: store-pausa.yaml
- takeScreenshot: ${OUT}/06-ventas

# Android's tab bar does not pop Mi turno's stack to the root when the tab
# is already selected; the Gastos screen was left above it.
- tapOn:
    id: 'tab-turno|rail-turno|sidebar-turno'
- runFlow:
    when:
      visible:
        id: 'top-bar-back'
    commands:
      - tapOn: { id: 'top-bar-back' }
- extendedWaitUntil:
    visible:
      id: 'mobile-turno'
    timeout: 10000
# Mi turno keeps the scroll the Gastos row left it at: back to the top.
- repeat:
    times: 3
    commands:
      - swipe:
          start: '50%, 35%'
          end: '50%, 85%'
- runFlow: store-pausa.yaml
- takeScreenshot: ${OUT}/05-mi-turno
