# Store-screenshot helper: one «Llegó mercancía» for ${PRODUCTO} × ${CANTIDAD}
# (${ID}: the mock's product id, the row's `inventario-fila-<id>`), from the
# Inventario screen (so the shelves in the store shots don't read «Quedan 0»:
# the mock seeds a catalogue with no inventory movements).
#
# Precondition: on Inventario (mobile-inventario), turno open.
appId: mx.xangarro.mobile
---
# Up first: the last entrada left the list scrolled, and the row may be above.
- scrollUntilVisible:
    element:
      id: 'inventario-fila-${ID}'
    direction: UP
    timeout: 5000
    optional: true
- scrollUntilVisible:
    element:
      id: 'inventario-fila-${ID}'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'inventario-fila-${ID}'
- extendedWaitUntil:
    visible:
      id: 'mover-sheet'
    timeout: 5000
- waitForAnimationToEnd
- tapOn:
    id: 'mover-tipo-Entrada'
- tapOn:
    id: 'mover-cantidad'
- eraseText: 6
- inputText: ${CANTIDAD}
# Phone: one drag in the sheet body dismisses the keyboard (keyboardDismissMode
# on-drag), so the save footer is not under it. iPad: the sheet floats and
# that drag (or hideKeyboard) dismisses the sheet itself; the footer is clear.
# An Android tablet draws the phone's bottom sheet with the keyboard over the
# footer: Back (hideKeyboard) closes only the keyboard there.
- runFlow:
    when:
      true: ${FORMA == 'telefono'}
    commands:
      - swipe:
          start: '50%, 45%'
          end: '50%, 20%'
- runFlow:
    when:
      platform: Android
      true: ${FORMA != 'telefono'}
    commands:
      - hideKeyboard
- waitForAnimationToEnd
- tapOn:
    id: 'mover-guardar'
- extendedWaitUntil:
    visible:
      id: 'mov-toast'
    timeout: 8000
- tapOn:
    id: 'mov-toast-entendido'
