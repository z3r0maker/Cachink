# Store-screenshot helper: one «Llegó mercancía» for ${PRODUCTO} × ${CANTIDAD}
# (${ID}: the mock's product id, the row's `inventario-fila-<id>`), from the
# Inventario screen (so the shelves in the store shots don't read «Quedan 0»:
# the mock seeds a catalogue with no inventory movements).
#
# Precondition: on Inventario (mobile-inventario), turno open.
appId: mx.xangarro.mobile
---
# Up first: the last entrada left the list scrolled, and the row may be above.
- scrollUntilVisible:
    element:
      id: 'inventario-fila-${ID}'
    direction: UP
    timeout: 5000
    optional: true
# Centred: a row found at the foot of the list sits under the tab bar, and
# the tap would open that tab instead. The last row can't be centred (the
# list ends), so the plain scroll after it finds that one.
- scrollUntilVisible:
    element:
      id: 'inventario-fila-${ID}'
    direction: DOWN
    timeout: 5000
    centerElement: true
    optional: true
- scrollUntilVisible:
    element:
      id: 'inventario-fila-${ID}'
    direction: DOWN
    timeout: 5000
- waitForAnimationToEnd
- tapOn:
    id: 'inventario-fila-${ID}'
# A row the scroll left half under the header takes no tap: bring it down a
# little and tap again.
- extendedWaitUntil:
    visible:
      id: 'mover-sheet'
    timeout: 3000
    optional: true
- runFlow:
    when:
      notVisible:
        id: 'mover-sheet'
    commands:
      - swipe:
          start: '50%, 40%'
          end: '50%, 55%'
      - waitForAnimationToEnd
      - tapOn:
          id: 'inventario-fila-${ID}'
- extendedWaitUntil:
    visible:
      id: 'mover-sheet'
    timeout: 5000
- waitForAnimationToEnd
- tapOn:
    id: 'mover-tipo-Entrada'
- waitForAnimationToEnd
# At the field's end: a tap mid-field leaves the cursor before the digits,
# and the erase then removes nothing.
- tapOn:
    id: 'mover-cantidad'
    point: '95%,50%'
- eraseText: 6
- inputText: ${CANTIDAD}
- runFlow: store-entrada-teclado.yaml
# The Android phone can lose the typing (the field still read 0 and the save
# stayed off): type it again until the field holds the quantity. The check
# runs with the keyboard away, which covers the field on a phone.
- repeat:
    while:
      notVisible:
        id: 'mover-cantidad'
        text: '${CANTIDAD}'
    times: 3
    commands:
      - tapOn:
          id: 'mover-cantidad'
          point: '95%,50%'
      - eraseText: 6
      - inputText: ${CANTIDAD}
      - runFlow: store-entrada-teclado.yaml
- assertVisible:
    id: 'mover-cantidad'
    text: '${CANTIDAD}'
- waitForAnimationToEnd
- tapOn:
    id: 'mover-guardar'
# The sheet closes on the save. The toast can come and go before the driver
# looks (Maestro 2.12 on the iPhone): the sheet gone is the save, and a toast
# still up is put away.
- extendedWaitUntil:
    notVisible:
      id: 'mover-sheet'
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: 'mov-toast'
    timeout: 3000
    optional: true
- runFlow:
    when:
      visible:
        id: 'mov-toast-entendido'
    commands:
      - tapOn:
          id: 'mov-toast-entendido'
