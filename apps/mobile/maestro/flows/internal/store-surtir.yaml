# Store-screenshot helper: stock all twenty products, so the shots don't read
# «Quedan 0» (the mock seeds no inventory movements) and Avisos' bell counts
# only the owner's two messages: every product left at 0 is a stock-bajo
# aviso. After the three sales each stays above the threshold of 3.
appId: mx.xangarro.mobile
---
- runFlow:
    file: ../shared/open-turno-row.yaml
    env:
      ROW: 'otros-inventario'
- extendedWaitUntil:
    visible:
      id: 'mobile-inventario'
    timeout: 10000
- runFlow:
