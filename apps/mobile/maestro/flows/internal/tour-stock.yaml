# Tour: Productos / Inventario stock list (Operativo only).
appId: mx.xangarro.mobile
tags: [internal]
---
- launchApp
- runFlow: ../shared/dismiss-modals.yaml
- runFlow: ../shared/authenticate.yaml
- runFlow:
    file: ../shared/open-turno-row.yaml
    env:
      ROW: 'otros-inventario'
- tapOn:
    id: 'inventario-tab-stock'
- assertVisible:
    id: 'stock-buscar'
