# Tour: Gastos (MvGastos), from Mi turno's row.
appId: mx.xangarro.mobile
tags: [internal]
---
- launchApp
- runFlow: ../shared/dismiss-modals.yaml
- runFlow: ../shared/authenticate.yaml
- runFlow:
    file: ../shared/open-turno-row.yaml
    env:
      ROW: 'otros-gastos'
- extendedWaitUntil:
    visible:
      id: 'mobile-gastos'
    timeout: 8000
