# Edit the business name from Settings → Negocio and verify the
# update appears on the card.
#
# Covers the EditBusinessModal flow: Settings → Negocio → "Editar"
# → change nombre → save → updated on card.
#
# Precondition: wizard complete (business already set up).
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/settings-negocio-editar.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Open Settings via the top-bar cog icon.
- runFlow: shared/navigate-to-settings.yaml

# Navigate to the Negocio sub-screen.
- tapOn:
    id: "settings-hub-negocio"
- assertVisible:
    id: "settings-negocio-screen"

# Verify the business card is visible.
- assertVisible:
    id: "settings-business-card"

# Tap the edit button.
- tapOn:
    id: "settings-edit-business"

# EditBusinessModal opens.
- assertVisible:
    id: "edit-business-modal"

# Update the business name.
- tapOn:
    id: "edit-business-nombre"
- eraseText
- inputText: "Tortillería La Doña"

# Save the changes.
- tapOn:
    id: "edit-business-save"

# Modal closes and the updated name appears on the card.
- assertNotVisible:
    id: "edit-business-modal"
- assertVisible: "Tortillería La Doña"
