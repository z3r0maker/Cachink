# Create a new user E2E — Director → Otros → Usuarios → form.
#
# Verifies:
#   1. Navigate to Usuarios section
#   2. Tap "Crear" → fill form (name, role, PIN, recovery password) → submit
#   3. New user appears in the user list
#
# Precondition: wizard + director-setup complete, logged in as Director.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/usuario-crear.yaml
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to Otros → Usuarios.
- tapOn:
    id: "tab-otros"
- tapOn:
    id: "otros-usuarios"

# User list screen renders.
- extendedWaitUntil:
    visible:
      id: "user-list"
    timeout: 5000

# Tap create button.
- tapOn:
    id: "user-create-btn"

# Create user modal appears.
- extendedWaitUntil:
    visible:
      id: "create-user-modal"
    timeout: 5000

# Fill user creation form.
- tapOn:
    id: "new-user-nombre"
- inputText: "Operativo Test"

- tapOn:
    id: "new-user-role"
- tapOn: "operativo"

- tapOn:
    id: "new-user-pin"
- inputText: "111111"

- tapOn:
    id: "new-user-recovery-password"
- inputText: "Recover1"

# Submit.
- tapOn:
    id: "create-user-submit"

# User appears in the list.
- extendedWaitUntil:
    visible: "Operativo Test"
    timeout: 5000
