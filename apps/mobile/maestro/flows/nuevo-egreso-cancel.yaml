# Closing «Registrar gasto» without saving records nothing (Track M, M-08).
#
# Precondition: wizard complete, business set.
# x-entrypoint: demo
appId: mx.xangarro.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- runFlow: shared/abrir-registrar-gasto.yaml

- tapOn: { id: 'numpad-9' }
- tapOn:
    id: 'gasto-concepto'
- inputText: 'No se guarda'
- tapOn:
    id: 'gasto-cancelar'
- extendedWaitUntil:
    notVisible:
      id: 'registrar-gasto'
    timeout: 5000
- assertNotVisible: 'No se guarda'

# The close square does the same, and each opening starts clean.
- tapOn:
    id: 'gastos-registrar'
- assertVisible: 'Escribe cuánto fue.'
- tapOn:
    id: 'registrar-gasto-close'
- assertNotVisible:
    id: 'registrar-gasto'
