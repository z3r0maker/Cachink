# Closing «Registrar gasto» without saving records nothing (Track M, M-08).
#
# Precondition: wizard complete, business set.
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/login-operator.yaml
- runFlow: shared/abrir-registrar-gasto.yaml

# A concepto alone, cancelled: nothing is saved, the sheet closes.
- tapOn: { id: 'gasto-concepto' }
- inputText: 'No se guarda'
- hideKeyboard
- tapOn: { id: 'gasto-cancelar' }
- extendedWaitUntil:
    notVisible: { id: 'registrar-gasto-sheet' }
    timeout: 5000
- assertNotVisible: 'No se guarda'

# Reopening starts clean: the empty sheet blocks on concepto + monto.
- tapOn: { id: 'gastos-abrir-registrar' }
- extendedWaitUntil:
    visible: { id: 'registrar-gasto-sheet' }
    timeout: 5000
- assertVisible: ".*Registrar gasto de \\$___.*"
- tapOn: { id: 'gasto-cancelar' }
- extendedWaitUntil:
    notVisible: { id: 'registrar-gasto-sheet' }
    timeout: 5000
