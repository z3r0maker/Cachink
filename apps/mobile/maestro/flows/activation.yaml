# Vincular — happy path (A-04; MvVincular, M-06): a fresh install opens on
# the camera; the typed path («Escribe el código») takes the owner's correo
# and the eight letters, and a valid code lands on «¿Quién va a cobrar?»
# with the operators the portal created (mock: Toni, Ana).
#
# Precondition: fresh install (no activation record) and the contracts mock
# reset — VALDK7M3 is single-use:
#   PORT=3100 pnpm mock:api   ·   curl -X POST http://127.0.0.1:3000/__mock/reset
# App bundled with EXPO_PUBLIC_API_BASE=http://127.0.0.1:3000.
# x-entrypoint: fresh
appId: mx.xangarro.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- extendedWaitUntil:
    visible:
      id: 'activation-screen'
    timeout: 60000
# Vincular opens on the camera (MvVincular; vincular-escanear.tsx); the QR
# visor cannot be driven from a simulator, so the flow takes the typed path.
- assertVisible: '.*Escanea el código del dueño.*'
- assertVisible: '.*vence a los 15 minutos.*'
- tapOn:
    id: 'vincular-escribir'
# The typed view keeps «‹ Escanear» as the way back (vincular-partes.tsx
# CabezaVolver, testID vincular-escanear).
- assertVisible:
    id: 'vincular-escanear'
# N-34: the aviso de privacidad is on screen before anything is sent.
- scrollUntilVisible:
    element:
      id: 'activation-aviso'
    direction: DOWN
- assertVisible:
    text: '.*Aviso completo y derechos ARCO.*'
# Tap the right edge so the cursor sits at the end; eraseText deletes leftwards.
- tapOn:
    id: 'activation-email'
    point: '95%,50%'
- eraseText: 60
- inputText: 'dueno@tacoslaesquina.mx'
# Tap the right edge so the cursor sits at the end; eraseText deletes leftwards.
- tapOn:
    id: 'activation-code'
    point: '95%,50%'
- eraseText: 20
# Lowercase on purpose: sanitizeCode uppercases (activation-form.ts), and the
# helper copy says case does not matter.
- inputText: 'valdk7m3'
- hideKeyboard
- tapOn:
    id: 'activation-submit'
# The gate swaps Vincular for Acceso (gated-navigation.tsx: activated and no
# userId → QuickSwitchGate).
- extendedWaitUntil:
    visible:
      id: 'quick-switch'
    timeout: 20000
- assertNotVisible:
    id: 'activation-screen'
- assertVisible: '.*¿Quién va a cobrar?.*'
- assertVisible:
    text: '.*Toni.*'
- assertVisible:
    text: '.*Ana.*'
