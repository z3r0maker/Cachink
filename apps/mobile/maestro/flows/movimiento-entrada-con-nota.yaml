# «Llegó mercancía» with a note (Track M, M-09; MvInventario): the note
# travels with the entrada and shows under «Movimientos».
#
# Precondition: signed in with an open turno, and a tracked product "Tortilla".
# x-entrypoint: demo
appId: mx.xangarro.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- runFlow: shared/find-producto-stock.yaml
- tapOn:
    id: 'inventario-fila-.*'
- tapOn:
    id: 'mover-tipo-Entrada'
- tapOn:
    id: 'mover-nota'
- inputText: 'Recibo entrega 4521'
- hideKeyboard
- tapOn:
    id: 'mover-registrar'
- extendedWaitUntil:
    visible:
      id: 'inventario-toast'
    timeout: 5000
- tapOn:
    id: 'inventario-tabs-movimientos'
- assertVisible: '.*Recibo entrega 4521.*'
