# Close with a faltante (Track M, M-09; MvCierre): the difference asks for a
# motive before the close button works, and the closed screen says it.
#
# Verifies:
#   1. Open turno with $500; Cierre counts one $200 bill → Falta $300.00
#   2. «Cerrar turno con faltante de $300.00» stays gray until a motive
#   3. «Otra razón» asks for the note; with it the turno closes
#   4. «Turno cerrado» with the faltante
#
# Precondition: demo mode seeded, the operator's turno not yet open or open
# with no sales.
# x-entrypoint: demo
appId: mx.xangarro.mobile
tags:
  - caja
  - cierre
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- runFlow: shared/ensure-caja-open.yaml

- tapOn:
    id: 'turno-cerrar'
- extendedWaitUntil:
    visible:
      id: 'cierre-esperado'
    timeout: 8000
- tapOn:
    id: 'conteo-billete-200-mas'
- scrollUntilVisible:
    element:
      id: 'cierre-diferencia-falta'
    direction: DOWN
    timeout: 5000
- assertVisible:
    text: 'Elige un motivo para poder cerrar.'

- tapOn:
    id: 'cierre-motivo-3'
- assertVisible:
    text: 'Escribe la nota para poder cerrar.'
- tapOn:
    id: 'cierre-nota'
- inputText: 'Se pagó el gas sin registrar'
- hideKeyboard

- tapOn:
    id: 'cierre-cerrar'
- extendedWaitUntil:
    visible:
      id: 'cierre-hecho'
    timeout: 8000
- assertVisible:
    text: 'Con un faltante de $300.00.'
