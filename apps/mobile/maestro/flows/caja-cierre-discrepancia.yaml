# Cierre with a diferencia explained by its own note (M-09; the old flow's
# CountResultStep dropdown + explicación is gone): count short, the motivo
# chips come out, «Otra razón» is the one that also asks for a nota — the
# close stays blocked until it is written — and the hecho screen carries the
# motivo in its line.
#
# Precondition: activated device, turno open with the $500 fondo
# (shared/ensure-caja-open.yaml), nothing else captured.
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/login-operator.yaml
- runFlow: shared/ensure-caja-open.yaml
- tapOn:
    id: 'tab-turno'
- extendedWaitUntil:
    visible:
      id: 'turno-cerrar-mi-turno'
    timeout: 10000
- tapOn:
    id: 'turno-cerrar-mi-turno'
- extendedWaitUntil:
    visible:
      id: 'mobile-cierre'
    timeout: 10000

# Count two $200 bills: $400 of the $500 expected → $100 short.
- tapOn:
    id: 'conteo-mas-billete-200'
- tapOn:
    id: 'conteo-mas-billete-200'

# Falta, with the amount in the close button (cerrarLabel).
- scrollUntilVisible:
    element:
      id: 'cierre-diferencia'
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 60
- assertVisible: '.*Falta.*'

# «Otra razón» asks for the nota (cierre-explica.tsx Nota; the hint under the
# button says which half is missing, cerrarHint in caja/src/cierre/copy.ts).
- tapOn:
    id: 'cierre-motivo-Otra razón'
- scrollUntilVisible:
    element:
      id: 'cierre-cerrar-turno'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- assertVisible: '.*Cerrar turno con faltante de \$100\.00.*'
- assertVisible: '.*Escribe la nota para poder cerrar\..*'
- tapOn:
    id: 'cierre-nota'
- inputText: 'Se cayó el sobre del cambio'
- hideKeyboard
- tapOn:
    id: 'cierre-cerrar-turno'

# Hecho: «Faltante» with the note's motivo in its line (lineaCerrado).
- extendedWaitUntil:
    visible:
      id: 'cierre-hecho'
    timeout: 10000
- assertVisible: '.*Faltante.*'
- assertVisible: '.*Con un faltante de \$100\.00\..*'
- assertVisible: '.*Quedó un faltante explicado como «Otra razón»\..*'
