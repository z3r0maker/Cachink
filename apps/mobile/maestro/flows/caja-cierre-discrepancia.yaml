# Close caja with amount mismatch — requires reason + explanation.
#
# Verifies:
#   1. Open caja with 500 via numpad
#   2. Close with 400 via blind count → discrepancy of -100
#   3. count-result-reason dropdown must be selected
#   4. count-result-explicacion text field must be filled
#   5. Submit → caja closes
#
# Caja Overhaul: Opening uses Numpad. Closing is a 2-step blind-count
# flow (BlindCountStep → CountResultStep). Discrepancy reason and
# explicacion now live in CountResultStep.
#
# Precondition: wizard + director-setup complete, caja feature flag ON.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/funciones-toggle.yaml
#   maestro test apps/mobile/maestro/flows/caja-cierre-discrepancia.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to Otros → Caja.
- tapOn:
    id: "tab-otros"
- tapOn:
    id: "otros-caja"

# Open caja with 500 via numpad.
- extendedWaitUntil:
    visible:
      id: "abrir-caja-modal"
    timeout: 5000
- tapOn: { id: "numpad-5" }
- tapOn: { id: "numpad-0" }
- tapOn: { id: "numpad-0" }
- tapOn:
    id: "caja-abrir-submit"

# Status card visible.
- assertVisible:
    id: "caja-status-card"

# --- Close with discrepancy ---
- tapOn:
    id: "caja-cerrar-btn"

# Step 1: BlindCountStep — enter 400 (expected was 500 → -100 discrepancy).
- assertVisible:
    id: "cerrar-caja-step-1"
- tapOn: { id: "numpad-4" }
- tapOn: { id: "numpad-0" }
- tapOn: { id: "numpad-0" }
- tapOn:
    id: "blind-count-continue"

# Step 2: CountResultStep — comparison shows discrepancy.
- assertVisible:
    id: "cerrar-caja-step-2"
- assertVisible:
    id: "comparison-card"

# Try to close without reason — button should be disabled (diff ≠ 0).
# Select a reason from the dropdown.
- tapOn:
    id: "count-result-reason"
- tapOn:
    index: 0

# Enter explanation text.
- tapOn:
    id: "count-result-explicacion"
- inputText: "Error de cambio al cliente"

# Now submit should succeed.
- tapOn:
    id: "count-result-close"

# Verify caja is closed.
- assertVisible:
    id: "caja-status-card"
