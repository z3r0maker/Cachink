# Cobrar with no products (Track M, M-07): the catalogue says there is
# nothing yet and offers «Producto nuevo» right there. (Product management
# left the phone in M-01; the old «Registra tus productos» gate went with it.)
#
# Precondition: fresh install with wizard complete but NO products.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/empty-ventas.yaml
# x-entrypoint: wizard
appId: mx.xangarro.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate-wizard.yaml
- runFlow: shared/ensure-caja-open.yaml

- tapOn:
    id: 'tab-cobrar'
- extendedWaitUntil:
    visible:
      id: 'cobrar-vacio'
    timeout: 5000
- assertVisible: 'Todavía no hay productos'
- assertVisible:
    id: 'cobrar-vacio-nuevo'
- assertVisible: 'Toca un producto para empezar'
