# Verify the productos gate blocks Ventas when no products exist.
# With the productos gate, fresh state renders ProductosGateBanner
# ("Registra tus productos") instead of the old empty-state component.
#
# Precondition: fresh install with wizard complete but NO products.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/empty-ventas.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate-wizard.yaml

# Navigate to the Ventas tab.
- tapOn:
    id: "tab-ventas"

# No products registered yet — the productos gate renders.
- assertVisible:
    id: "productos-gate-banner"

# The CTA button to navigate to Productos should be visible.
- assertVisible:
    id: "productos-gate-go-to-productos"

# Product grid should NOT be visible.
- assertNotVisible:
    id: "ventas-product-grid"
