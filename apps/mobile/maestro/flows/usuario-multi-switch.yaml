# Switch operators on one device: Toni → lock → Ana → lock → Toni.
# Each operator signs in with their own PIN from QuickSwitch (A-05/A-07).
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- assertVisible:
    id: 'tab-ventas'

- runFlow: shared/login-ana.yaml
- assertVisible:
    id: 'tab-ventas'

# Lock, then Toni signs back in.
- tapOn:
    id: 'top-bar-left'
- extendedWaitUntil:
    visible:
      id: 'quick-switch'
    timeout: 20000
- runFlow: shared/login-operator.yaml
- assertVisible:
    id: 'tab-caja'
