# QuickSwitch with multiple users — switch between user avatars.
#
# Verifies:
#   1. After creating a second user (Operativo), relaunch app
#   2. QuickSwitch shows multiple user avatars
#   3. Tap second avatar → enter PIN → lands on Operativo tabs
#   4. tab-ventas visible (Operativo landing)
#
# Precondition: wizard + director-setup complete, a second Operativo
# user exists (created by usuario-crear.yaml).
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/usuario-crear.yaml
#   maestro test apps/mobile/maestro/flows/usuario-multi-switch.yaml
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml

# QuickSwitchScreen should show with multiple avatars.
- extendedWaitUntil:
    visible:
      id: "quick-switch"
    timeout: 10000

# Tap the second avatar (Operativo Test user).
- tapOn:
    id: "user-avatar-1"

# Enter the Operativo PIN.
- tapOn:
    id: "pin-input"
- inputText: "111111"

- tapOn:
    id: "login-submit"

# Should land on Operativo tabs — verify Ventas tab is visible.
- extendedWaitUntil:
    visible:
      id: "tab-ventas"
    timeout: 10000
