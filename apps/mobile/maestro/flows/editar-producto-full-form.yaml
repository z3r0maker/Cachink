# Edit an existing producto changing ALL optional fields (SKU, unidad, categoría, color).
#
# Extends editar-producto.yaml which only edits nombre + umbral.
# This flow exercises the remaining uncovered fields:
#   - editar-producto-categoria
#   - editar-producto-sku
#   - editar-producto-unidad
#   - editar-producto-color-fondo
#
# Precondition: wizard + at least one producto exists.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/inventario-producto.yaml
#   maestro test apps/mobile/maestro/flows/editar-producto-full-form.yaml
#
# The inventario-producto flow creates "Tortilla".
# x-entrypoint: demo
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Find the product via search and open its detail route.
- runFlow: shared/find-producto-stock.yaml
- tapOn:
    id: "producto-card-.*"
- assertVisible:
    id: "detail-nombre"

# Edit the NOMBRE first (clean focus), then the SKU. Both are id-selectable
# text inputs on the full detail form.
- tapOn:
    id: "detail-nombre"
- eraseText
- inputText: "Tortilla full form"
- tapOn:
    id: "detail-sku"
- eraseText
- inputText: "TORT-FULL-001"

# Dismiss the keyboard so it does not cover GUARDAR.
- hideKeyboard

# Save — navigates back to the stock list on success.
- tapOn:
    id: "detail-save"
- assertNotVisible:
    id: "detail-save"

# Verify the edit persisted: re-search and assert the new name.
- extendedWaitUntil:
    visible:
      id: "stock-buscar"
    timeout: 8000
- tapOn:
    id: "stock-buscar"
- eraseText
- inputText: "Tortilla"
- assertVisible:
    text: "Tortilla full form.*"
- hideKeyboard
