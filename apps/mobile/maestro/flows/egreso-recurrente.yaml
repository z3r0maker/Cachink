# Pay a recurring gasto that is due (Track M, M-08): «Registrar» on
# «Pendientes de registrar» opens the sheet filled from the template;
# saving it records the gasto and advances the schedule, so the row leaves.
#
# The phone no longer creates recurring gastos (the owner does, in the
# portal). Precondition: a due template on the device, e.g. the mock
# scenario's `01JPHK0000000000000000RE01`.
# x-entrypoint: demo
appId: mx.xangarro.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- runFlow:
    file: shared/open-turno-row.yaml
    env:
      ROW: 'otros-gastos'

- assertVisible: 'Pendientes de registrar'
- tapOn:
    id: 'pendiente-registrar-01JPHK0000000000000000RE01'
- extendedWaitUntil:
    visible:
      id: 'registrar-gasto'
    timeout: 5000
- assertVisible: 'Gasto que se repite'
- tapOn:
    id: 'gasto-guardar'
- extendedWaitUntil:
    notVisible:
      id: 'registrar-gasto'
    timeout: 5000
- assertNotVisible:
    id: 'pendiente-01JPHK0000000000000000RE01'
