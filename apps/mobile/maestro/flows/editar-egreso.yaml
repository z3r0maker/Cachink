# Edit an existing egreso via the swipe-to-edit gesture and verify
# the updated concepto appears in the egresos list.
#
# Covers CRUD Update for Egresos (Edit flow).
#
# Precondition: wizard complete + at least one egreso exists.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/egreso-gasto.yaml
#   maestro test apps/mobile/maestro/flows/editar-egreso.yaml
#
# The egreso-gasto flow creates "Renta del local" at $8,000.
# x-entrypoint: demo
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to the Egresos tab.
- tapOn:
    id: "tab-gastos"

# Verify the existing egreso is visible.
- assertVisible: "Renta del local"

# Swipe the egreso row left to reveal the edit action.
# SwipeableRow on the first egreso triggers onSwipeLeft → setEditing.
- swipe:
    id: "egresos-list"
    direction: LEFT
    startX: 300
    endX: 50

# Wait for the EditarEgresoModal to appear.
- extendedWaitUntil:
    visible:
      id: "editar-egreso-modal"
    timeout: 5000

# Update the concepto field.
- tapOn:
    id: "editar-egreso-concepto"
- eraseText
- inputText: "Renta actualizada"

# Submit the edit.
- tapOn:
    id: "editar-egreso-submit"

# Modal closes and the updated egreso appears in the list.
- assertNotVisible:
    id: "editar-egreso-modal"
- assertVisible: "Renta actualizada"
