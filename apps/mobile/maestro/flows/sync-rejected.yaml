# Refused records (A-08) on Registros por enviar (Track M, M-09): a sale the
# server refuses stays on the device, the pill reports it and opens the
# screen, which lists it under «No se pudieron enviar» with the reason and the
# hint. Once the portal restores the product, "Reintentar" gets it accepted.
#
# Precondition: device activated against the mock on MOCK_API (activation.yaml).
# The mock forgets "Agua de horchata" (as if purged in the portal), so the
# sale is rejected with FK_PRODUCT_MISSING; the flow restores it before retrying.
# x-entrypoint: activated
appId: mx.xangarro.mobile
env:
  MOCK_API: http://127.0.0.1:3100
---
- runFlow: shared/login-operator.yaml
- runFlow: shared/ensure-caja-open.yaml
- tapOn:
    id: 'tab-cobrar'
- runScript:
    file: shared/mock-row.js
    env:
      ACTION: forget
      TABLE: products
      ROW_ID: 01JPRD00000000000000000007
- tapOn: 'Agregar Agua de horchata,.*'
- tapOn:
    id: 'cart-checkout-btn'
- tapOn:
    id: 'ticket-cobrar'
- tapOn:
    id: 'cobro-metodo-Transferencia'
- tapOn:
    id: 'cobro-submit'
- extendedWaitUntil:
    visible:
      id: 'cloud-sync-pill-rejected'
    timeout: 30000
- tapOn:
    id: 'cloud-sync-pill'
- extendedWaitUntil:
    visible:
      id: 'no-enviados-screen'
    timeout: 10000
- assertVisible: '.*Agua de horchata.*'
- assertVisible: 'El producto de este registro ya no existe en el portal.'
- assertVisible: '.*Regístrala con otro producto.*'
- runScript:
    file: shared/mock-row.js
    env:
      ACTION: restore
      TABLE: products
      ROW_ID: 01JPRD00000000000000000007
- tapOn:
    id: 'no-enviados-retry-all|no-enviado-retry-.*'
- extendedWaitUntil:
    visible:
      id: 'pendientes-heroe-enviado'
    timeout: 30000
- assertNotVisible:
    id: 'no-enviados-screen'
- assertVisible:
    id: 'cloud-sync-pill-synced'
