# Settings → scroll to bottom → assert settings-check-for-updates visible.
# Covers Gap N (Phase 17): settings-check-for-updates testID.
#
# testIDs exercised:
#   settings-check-for-updates
#
# Precondition: wizard complete.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/settings-check-updates.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Open Settings via the top-bar cog icon.
- runFlow: shared/navigate-to-settings.yaml

# Scroll down to find the "Check for updates" button.
- scrollUntilVisible:
    element:
      id: "settings-check-for-updates"
    direction: DOWN
    timeout: 5000

- assertVisible:
    id: "settings-check-for-updates"
