# Balance General renders with data — verify asset/liability cards.
#
# Verifies:
#   1. Navigate to Estados → Balance tab
#   2. balance-activo-card visible
#   3. balance-activo-efectivo visible
#   4. balance-pasivo-capital-card visible
#
# Precondition: wizard complete, at least one venta + one egreso exist.
# Director role.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/inventario-producto.yaml
#   maestro test apps/mobile/maestro/flows/venta-efectivo.yaml
#   maestro test apps/mobile/maestro/flows/egreso-gasto.yaml
#   maestro test apps/mobile/maestro/flows/estados-balance-data.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate-director.yaml

# Navigate to the Estados tab (Director role).
- tapOn:
    id: "tab-estados"

# Verify EstadosShell renders.
- assertVisible:
    id: "estados-shell"

# Switch to the Balance sub-tab.
- tapOn:
    id: "estados-tab-balance"
- extendedWaitUntil:
    visible:
      id: "estados-tab-balance"
    timeout: 3000

# --- Verify data sections render ---
- assertVisible:
    id: "balance-activo-card"
- assertVisible:
    id: "balance-activo-efectivo"
- assertVisible:
    id: "balance-pasivo-capital-card"
