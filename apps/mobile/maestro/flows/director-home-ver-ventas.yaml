# Director Home — tap "Ver ventas" link in KPI strip to navigate.
#
# Extends director-home.yaml which asserts KPI cards exist but
# never taps the "Ver" navigation links:
#   - hoy-kpi-ventas-ver
#
# Precondition: wizard complete, at least one venta exists, Director role.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/inventario-producto.yaml
#   maestro test apps/mobile/maestro/flows/venta-efectivo.yaml
#   maestro test apps/mobile/maestro/flows/director-home-ver-ventas.yaml
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate-director.yaml

# After authenticate.yaml, Director is on Home.
- assertVisible:
    id: "director-home-route"

# Assert the KPI strip is visible.
- assertVisible:
    id: "hoy-kpi-strip"

# Tap the "Ver ventas" link inside the KPI strip.
- tapOn:
    id: "hoy-kpi-ventas-ver"

# Verify navigation to the Ventas tab/screen.
- extendedWaitUntil:
    visible:
      id: "tab-ventas"
    timeout: 5000
