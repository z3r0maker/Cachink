# Forced password change E2E — operativo with mustChangePassword.
#
# Verifies:
#   1. Director creates operativo with mustChangePassword flag
#   2. Operativo logs in → forced change screen appears
#   3. Enter new password → submit → tabs mount
#
# Precondition: wizard + director-setup complete.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/usuario-crear.yaml
#   maestro test apps/mobile/maestro/flows/change-password.yaml
#
# Note: usuario-crear.yaml creates "Operativo Test" with password "Oper1234".
# If mustChangePassword is set during creation, this flow tests the gate.
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml

# QuickSwitch should show multiple user avatars now.
- extendedWaitUntil:
    visible:
      id: "quick-switch"
    timeout: 10000

# Select the operativo user (second avatar — index 1).
- tapOn:
    id: "user-avatar-1"
    optional: true

# Enter the operativo's initial password.
- tapOn:
    id: "password-input"
- inputText: "Oper1234"
- tapOn:
    id: "login-submit"

# Forced change password screen appears.
- extendedWaitUntil:
    visible:
      id: "change-password"
    timeout: 10000

# Fill new password.
- tapOn:
    id: "new-password"
- inputText: "NewOper99"
- tapOn:
    id: "confirm-password"
- inputText: "NewOper99"
- tapOn:
    id: "change-password-submit"

# Tabs mount — operativo is now logged in.
- extendedWaitUntil:
    visible:
      id: "tab-ventas"
    timeout: 10000
