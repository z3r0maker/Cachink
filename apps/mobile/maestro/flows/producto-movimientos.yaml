# Inventario's «Movimientos · N» (Track M, M-09; MvInventario): the turno's
# entradas and mermas, newest first.
#
# Precondition: signed in with an open turno and at least one movement in it
# (producto-entrada-stock.yaml).
# x-entrypoint: demo
appId: mx.xangarro.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- runFlow:
    file: shared/open-turno-row.yaml
    env:
      ROW: 'otros-inventario'
- tapOn:
    id: 'inventario-tabs-movimientos'
- assertVisible:
    id: 'inventario-mov-.*'
- assertNotVisible:
    id: 'inventario-sin-movs'
