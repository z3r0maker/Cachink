# Exportar todos los datos → Excel workbook (P1C-M9-T01).
#
# Covers the Slice 3 C26 flow: Settings → Sistema → "Exportar todos
# los datos" → native share sheet surfaces the .xlsx file.
#
# Precondition: wizard-local-standalone.yaml complete.
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to Settings → Sistema where export lives.
- runFlow: shared/navigate-to-settings.yaml
- tapOn:
    id: "settings-hub-sistema"
- extendedWaitUntil:
    visible: "Sistema"
    timeout: 5000

# Scroll to the export datos card.
- scrollUntilVisible:
    element:
      id: "export-datos-card"
    direction: DOWN
    timeout: 5000
- assertVisible:
    id: "export-datos-card"

# Trigger the export. The "Generando" status may flash too quickly
# to assert, so we just verify the button is tappable.
- tapOn:
    id: "export-datos-btn"
