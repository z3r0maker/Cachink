# Settings → Export Datos — trigger data export from Settings.
#
# Verifies:
#   1. Navigate to Settings → Sistema
#   2. export-datos-card visible
#   3. Tap export-datos-btn
#   4. export-datos-status shows progress/success
#
# Precondition: wizard complete, at least one venta/egreso exist
# for meaningful export data.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/inventario-producto.yaml
#   maestro test apps/mobile/maestro/flows/venta-efectivo.yaml
#   maestro test apps/mobile/maestro/flows/settings-export-datos.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Open Settings via the top-bar cog icon.
- tapOn:
    id: "top-bar-open-settings"

# Navigate to Sistema sub-screen.
- tapOn:
    id: "settings-hub-sistema"

# Verify the export datos card is visible.
- assertVisible:
    id: "export-datos-card"

# Trigger the export.
- tapOn:
    id: "export-datos-btn"

# Verify export status shows progress or success.
- assertVisible:
    id: "export-datos-status"
