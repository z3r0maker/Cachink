# Test form validation on the NuevoProducto modal.
#
# Two cases:
#   1. Empty nombre → error shown, modal stays open (nombre is the
#      only truly required field).
#   2. Empty costo → product saves (review item #5: costo is optional
#      for services and donated / gifted stock).
#
# Precondition: wizard complete.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/validation-producto.yaml
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
# The quick-add sheet's validation (MvProductoNuevo): the nombre is what
# blocks — the Agregar button says so until it is filled, and filling it
# lets the save through (the ticket names the product). The door on a
# seeded catalogue is a search with no matches.
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/login-operator.yaml
- runFlow: shared/ensure-caja-open.yaml
- tapOn:
    id: 'tab-cobrar|rail-cobrar|sidebar-cobrar'
- extendedWaitUntil:
    visible:
      id: 'ventas-product-grid'
    timeout: 8000
- tapOn:
    id: 'cobrar-search'
- inputText: 'zzz'
- hideKeyboard
- tapOn:
    text: 'Producto nuevo'
- extendedWaitUntil:
    visible:
      id: 'producto-nuevo-sheet'
    timeout: 5000
- waitForAnimationToEnd

# Case 1: no nombre — the precio alone does not unlock Agregar.
- tapOn:
    id: 'producto-nuevo-precio'
- inputText: '15'
- swipe:
    start: '50%,45%'
    end: '50%,25%'
- waitForAnimationToEnd
- assertVisible:
    text: '.*Escribe el nombre y el precio.*'

# Case 2: the nombre unlocks it; the ticket names the product.
- tapOn:
    id: 'producto-nuevo-nombre'
- waitForAnimationToEnd
- inputText: 'Asesor'
- runFlow:
    when:
      notVisible:
        id: 'producto-nuevo-nombre'
        text: '.*Asesor.*'
    commands:
      - tapOn: { id: 'producto-nuevo-nombre' }
      - eraseText
      - inputText: 'Asesor'
# The keyboard came up for the nombre; dismiss it or Agregar's tap lands
# on a key and the sheet never closes.
- swipe:
    start: '50%,45%'
    end: '50%,25%'
- waitForAnimationToEnd
- assertVisible:
    text: '.*Agregar y ponerlo en el ticket.*'
- tapOn:
    id: 'producto-nuevo-agregar'
- extendedWaitUntil:
    notVisible: { id: 'producto-nuevo-nombre' }
    timeout: 15000
# The search filter ('zzz') still hides the grid and the ticket panel folds
# its line out of the tree; the observable contract is that the ticket got a
# line at all — its Vaciar button only renders with one.
- extendedWaitUntil:
    visible: { id: 'cobrar-bar-vaciar' }
    timeout: 10000
