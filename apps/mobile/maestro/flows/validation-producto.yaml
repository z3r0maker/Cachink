# Test form validation on the NuevoProducto modal.
#
# Two cases:
#   1. Empty nombre → error shown, modal stays open (nombre is the
#      only truly required field).
#   2. Empty costo → product saves (review item #5: costo is optional
#      for services and donated / gifted stock).
#
# Precondition: wizard complete.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/validation-producto.yaml
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

- tapOn:
    id: 'tab-productos'
- tapOn:
    id: 'stock-nuevo-producto'
- assertVisible: 'Nuevo producto'

# Price without a name: quick-add refuses to save.
- tapOn:
    id: 'producto-precio-venta'
- inputText: '15'
- hideKeyboard
- tapOn:
    id: 'producto-submit'
- assertVisible: 'Nuevo producto'

# Add the name: it saves and the product is listed.
- tapOn:
    id: 'producto-nombre'
- inputText: 'Servicio de asesoría'
- hideKeyboard
- tapOn:
    id: 'producto-submit'
- assertNotVisible: 'Nuevo producto'
- extendedWaitUntil:
    visible:
      id: 'stock-buscar'
    timeout: 8000
- tapOn:
    id: 'stock-buscar'
- inputText: 'asesoría'
- assertVisible: '.*Servicio de asesoría.*'
- hideKeyboard
