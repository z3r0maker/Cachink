# Test form validation on the NuevoProducto modal.
#
# Two cases:
#   1. Empty nombre → error shown, modal stays open (nombre is the
#      only truly required field).
#   2. Empty costo → product saves (review item #5: costo is optional
#      for services and donated / gifted stock).
#
# Precondition: wizard complete.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/validation-producto.yaml
# x-entrypoint: demo
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to the Productos tab.
- tapOn:
    id: "tab-productos"

# Open the NuevoProducto modal.
- tapOn:
    id: "stock-nuevo-producto"

# The modal should be open.
- assertVisible: "Nuevo producto"

# ── Case 1: empty nombre blocks submission ──────────────────────
- tapOn:
    id: "producto-costo"
- inputText: "5"
- tapOn:
    id: "producto-precio-venta"
- inputText: "15"

- tapOn:
    id: "producto-submit"

# Modal should still be open — validation prevents submission
# when nombre is empty.
- assertVisible: "Nuevo producto"

# ── Case 2: costo may be left empty ─────────────────────────────
# Clear the cost we just typed and give the product a name. The
# product must save: costo is optional, so the modal closes.
- tapOn:
    id: "producto-costo"
- eraseText
- tapOn:
    id: "producto-nombre"
- inputText: "Servicio de asesoría"
- hideKeyboard

- tapOn:
    id: "producto-submit"

# Modal closed → the save went through with no costo.
- assertNotVisible: "Nuevo producto"
- assertVisible: "Servicio de asesoría"
