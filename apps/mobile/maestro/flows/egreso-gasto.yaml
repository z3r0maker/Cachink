# Record a gasto from the drawer and see it in the turno's list (Track M,
# M-08; MvGastos): the amount on the keypad, what was bought, a category.
# The gasto is scoped to the open turno, so «Salió de caja chica» counts it.
#
# Precondition: wizard complete, business set, a turno open.
# x-entrypoint: demo
appId: mx.xangarro.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- runFlow: shared/abrir-registrar-gasto.yaml

- tapOn: { id: 'numpad-8' }
- tapOn: { id: 'numpad-0' }
- tapOn: { id: 'numpad-0' }
- tapOn: { id: 'numpad-0' }
- tapOn:
    id: 'gasto-concepto'
- inputText: 'Renta del local'
- tapOn:
    id: 'gasto-categoria-Servicios'
- tapOn:
    id: 'gasto-guardar'

# The sheet closes, the toast confirms and the row is on the list.
- extendedWaitUntil:
    notVisible:
      id: 'registrar-gasto'
    timeout: 5000
- assertVisible:
    id: 'gastos-resumen'
- assertVisible: '−$8,000.00'
- assertVisible: 'Renta del local'
