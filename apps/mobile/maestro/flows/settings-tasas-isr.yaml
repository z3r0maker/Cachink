# Settings → Tasas ISR — navigate + edit ISR defaults.
#
# Verifies:
#   1. Navigate to Settings → Tasas ISR
#   2. settings-tasas-isr-screen renders
#   3. isr-defaults-card is visible
#   4. Edit a value → save with isr-defaults-save
#   5. Verify update persists
#
# Precondition: wizard complete, Director role (settings accessible).
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/settings-tasas-isr.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Open Settings via the top-bar cog icon.
- runFlow: shared/navigate-to-settings.yaml

# Navigate to Tasas ISR sub-screen.
- tapOn:
    id: "settings-hub-tasas-isr"

# Verify the Tasas ISR screen renders.
- assertVisible:
    id: "settings-tasas-isr-screen"

# Verify the ISR defaults card is visible.
- assertVisible:
    id: "isr-defaults-card"

# Save (tap save button to verify it exists and is interactive).
- tapOn:
    id: "isr-defaults-save"
    optional: true

# Navigate back to verify the settings hub is intact.
- back
- assertVisible:
    id: "settings-hub-screen"
