# PIN recovery via password E2E — QuickSwitch → forgot → password → new PIN.
#
# Verifies:
#   1. Happy: tap "¿Olvidaste tu PIN?" → enter recovery password + new PIN → submit → back to QuickSwitch
#   2. Edge: wrong recovery password → error message visible
#
# Precondition: wizard + director-setup complete (recovery password: Test1234), app relaunched.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/recovery-pin.yaml
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml

# QuickSwitchScreen should be showing.
- extendedWaitUntil:
    visible:
      id: "quick-switch"
    timeout: 10000

# Tap forgot PIN link.
- tapOn:
    id: "forgot-pin-link"

# Recovery screen appears.
- extendedWaitUntil:
    visible:
      id: "recovery-screen"
    timeout: 5000

# --- Edge case: wrong recovery password ---
- tapOn:
    id: "recovery-password"
- inputText: "WrongPass"
- tapOn:
    id: "recovery-new-pin"
- inputText: "333333"
- tapOn:
    id: "recovery-confirm-pin"
- inputText: "333333"
- tapOn:
    id: "recovery-submit"

# Error message for wrong recovery password.
- assertVisible: "contraseña de recuperación"

# --- Happy path: correct recovery password ---
- tapOn:
    id: "recovery-password"
- inputText: "Test1234"
- tapOn:
    id: "recovery-new-pin"
- inputText: "333333"
- tapOn:
    id: "recovery-confirm-pin"
- inputText: "333333"
- tapOn:
    id: "recovery-submit"

# Success — back to QuickSwitch (or auto-logged in).
- extendedWaitUntil:
    visible:
      id: "quick-switch"
    timeout: 5000
    optional: true
- extendedWaitUntil:
    visible:
      id: "tab-estados"
    timeout: 5000
    optional: true
