# Gastos del turno (Track M-11, M-08; board MvGastos): Inicio's atajo opens
# /gastos, «Registrar gasto» records what left the drawer — concepto, monto y
# categoría required — and the new row heads the list. The unhappy path first:
# an empty monto leaves the action blocked (it still reads «$___»).
#
# Precondition: device activated against the contracts mock; the harness signs
# in the operator and lands on Inicio (a turno is opened here if none is).
# x-entrypoint: activated
appId: mx.xangarro.mobile
tags:
  - gastos
  - regression
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/login-operator.yaml

# A gasto stamps the open turno; open one only if Inicio still asks for it.
- tapOn: { id: 'tab-inicio|rail-inicio|sidebar-inicio' }
- runFlow:
    when:
      visible:
        id: 'inicio-hero-cerrado'
    commands:
      - tapOn: { id: 'inicio-hero-accion' }
      - extendedWaitUntil: { visible: { id: 'abrir-caja-modal' }, timeout: 5000 }
      - tapOn: { id: 'fondo-rapido-500' }
      - tapOn: { id: 'caja-abrir-submit' }
- extendedWaitUntil: { visible: { id: 'inicio-hero-listo' }, timeout: 10000 }
# The hero reflows as the turno's KPIs land; let it settle or the atajo tap
# resolves stale coordinates (the screen then never opens).
- waitForAnimationToEnd

# Inicio's shortcut tile opens Gastos.
- runFlow:
    when:
      visible:
        id: 'inicio-atajo-gastos'
    commands:
      - tapOn: { id: 'inicio-atajo-gastos' }
- runFlow:
    when:
      # Still on Inicio = the atajo never existed (the tablet drops
      # it); «atajo gone» would also be true a beat AFTER the phone
      # taps it and navigates away, and the deep link would then
      # fight the navigation with the iOS «Open in …?» dialog.
      visible:
        id: 'inicio-hero-listo'
    commands:
      # The atajos are phone-only (inicio-screen drops them when wide); the
      # tablet deep-links the same screen (the navigate-to-settings pattern).
      - openLink: 'xangarro://gastos'
- extendedWaitUntil:
    visible:
      id: 'mobile-gastos'
    timeout: 8000
- extendedWaitUntil: { visible: { id: 'mobile-gastos' }, timeout: 8000 }
- assertVisible: '.*Lo que salió de la caja en tu turno.*'
- assertVisible: { id: 'gastos-cifras' }

# Unhappy: concepto alone is not enough — no monto, no categoría, and the
# action stays blocked (the button still says «$___»; the sheet stays open).
- tapOn: { id: 'gastos-abrir-registrar' }
- extendedWaitUntil: { visible: { id: 'registrar-gasto-sheet' }, timeout: 5000 }
- tapOn: { id: 'gasto-concepto' }
# The keyboard's rise races the typing on the iPad (keystrokes drop into the
# moving sheet — once clear off it). Let it fully mount first, then type.
- waitForAnimationToEnd
- waitForAnimationToEnd
- inputText: 'Cilindro de gas'
- waitForAnimationToEnd
# No dismissal step: the harness connects the sims' hardware keyboard, so no
# OS keyboard ever rises to bury the pinned footer (the phone's software
# keyboard once ate the guardar tap — the footer never saved).
- tapOn: { id: 'gasto-guardar' }
- assertVisible: ".*Registrar gasto de \\$___.*"
- assertVisible: { id: 'registrar-gasto-sheet' }

# Happy: monto + categoría, and the sheet closes on the saved gasto.
# Settle before typing: digits typed during the field's focus transition
# drop (a '350' once landed as '30' — and the wrong amount saved).
- tapOn: { id: 'gasto-monto' }
- waitForAnimationToEnd
- inputText: '350'
# The sheet's footer says the parsed monto; if a digit still dropped, fix it
# before anything is saved.
- runFlow:
    when:
      visible:
        id: 'gasto-guardar'
        text: ".*\\$30\\.00.*"
    commands:
      - tapOn: { id: 'gasto-monto' }
      - eraseText
      - inputText: '350'
# Settle after the monto typing (a digit once dropped mid-ride; the
# conditional below catches it if it ever comes back).
- waitForAnimationToEnd
- waitForAnimationToEnd
# Swipe the sheet's OWN body (registrar-gasto-sheet-body) — never the
# screen. The iPad's sheet is short and a centre-of-screen swipe begins on
# the scrim above it, whose tap closes the sheet outright; the body ScrollView
# is the one container that can reveal the wrapped chips. `scroll` takes no
# element in this Maestro — an element-anchored `swipe` is the scoped gesture.
- runFlow:
    when:
      notVisible:
        id: 'gasto-categoria-Insumos'
    commands:
      - swipe:
          element:
            id: 'registrar-gasto-sheet-body'
          direction: UP
- runFlow:
    when:
      notVisible:
        id: 'gasto-categoria-Insumos'
    commands:
      - swipe:
          element:
            id: 'registrar-gasto-sheet-body'
          direction: UP
- extendedWaitUntil:
    visible:
      id: 'gasto-categoria-Insumos'
    timeout: 5000
# The chip tap lands with the keyboard still up: the body sets
# keyboardShouldPersistTaps, so the chip resolves the press.
- tapOn: { id: 'gasto-categoria-Insumos' }
- waitForAnimationToEnd
# guardar lives in the sheet's pinned footer — no scroll can hide it.
- extendedWaitUntil:
    visible:
      id: 'gasto-guardar'
    timeout: 5000
- tapOn: { id: 'gasto-guardar' }
- extendedWaitUntil: { notVisible: { id: 'registrar-gasto-sheet' }, timeout: 8000 }

# The new row heads the list, red and negative, with its categoría chip.
# The row's concepto text is not asserted: the driver drops characters
# while typing into that field, so only the amount is stable.
- extendedWaitUntil: { visible: { text: ".*−\\$350\\.00.*" }, timeout: 10000 }
- assertVisible: '.*Insumos.*'
