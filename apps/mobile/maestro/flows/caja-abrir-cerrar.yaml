# Caja open/close lifecycle E2E.
#
# Verifies:
#   1. Caja opens (or confirms Director's opening) → status card visible
#   2. Tap "Cerrar turno" → blind count step 1 → step 2 → close
#
# Precondition: demo mode seeded.
# x-entrypoint: demo
appId: mx.cachink.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Ensure caja is open (handles demo state where Director opened it).
- runFlow: shared/ensure-caja-open.yaml

# Status card should be visible showing the turn is open.
- assertVisible:
    id: "caja-status-card"
- assertVisible:
    id: "caja-balance-card"

# --- Happy path: Close caja ---
- tapOn:
    id: "caja-cerrar-btn"

# Step 1: BlindCountStep — enter count without seeing expected.
- extendedWaitUntil:
    visible:
      id: "cerrar-caja-step-1"
    timeout: 5000

# Enter 500 via numpad (matching amount).
- tapOn: { id: "numpad-5" }
- tapOn: { id: "numpad-0" }
- tapOn: { id: "numpad-0" }
- tapOn:
    id: "blind-count-continue"

# Step 2: CountResultStep — comparison + close.
- extendedWaitUntil:
    visible:
      id: "cerrar-caja-step-2"
    timeout: 5000
- tapOn:
    id: "count-result-close"
