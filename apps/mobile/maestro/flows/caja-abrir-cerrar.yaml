# Mi turno → Cierre → Turno cerrado (Track M, M-09; MvTurno, MvCierre,
# MvCierreHecho).
#
# Verifies:
#   1. With a turno open (fondo $500), Mi turno shows «Efectivo que debe haber»
#   2. «Cerrar turno» opens Cierre with the expected cash
#   3. Counting one $500 bill cuadra; «Cerrar turno» closes
#   4. «¡Turno cerrado!» with the corte, «Mandar el corte a …» and «Salir»
#
# Precondition: demo mode seeded, the operator's turno not yet open or open
# with no sales (the count assumes the $500 fondo alone).
# x-entrypoint: demo
appId: mx.xangarro.mobile
tags:
  - caja
  - cierre
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- runFlow: shared/ensure-caja-open.yaml

- assertVisible:
    id: 'mi-turno-esperado'
- tapOn:
    id: 'turno-cerrar'

- extendedWaitUntil:
    visible:
      id: 'cierre-esperado'
    timeout: 8000
- tapOn:
    id: 'conteo-billete-500-mas'
- assertVisible:
    id: 'cierre-diferencia-cuadra'
- scrollUntilVisible:
    element:
      id: 'cierre-cerrar'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'cierre-cerrar'

- extendedWaitUntil:
    visible:
      id: 'cierre-hecho'
    timeout: 8000
- assertVisible:
    id: 'cierre-corte'
- assertVisible:
    id: 'cierre-compartir'
- tapOn:
    id: 'cierre-salir'
