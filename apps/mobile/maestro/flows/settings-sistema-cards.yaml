# Settings → Sistema — assert key cards on the Sistema sub-screen.
#
# Verifies:
#   - settings-language-card (language selector)
#   - settings-notifications-toggle
#   - export-datos-card (exportar datos action)
#   - settings-check-for-updates (buscar actualizaciones)
#
# Precondition: wizard complete.
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Open Settings via Otros → Configuración.
- runFlow: shared/navigate-to-settings.yaml

# Navigate to the Sistema sub-screen.
- tapOn:
    id: "settings-hub-sistema"
- extendedWaitUntil:
    visible: "Sistema"
    timeout: 5000

# Assert the language card is visible.
- assertVisible:
    id: "settings-language-card"

# Assert the notifications toggle is visible.
- assertVisible:
    id: "settings-notifications-toggle"

# Scroll to and assert export datos card.
- scrollUntilVisible:
    element:
      id: "export-datos-card"
    direction: DOWN
    timeout: 5000
- assertVisible:
    id: "export-datos-card"

# Scroll to and assert check for updates button.
- scrollUntilVisible:
    element:
      id: "settings-check-for-updates"
    direction: DOWN
    timeout: 5000
- assertVisible:
    id: "settings-check-for-updates"
