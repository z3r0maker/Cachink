# Mi turno (Track M, M-09; board MvTurno): the /turno tab says the turno —
# the head, the yellow hero with the cash that must be in the drawer (its
# parts folded under «Ver de dónde sale»), Ventas and Cobrado, «Lo de tu
# turno»'s rows with their live chips (the due recurrente on Gastos, which
# opens Gastos with it), and the fixed foot with «Cerrar turno».
#
# Precondition: device activated against the mock; one cash venta captured so
# the figures carry data (Taco al pastor, $25.00).
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/login-operator.yaml
- runFlow: shared/ensure-caja-open.yaml
- runFlow: shared/create-venta.yaml

# The tab. The cabeza names the operator, the opening time and the day
# (packages/ui/src/screens/Turno/mi-turno-cabeza.tsx).
- tapOn:
    id: 'tab-turno|rail-turno|sidebar-turno'
- extendedWaitUntil:
    visible:
      id: 'mobile-turno'
    timeout: 10000
- assertVisible: '.*Toni, desde las.*'

# Hero: the figure once, what it is for, and its parts folded.
- assertVisible:
    id: 'turno-hero'
- assertVisible:
    id: 'turno-debe-haber'
- assertVisible: '.*Es lo que debes contar cuando cierres tu turno.*'
- assertNotVisible:
    id: 'turno-desglose'
# «Ver de dónde sale» unfolds the parts and «Debe haber»; tapped again, folds.
- tapOn:
    id: 'turno-ver-desglose'
- extendedWaitUntil:
    visible:
      id: 'turno-desglose'
    timeout: 5000
- assertVisible: '.*Fondo de caja.*'
- assertVisible: '.*Ventas en efectivo.*'
- assertVisible: '.*Debe haber.*'
- assertVisible:
    id: 'turno-desglose-total'
- tapOn:
    id: 'turno-ver-desglose'
- assertNotVisible:
    id: 'turno-desglose'

# The two figures (mi-turno-cifras.tsx; copy from kpisMiTurno, caja/turno).
- assertVisible:
    id: 'turno-cifras'
- assertVisible: '.*Todos los métodos.*'
- assertVisible: '.*Ninguna cancelada.*'

# The foot, fixed over the tab bar: the close and, on the phone, the lock.
- assertVisible:
    id: 'turno-cerrar-mi-turno'

# «Lo de tu turno»: the rows to the stack routes, inside the scroll
# (shared/open-turno-row.yaml addresses them one by one).
- scrollUntilVisible:
    element:
      id: 'turno-rows'
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 60
- assertVisible:
    id: 'otros-gastos'
- assertVisible:
    id: 'otros-fiado'
- assertVisible:
    id: 'otros-inventario'
- scrollUntilVisible:
    element:
      id: 'otros-no-enviados'
    direction: DOWN
    timeout: 8000
    visibilityPercentage: 60
    centerElement: true
- assertVisible:
    id: 'otros-avisos'
# The queue's chip: everything sent, or how many wait.
- assertVisible:
    id: 'otros-no-enviados'
    text: '.*(Todo enviado|por enviar).*'

# «¿Algo no funciona?» (RpPuerta, M-23): the report sheet's row, before
# «Ajustes de la caja». With nothing waiting it says its own line.
- scrollUntilVisible:
    element:
      id: 'otros-reportar'
    direction: DOWN
    timeout: 8000
    visibilityPercentage: 60
    centerElement: true
- assertVisible:
    id: 'otros-reportar'
    text: '.*¿Algo no funciona\?.*'

# A due recurrente (mock fixture REC-1 «Renta local», due on this month's
# 1st, contracts/mock/fixtures.ts) chips the Gastos row: by name when it is
# the only one due, by count when there are more.
- scrollUntilVisible:
    element:
      id: 'otros-gastos'
    direction: UP
    timeout: 8000
    centerElement: true
- assertVisible:
    id: 'otros-gastos'
    text: '.*(Atrasado|vence hoy|por pagar).*'
# The row opens Gastos, where the due recurrente waits with its «Registrar»
# (gastos-pagar-recurrente.yaml pays it).
- tapOn:
    id: 'otros-gastos'
- extendedWaitUntil:
    visible:
      id: 'mobile-gastos'
    timeout: 10000
- assertVisible: '.*Renta local.*'
