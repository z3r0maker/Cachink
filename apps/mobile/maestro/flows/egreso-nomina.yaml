# Create a Nómina egreso for a synced empleado (A-16).
# Employees come from the portal; the mock business has "Ana — Cajera".
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

- tapOn:
    id: 'tab-gastos'
- tapOn:
    id: 'egresos-nuevo'
- tapOn:
    id: 'egreso-tab-nomina'

- assertVisible:
    id: 'nomina-empleado'
- tapOn:
    id: 'nomina-empleado'
- tapOn: 'Ana — Cajera'
- assertVisible:
    id: 'nomina-monto'
- tapOn:
    id: 'nomina-submit'

- assertNotVisible: 'Nuevo pago'
- assertVisible: '.*Nómina Ana.*'
