# Sell multiple units by tapping the same product 3 times.
#
# Verifies:
#   1. Tap product 3x → the tile badge and the bar show 3
#   2. Checkout → sale recorded with qty=3
#
# Precondition: demo mode seeded (products + users exist).
# x-entrypoint: demo
appId: mx.xangarro.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- runFlow: shared/ensure-caja-open.yaml

# Navigate to the Ventas tab (Operativo role).
- tapOn:
    id: 'tab-cobrar'
- extendedWaitUntil:
    visible:
      id: 'ventas-product-grid'
    timeout: 5000

# Tap the same product 3 times to set qty=3.
- tapOn: 'Agregar Quesadilla,.*'
- tapOn: 'Agregar Quesadilla,.*'
- tapOn: 'Agregar Quesadilla,.*'

# The bar shows the three pieces.
- assertVisible:
    id: 'cobrar-bar'
- assertVisible: '3 piezas ·'
- runFlow: shared/cobrar-ticket.yaml

# Back on Cobrar with an empty ticket.
- extendedWaitUntil:
    visible:
      id: 'ventas-product-grid'
    timeout: 5000
