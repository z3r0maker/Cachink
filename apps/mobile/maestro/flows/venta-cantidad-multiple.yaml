# Sell multiple units by tapping the same product 3 times.
#
# Verifies:
#   1. Tap product 3x → cart shows qty=3
#   2. Checkout → sale recorded with qty=3
#
# Precondition: demo mode seeded (products + users exist).
appId: mx.cachink.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
- runFlow: shared/ensure-caja-open.yaml

# Navigate to the Ventas tab (Operativo role).
- tapOn:
    id: "tab-ventas"
- extendedWaitUntil:
    visible:
      id: "ventas-product-grid"
    timeout: 5000

# Tap the same product 3 times to set qty=3.
- tapOn: "Quesadilla"
- tapOn: "Quesadilla"
- tapOn: "Quesadilla"

# Cart strip should show the item.
- assertVisible:
    id: "cart-strip"

# Checkout with Efectivo (default).
- tapOn:
    id: "cart-checkout-btn"
- extendedWaitUntil:
    visible:
      id: "checkout-method-picker"
    timeout: 5000
- tapOn:
    id: "checkout-method-continue"

# Cash entry screen — tap a quick amount and submit.
- extendedWaitUntil:
    visible:
      id: "checkout-efectivo"
    timeout: 5000
- tapOn: "\\$100"
- tapOn:
    id: "checkout-efectivo-submit"

# Returns to Ventas — sale appears.
- extendedWaitUntil:
    visible:
      id: "ventas-product-grid"
    timeout: 10000
