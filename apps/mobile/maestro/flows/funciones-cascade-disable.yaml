# Feature flag cascade: disabling stock cascades children OFF.
#
# Verifies:
#   1. Toggle conversionMateriaPrima ON (requires stock ON — default)
#   2. Toggle merma ON
#   3. Toggle auditoriaInventario ON
#   4. Toggle stock OFF → all three children auto-disable
#   5. Verify: conversionMateriaPrima OFF, merma OFF, auditoriaInventario OFF
#
# Precondition: wizard + director-setup complete, logged in as Director.
# Stock flag is ON by default.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/funciones-cascade-disable.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to Otros → Funciones.
- tapOn:
    id: "tab-otros"
- scrollUntilVisible:
    element:
      id: "otros-funciones"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "otros-funciones"

# Verify Funciones screen renders.
- assertVisible:
    id: "funciones-negocio"

# --- Enable children that depend on stock ---

# Toggle conversionMateriaPrima ON.
- tapOn:
    id: "flag-conversionMateriaPrima-switch"

# Toggle merma ON.
- tapOn:
    id: "flag-merma-switch"

# Toggle auditoriaInventario ON.
- tapOn:
    id: "flag-auditoriaInventario-switch"

# --- Disable stock → all children auto-disable ---
- tapOn:
    id: "flag-stock-switch"

# --- Verify all children are now OFF ---
# After disabling stock, the child flags should have auto-toggled OFF.
# Navigate away and back to verify persisted state.
- tapOn:
    id: "tab-otros"
- scrollUntilVisible:
    element:
      id: "otros-funciones"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "otros-funciones"

# The switches should now be OFF (we can't directly assert switch state,
# but we can verify the UX impact: navigating to Productos should not
# show stock-dependent sub-tabs).
- tapOn:
    id: "tab-otros"
- tapOn:
    id: "otros-productos"

# Stock sub-tab hidden (stock OFF).
- assertNotVisible:
    id: "productos-tab-stock"

# Merma tab hidden (merma OFF).
- assertNotVisible:
    id: "tab-merma"

# Re-enable stock for subsequent flows.
- tapOn:
    id: "tab-otros"
- scrollUntilVisible:
    element:
      id: "otros-funciones"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "otros-funciones"
- tapOn:
    id: "flag-stock-switch"
