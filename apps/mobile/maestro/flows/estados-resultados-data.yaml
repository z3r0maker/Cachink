# Estado de Resultados with actual data — verify computed rows render.
#
# Verifies:
#   1. Navigate to Estados → Resultados
#   2. estado-resultados-rows visible (NOT estado-resultados-empty)
#   3. estado-row-ingresos visible
#   4. estado-row-gastos-operativos visible
#   5. estado-utilidad-neta-hero visible
#   6. waterfall-chart visible
#
# Precondition: wizard complete, at least one venta + one egreso exist
# so financial data is non-empty. Director role.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/inventario-producto.yaml
#   maestro test apps/mobile/maestro/flows/venta-efectivo.yaml
#   maestro test apps/mobile/maestro/flows/egreso-gasto.yaml
#   maestro test apps/mobile/maestro/flows/estados-resultados-data.yaml
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate-director.yaml

# Navigate to the Estados tab (Director role).
- tapOn:
    id: "tab-estados"

# Verify EstadosShell renders.
- assertVisible:
    id: "estados-shell"

# Resultados is the default sub-tab.
- assertVisible:
    id: "estados-tab-resultados"

# --- Verify data rows render (not empty state) ---
- assertVisible:
    id: "estado-resultados-rows"

# Verify individual row sections.
- assertVisible:
    id: "estado-row-ingresos"
- assertVisible:
    id: "estado-row-gastos-operativos"

# Verify the utilidad neta hero card.
- assertVisible:
    id: "estado-utilidad-neta-hero"

# Verify the waterfall chart renders.
- assertVisible:
    id: "waterfall-chart"

# Gap Q (Phase 17): When ISR is configured, verify the ISR disclaimer
# renders its "Configurar en ajustes" link below the estado.
- assertVisible:
    id: "isr-disclaimer-settings"
    optional: true
