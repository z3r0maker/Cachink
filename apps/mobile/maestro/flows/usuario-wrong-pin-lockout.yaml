# Multiple wrong PIN attempts — error messages + recovery link.
#
# Verifies:
#   1. On QuickSwitch, enter wrong PIN multiple times via numpad
#   2. Error messages appear each time (shake + haptic fire too)
#   3. forgot-pin-link visible after failures
#
# Precondition: wizard + director-setup complete, app relaunched.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/usuario-wrong-pin-lockout.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml

# QuickSwitchScreen should be showing.
- extendedWaitUntil:
    visible:
      id: "quick-switch"
    timeout: 10000

# --- Attempt 1: Wrong PIN (999991) via numpad ---
- tapOn:
    id: "numpad-9"
- tapOn:
    id: "numpad-9"
- tapOn:
    id: "numpad-9"
- tapOn:
    id: "numpad-9"
- tapOn:
    id: "numpad-9"
- tapOn:
    id: "numpad-1"

# Error message should appear.
- assertVisible: "PIN incorrecto"

# --- Attempt 2: Wrong PIN (999992) via numpad ---
- tapOn:
    id: "numpad-9"
- tapOn:
    id: "numpad-9"
- tapOn:
    id: "numpad-9"
- tapOn:
    id: "numpad-9"
- tapOn:
    id: "numpad-9"
- tapOn:
    id: "numpad-2"

# Error message still visible.
- assertVisible: "PIN incorrecto"

# --- Attempt 3: Wrong PIN (999993) via numpad ---
- tapOn:
    id: "numpad-9"
- tapOn:
    id: "numpad-9"
- tapOn:
    id: "numpad-9"
- tapOn:
    id: "numpad-9"
- tapOn:
    id: "numpad-9"
- tapOn:
    id: "numpad-3"

# Error message still visible.
- assertVisible: "PIN incorrecto"

# Forgot PIN link should be visible after multiple failures.
- assertVisible:
    id: "forgot-pin-link"
