# Delete a payment from its detail popover (tap row → Eliminar) — the
# alternative to swipe-to-delete. The flow creates its own uniquely named
# payment first.
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml
# Create the gasto this flow edits/deletes (no demo data on an activated device).
# A payment with a name no other flow uses, so "gone after delete" is meaningful
# on the shared device.
- runFlow:
    file: shared/create-gasto.yaml
    env:
      CONCEPTO: 'Pago a borrar popover'
      MONTO: '123'
- assertVisible: '.*Pago a borrar popover.*'

- tapOn: '.*Pago a borrar popover.*'
- assertVisible:
    id: 'egreso-detail-popover'

- tapOn:
    id: 'egreso-detail-delete'

- assertNotVisible:
    id: 'egreso-detail-popover'
- assertNotVisible: '.*Pago a borrar popover.*'
