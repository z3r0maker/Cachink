# Cierre con sobrante (M-09, J4-25's other half): count more than the
# expected, the diferencia turns blue with its own hint, a motivo is still
# required, the close button names the sobrante, and the hecho screen says
# «Sobrante» with the motivo in its line (caja/src/cierre/copy.ts).
#
# Precondition: activated device, turno open with the $500 fondo
# (shared/ensure-caja-open.yaml), nothing else captured (expected = fondo).
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/login-operator.yaml
- runFlow: shared/ensure-caja-open.yaml
- tapOn:
    id: 'tab-turno|rail-turno|sidebar-turno'
- extendedWaitUntil:
    visible:
      id: 'turno-cerrar-mi-turno'
    timeout: 10000
- tapOn:
    id: 'turno-cerrar-mi-turno'
- extendedWaitUntil:
    visible:
      id: 'mobile-cierre'
    timeout: 10000

# Count a $500 and a $100 bill: $600 of the $500 expected → $100 over.
- tapOn:
    id: 'conteo-mas-billete-500'
- tapOn:
    id: 'conteo-mas-billete-100'

# Sobra (DIF.sobra): its own hint, and the close still waits on a motivo.
- scrollUntilVisible:
    element:
      id: 'cierre-diferencia'
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 60
- assertVisible: '.*Sobra.*'
- assertVisible: '.*Hay más efectivo del esperado\..*'
- scrollUntilVisible:
    element:
      id: 'cierre-cerrar-turno'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- assertVisible: '.*Elige un motivo para poder cerrar\..*'

# «Venta no registrada» answers it; the button carries the amount.
- tapOn:
    id: 'cierre-motivo-Venta no registrada'
- scrollUntilVisible:
    element:
      id: 'cierre-cerrar-turno'
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- assertVisible: '.*Cerrar turno con sobrante de \$100\.00.*'
- tapOn:
    id: 'cierre-cerrar-turno'

# Hecho: the «Sobrante» chip, no celebration, the motivo in the line.
- extendedWaitUntil:
    visible:
      id: 'cierre-hecho'
    timeout: 10000
- assertVisible: '.*Sobrante.*'
- assertVisible: '.*Turno cerrado.*'
- assertVisible: '.*Con un sobrante de \$100\.00\..*'
- assertVisible: '.*Quedó un sobrante explicado como «Venta no registrada»\..*'
