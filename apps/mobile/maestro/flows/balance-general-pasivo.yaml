# Balance General — assert the Pasivo section renders.
#
# Extends balance-general-all-rows.yaml which covers Activo + Capital
# but never scrolls to the Pasivo section. This flow verifies:
#   - balance-pasivo-empty (when no debts exist)
#   - balance-pasivo-total (when debts exist — optional assertion)
#
# Precondition: wizard complete, ventas + egresos + inventory exist.
# Director role. With no liabilities created, the empty state renders.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/inventario-producto.yaml
#   maestro test apps/mobile/maestro/flows/venta-efectivo.yaml
#   maestro test apps/mobile/maestro/flows/egreso-gasto.yaml
#   maestro test apps/mobile/maestro/flows/balance-general-pasivo.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate-director.yaml

# Navigate to the Estados tab (Director role).
- tapOn:
    id: "tab-estados"

# Switch to the Balance sub-tab.
- tapOn:
    id: "estados-tab-balance"
- extendedWaitUntil:
    visible:
      id: "balance-activo-card"
    timeout: 5000

# Scroll to the Pasivo section.
# With no liabilities in the test data, the empty state shows.
- scrollUntilVisible:
    element:
      id: "balance-pasivo-empty"
    direction: DOWN
    timeout: 5000

# If there were liabilities, balance-pasivo-total would show instead.
# This assertion covers the empty-state branch.
