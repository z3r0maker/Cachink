# Verify the 3-up KPI cards on the Stock screen.
#
# Verifies:
#   1. Navigate to Productos → Stock tab
#   2. stock-kpi-productos visible (total products count)
#   3. stock-kpi-valor visible (inventory value)
#   4. stock-kpi-bajo visible (bajo stock count)
#
# Precondition: wizard complete, at least one product with stock entry.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/inventario-producto.yaml
#   maestro test apps/mobile/maestro/flows/producto-entrada-stock.yaml
#   maestro test apps/mobile/maestro/flows/stock-kpi-strip.yaml
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to the Productos tab.
- tapOn:
    id: "tab-productos"

# Switch to Stock sub-tab.
- tapOn:
    id: "productos-tab-stock"

# Verify the 3 KPI cards render.
- assertVisible:
    id: "stock-kpi-productos"
- assertVisible:
    id: "stock-kpi-valor"
- assertVisible:
    id: "stock-kpi-bajo"
