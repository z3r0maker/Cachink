# The Caja gate: with no turno open, Cobrar says so and opens one right there
# (MvTurnoCerrado); the catalogue then takes the gate's place, no other screen
# in between.
# Precondition: device activated against the mock, no turno open.
# x-entrypoint: activated
appId: mx.xangarro.mobile
tags:
  - ventas
  - caja
  - gate
---
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/login-operator.yaml
- tapOn:
    id: 'tab-cobrar|rail-cobrar|sidebar-cobrar'
- extendedWaitUntil:
    visible:
      id: 'caja-gate-banner'
    timeout: 8000
- assertVisible: 'Abre tu turno para cobrar'
- assertNotVisible:
    id: 'ventas-product-grid'
- runFlow:
    file: shared/abrir-turno-aqui.yaml
    env:
      CTA: 'caja-gate-banner-cta'
- extendedWaitUntil:
    visible:
      id: 'ventas-product-grid'
    timeout: 10000
- assertNotVisible:
    id: 'caja-gate-banner'
