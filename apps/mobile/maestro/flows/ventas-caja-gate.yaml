# Verify the Caja gate blocks venta when caja is not open.
# Precondition: at least one product must exist so the products gate
# doesn't take priority. Product is created by inventario-producto.yaml
# earlier in the regression chain.
# x-entrypoint: wizard
appId: mx.cachink.mobile
tags:
  - ventas
  - caja
  - gate
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to Ventas tab — should show caja gate (product exists, no turno).
- tapOn:
    id: "tab-ventas"
- assertVisible:
    id: "caja-gate-banner"
- assertVisible:
    text: "Abre tu caja para empezar a vender"
- tapOn:
    id: "caja-gate-go-to-caja"
- assertVisible:
    id: "caja-abrir-submit"
