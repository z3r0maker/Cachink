# Verify the Caja gate blocks venta when caja is not open.
# Precondition: at least one product must exist so the products gate
# doesn't take priority. Product is created by inventario-producto.yaml
# earlier in the regression chain.
# x-entrypoint: activated
appId: mx.xangarro.mobile
tags:
  - ventas
  - caja
  - gate
---
# A fresh session has no turno: the Cobrar tab answers with the caja gate,
# and its CTA goes where the turno opens (Mi turno).
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/login-operator.yaml
- tapOn:
    id: 'tab-cobrar'
- extendedWaitUntil:
    visible:
      id: 'caja-gate-banner'
    timeout: 8000
- assertVisible: 'Abre tu caja para empezar a vender'
