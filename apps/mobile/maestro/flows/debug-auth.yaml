# Debug flow: full auth + verify home screen
appId: mx.cachink.mobile
---
- launchApp
- assertVisible: "Selecciona tu usuario"
- tapOn: "J, Juan Director, Director"
- extendedWaitUntil:
    visible:
      id: "pin-numpad"
    timeout: 5000
# Small pause to let the numpad animation settle
- waitForAnimationToEnd
- tapOn:
    id: "numpad-0"
- tapOn:
    id: "numpad-0"
- tapOn:
    id: "numpad-0"
- tapOn:
    id: "numpad-0"
- tapOn:
    id: "numpad-0"
- tapOn:
    id: "numpad-0"
- extendedWaitUntil:
    visible:
      id: "tab-ventas"
    timeout: 10000
