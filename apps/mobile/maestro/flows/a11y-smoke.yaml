# Accessibility smoke: the shell's landmark elements are exposed to the
# accessibility tree (Maestro reads the same tree VoiceOver uses).
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

- assertVisible:
    id: 'top-bar-left'
- assertVisible:
    id: 'top-bar-open-settings'
- assertVisible:
    id: 'bottom-tab-bar'
- assertVisible: 'Ventas'
- assertVisible: 'Caja'
- assertVisible: 'Gastos'
- assertVisible: 'Productos'
