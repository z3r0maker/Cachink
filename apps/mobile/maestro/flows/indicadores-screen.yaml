# Indicadores KPI cards render — verify core KPI cards.
#
# Verifies:
#   1. Navigate to Estados → Indicadores tab
#   2. Core margin KPI cards visible
#   3. Scroll to reveal lower KPI cards
#
# Precondition: wizard complete, Director role.
# Some cards may show "Sin datos" if no transactions exist.
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate-director.yaml

# Navigate to the Estados tab (Director role).
- tapOn:
    id: "tab-estados"

# Verify EstadosShell renders.
- extendedWaitUntil:
    visible:
      id: "estados-shell"
    timeout: 5000

# Switch to the Indicadores sub-tab.
- tapOn:
    id: "estados-tab-indicadores"
- extendedWaitUntil:
    visible:
      id: "indicadores-screen"
    timeout: 5000

# Verify top KPI cards render.
- assertVisible:
    id: "indicador-margen-bruto"
- assertVisible:
    id: "indicador-margen-operativo"
- assertVisible:
    id: "indicador-margen-neto"

# Scroll to reveal lower KPI cards.
- scrollUntilVisible:
    element:
      id: "indicador-liquidez"
    direction: DOWN
    timeout: 5000
- assertVisible:
    id: "indicador-liquidez"

- scrollUntilVisible:
    element:
      id: "indicador-rotacion"
    direction: DOWN
    timeout: 5000
- assertVisible:
    id: "indicador-rotacion"

- scrollUntilVisible:
    element:
      id: "indicador-dias-cobranza"
    direction: DOWN
    timeout: 5000
- assertVisible:
    id: "indicador-dias-cobranza"
