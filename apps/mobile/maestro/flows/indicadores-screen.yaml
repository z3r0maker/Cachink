# Indicadores KPI cards render — verify all 6 core KPI cards.
#
# Verifies:
#   1. Navigate to Estados → Indicadores tab
#   2. indicador-margen-bruto visible
#   3. indicador-margen-operativo visible
#   4. indicador-margen-neto visible
#   5. indicador-liquidez visible
#   6. indicador-rotacion visible
#   7. indicador-dias-cobranza visible
#
# Precondition: wizard complete, at least one venta + one egreso exist.
# Director role.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/inventario-producto.yaml
#   maestro test apps/mobile/maestro/flows/venta-efectivo.yaml
#   maestro test apps/mobile/maestro/flows/egreso-gasto.yaml
#   maestro test apps/mobile/maestro/flows/indicadores-screen.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate-director.yaml

# Navigate to the Estados tab (Director role).
- tapOn:
    id: "tab-estados"

# Verify EstadosShell renders.
- assertVisible:
    id: "estados-shell"

# Switch to the Indicadores sub-tab.
- tapOn:
    id: "estados-tab-indicadores"
- extendedWaitUntil:
    visible:
      id: "estados-tab-indicadores"
    timeout: 3000

# --- Verify all 6 KPI cards render ---
- assertVisible:
    id: "indicador-margen-bruto"
- assertVisible:
    id: "indicador-margen-operativo"
- assertVisible:
    id: "indicador-margen-neto"
- assertVisible:
    id: "indicador-liquidez"
- assertVisible:
    id: "indicador-rotacion"
- assertVisible:
    id: "indicador-dias-cobranza"
