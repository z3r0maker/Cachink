# Create an empleado with periodo set to "Quincenal" instead of default.
# Covers Gap D (Phase 17): empleado-periodo testID during creation.
#
# testIDs exercised:
#   empleado-periodo
#
# Precondition: wizard complete, operativo role.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/egreso-nomina-periodo.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to Egresos → Nuevo → Nómina tab.
- tapOn:
    id: "tab-gastos"
- tapOn:
    id: "egresos-nuevo"
- tapOn:
    id: "egreso-tab-nomina"

# No empleados yet — Crear empleado Btn appears.
- assertVisible: "Crear empleado"
- tapOn:
    id: "nomina-crear-empleado"

# Fill empleado form with all fields.
- tapOn:
    id: "empleado-nombre"
- inputText: "Luis García"
- tapOn:
    id: "empleado-puesto"
- inputText: "Mesero"
- tapOn:
    id: "empleado-salario"
- inputText: "4000"

# Change periodo from default to Quincenal.
- assertVisible:
    id: "empleado-periodo"
- tapOn:
    id: "empleado-periodo"
- tapOn: "Quincenal"

# Submit the empleado.
- tapOn:
    id: "empleado-submit"

# Back on Nómina tab; empleado auto-selected + monto auto-filled.
- assertVisible: "Nuevo egreso"
- tapOn:
    id: "nomina-submit"

# Modal closes + egreso visible.
- assertNotVisible: "Nuevo egreso"
- assertVisible: "Nómina Luis García"
