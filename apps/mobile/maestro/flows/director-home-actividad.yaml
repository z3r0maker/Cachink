# Director Home → Actividad Reciente shows latest transactions.
#
# Verifies:
#   1. Precondition: at least one venta + egreso exist
#   2. Navigate to Director Home
#   3. actividad-reciente section visible
#   4. actividad-reciente-list visible (contains entries)
#
# Precondition: wizard complete, at least one venta + one egreso exist.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/inventario-producto.yaml
#   maestro test apps/mobile/maestro/flows/venta-efectivo.yaml
#   maestro test apps/mobile/maestro/flows/egreso-gasto.yaml
#   maestro test apps/mobile/maestro/flows/director-home-actividad.yaml
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate-director.yaml

# Director Home should be showing with data from precondition flows.
- assertVisible:
    id: "director-home-route"

# Verify the Actividad Reciente section is visible.
- assertVisible:
    id: "actividad-reciente"

# Verify the list contains entries.
- assertVisible:
    id: "actividad-reciente-list"
