# First-run happy path: welcome → negocio → DirectorSetup.
#
# Covers P1C-M1-T01 (role picker), P1C-M2-T04 (mode stored in
# AppConfig), P1C-M2-T05 (business creation form), Phase 13
# DirectorSetup gate.
#
# Review items #1/#2: the wizard's device/cloud questions are no
# longer part of first run — a fresh install hydrates mode='local'
# and goes straight from the welcome carousel to the business form.
# The wizard itself is still covered, from its new home in
# Configuración → Sistema, by wizard-rerun-with-data.yaml and friends.
#
# Precondition: fresh install. Run via the wrapper script:
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
# x-entrypoint: fresh
appId: mx.cachink.mobile
---
- launchApp

# launch → ¡Bienvenido a Cachink! → Comenzar → business form.
- runFlow: shared/first-run-onboarding.yaml

- tapOn:
    id: "business-nombre"
- inputText: "Taquería Don Pedro"

# BusinessForm now sits inside a KeyboardAwareForm (review item #3), so
# the submit button is reachable with the keyboard open — tap it
# directly instead of relying on the Return-key chain. Both paths work;
# tapping is what a user actually does.
- hideKeyboard
- tapOn:
    id: "business-submit"

# DirectorSetup (replaces old RolePicker step)
- runFlow: shared/director-setup.yaml

# After DirectorSetup, user is auto-logged in as Director.
# Verify the Director Home renders (tab-estados visible).
- assertVisible:
    id: "tab-estados"
