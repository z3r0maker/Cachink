# Products are create-only on the device (A-09): quick-add asks nombre,
# código, categoría, precio and stock tracking; the detail page is read-only
# (no Guardar, no Eliminar) with Entrada/Salida and a pointer to the portal.
#
# Precondition: device activated against the mock (activation.yaml).
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
# Products are create-only on the device (A-09): Cobrar's catalogue opens the
# «Producto nuevo» sheet — nombre and precio the minimum — and Agregar saves
# it AND puts it on the ticket. The door on a seeded catalogue is a search
# with no matches (the Vacio state carries the button).
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/login-operator.yaml
- runFlow: shared/ensure-caja-open.yaml
- tapOn:
    id: 'tab-cobrar'
- extendedWaitUntil:
    visible:
      id: 'ventas-product-grid'
    timeout: 8000
- tapOn:
    id: 'cobrar-search'
- inputText: 'zzz'
- hideKeyboard
- tapOn:
    text: 'Producto nuevo'
- extendedWaitUntil:
    visible:
      id: 'producto-nuevo-sheet'
    timeout: 5000
# The sheet is still settling onto the keyboard-avoiding layout when it first
# appears; typing into that moving field drops keystrokes ('Jugo'
# landed as 'Agu fesca'). Let the sheet finish before touching the form.
- waitForAnimationToEnd
- waitForAnimationToEnd
- tapOn:
    id: 'producto-nuevo-nombre'
# Letters drop in the field's focus race («mineral» once landed as «miear»)
# — settle, type, then read the field back before anything is saved.
- waitForAnimationToEnd
- inputText: 'Jugo'
- assertVisible:
    id: 'producto-nuevo-nombre'
    text: '.*Jugo.*'
- hideKeyboard
- tapOn:
    id: 'producto-nuevo-precio'
- inputText: '18'
# hideKeyboard alone leaves the OS keyboard up and Agregar's tap lands on a
# key instead (the form then never submits) — one drag dismisses it for real.
- swipe:
    start: '50%,45%'
    end: '50%,25%'
- waitForAnimationToEnd
# The button says whether the form is complete; a digit dropped in the
# precio's focus race leaves it on the disabled wording.
- assertVisible:
    text: '.*Agregar y ponerlo en el ticket.*'
- tapOn:
    id: 'producto-nuevo-agregar'
# The sheet's SCRIM keeps the `producto-nuevo-sheet` prefix when the form is
# gone, so the close is asserted on the form's own field.
- extendedWaitUntil:
    notVisible: { id: 'producto-nuevo-nombre' }
    timeout: 15000
# The catalogue was filtered to the nonsense search that opened the door;
# clear it and the new product's tile carries the folded label.
- tapOn:
    id: 'cobrar-search'
- eraseText
- hideKeyboard
# The tile lands below the fold on the alphabetical grid, and the list
# refilters as the search clears — wait it out, then find the tile.
- waitForAnimationToEnd
- scrollUntilVisible:
    element: { text: '.*Agregar Jugo, \\$18\\.00.*' }
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 60
    centerElement: true
- assertVisible: '.*Agregar Jugo, \\$18\\.00.*'
