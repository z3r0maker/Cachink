# Navigate to the Merma Reportes placeholder screen via Otros grid.
#
# Extends funciones-toggle.yaml which tests merma ON/OFF but never
# visits the reportes route:
#   - merma-reportes-placeholder
#
# Precondition: wizard complete, merma flag enabled, Director role.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/otros-merma-reportes-nav.yaml
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Enable the merma flag (Director → Otros → Funciones).
- tapOn:
    id: "tab-otros"
- tapOn:
    id: "otros-funciones"
- tapOn:
    id: "flag-merma-switch"
    optional: true

# Navigate to Otros → tap the Merma Reportes grid item.
- tapOn:
    id: "tab-otros"
- tapOn:
    id: "otros-merma-reportes"

# Verify the placeholder screen renders.
- extendedWaitUntil:
    visible:
      id: "merma-reportes-placeholder"
    timeout: 5000
