# Inventario with nothing tracked (Track M, M-09; MvInventario): the caja
# doesn't manage products, so the empty state says the owner stocks the
# catalogue in the portal; there is no «create product» action here.
#
# Precondition: fresh install with the wizard complete but no tracked products.
# x-entrypoint: demo
appId: mx.xangarro.mobile
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate-wizard.yaml
- runFlow:
    file: shared/open-turno-row.yaml
    env:
      ROW: 'otros-inventario'
- assertVisible:
    id: 'inventario-vacio'
- assertVisible: 'Sin productos con existencias'
