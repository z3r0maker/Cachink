# Verify the Productos empty state renders correctly when no
# products exist yet. The "Crear tu primer producto" CTA appears.
#
# Covers the empty-state path: fresh wizard → Productos tab →
# EmptyProductos component renders.
#
# Precondition: fresh install with wizard complete but NO products.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/empty-productos.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals (ConsentModal, etc.)
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to the Productos tab.
- tapOn:
    id: "tab-productos"

# No products registered yet — EmptyProductos renders.
- assertVisible:
    id: "empty-productos"

# The CTA button to create the first product should be visible.
- assertVisible:
    id: "empty-productos-cta"
