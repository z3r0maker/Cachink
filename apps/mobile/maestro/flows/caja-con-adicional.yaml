# Open with a larger fondo and close with it counted by denomination
# (Track M, M-09). The old «adicional» field is gone: the fondo sheet takes
# one amount (M-06); Cierre counts it bill by bill.
#
# Verifies:
#   1. Open turno with $700 via the fondo sheet
#   2. Mi turno's «Efectivo que debe haber» and its parts
#   3. Cierre: one $500 and one $200 bill cuadra; close
#
# Precondition: demo mode seeded, the operator's turno not yet open.
# x-entrypoint: demo
appId: mx.xangarro.mobile
tags:
  - caja
  - cierre
---
- launchApp
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

- tapOn:
    id: 'tab-turno'
- tapOn:
    id: 'inicio-hero-accion'
- extendedWaitUntil:
    visible:
      id: 'abrir-caja-modal'
    timeout: 5000
- tapOn: { id: 'numpad-7' }
- tapOn: { id: 'numpad-0' }
- tapOn: { id: 'numpad-0' }
- tapOn:
    id: 'caja-abrir-submit'

- extendedWaitUntil:
    visible:
      id: 'mi-turno-esperado'
    timeout: 8000
- tapOn:
    id: 'mi-turno-desglose'
- assertVisible:
    id: 'esperado-desglose'

- tapOn:
    id: 'turno-cerrar'
- extendedWaitUntil:
    visible:
      id: 'cierre-esperado'
    timeout: 8000
- tapOn:
    id: 'conteo-billete-500-mas'
- tapOn:
    id: 'conteo-billete-200-mas'
- assertVisible:
    id: 'cierre-diferencia-cuadra'
- scrollUntilVisible:
    element:
      id: 'cierre-cerrar'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'cierre-cerrar'
- extendedWaitUntil:
    visible:
      id: 'cierre-hecho'
    timeout: 8000
