# Open caja with larger amount (replaces old "adicional" field).
#
# Caja Overhaul: The separate `caja-adicional-monto` field no longer
# exists. The AbrirCajaModal now takes a single amount via numpad.
# This flow enters a larger total (700) that previously would have
# been 500 base + 200 adicional.
#
# Verifies:
#   1. Navigate to Caja → enter 700 via numpad → submit
#   2. Status card shows correct open turn
#   3. Close caja with matching count (cleanup)
#
# Precondition: wizard + director-setup complete, caja feature flag ON.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/funciones-toggle.yaml
#   maestro test apps/mobile/maestro/flows/caja-con-adicional.yaml
# x-entrypoint: wizard
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/authenticate.yaml

# Navigate to Otros → Caja.
- tapOn:
    id: "tab-otros"
- scrollUntilVisible:
    element:
      id: "otros-caja"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "otros-caja"

# The abrir-caja-modal should appear.
- extendedWaitUntil:
    visible:
      id: "abrir-caja-modal"
    timeout: 5000

# Enter total opening amount (700) via numpad.
# Previously this was 500 base + 200 adicional; now it's a single entry.
- tapOn: { id: "numpad-7" }
- tapOn: { id: "numpad-0" }
- tapOn: { id: "numpad-0" }

# Submit the apertura.
- tapOn:
    id: "caja-abrir-submit"

# Status card should be visible showing the turn is open.
- assertVisible:
    id: "caja-status-card"

# Close the caja for cleanup (2-step blind count).
- tapOn:
    id: "caja-cerrar-btn"

# Step 1: BlindCountStep — enter matching count of 700.
- assertVisible:
    id: "cerrar-caja-step-1"
- tapOn: { id: "numpad-7" }
- tapOn: { id: "numpad-0" }
- tapOn: { id: "numpad-0" }
- tapOn:
    id: "blind-count-continue"

# Step 2: CountResultStep — no discrepancy, close immediately.
- assertVisible:
    id: "cerrar-caja-step-2"
- tapOn:
    id: "count-result-close"
