# Inventario's search (Track M, M-09; MvInventario): typing filters the
# Existencias list, and a name with no product says so.
#
# Precondition: signed in, a tracked product "Tortilla".
# x-entrypoint: activated
appId: mx.xangarro.mobile
---
# Inventario's search (MvInventario): typing filters the Existencias list,
# and a name with no product says so in the board's words.
- runFlow: shared/dismiss-modals.yaml
- runFlow: shared/login-operator.yaml
- runFlow:
    file: shared/open-turno-row.yaml
    env:
      ROW: 'otros-inventario'
- extendedWaitUntil:
    visible:
      id: 'mobile-inventario'
    timeout: 8000
- tapOn:
    id: 'inventario-buscar'
- inputText: 'pastor'
- hideKeyboard
- assertVisible:
    id: 'inventario-cantidad-01JPRD00000000000000000001'
# A name with no product: the list says so, still inside the panel.
- tapOn:
    id: 'inventario-buscar'
- eraseText
- inputText: 'xyzsinproductoss'
- hideKeyboard
- assertVisible: '.*Ningún producto coincide.*'
