# Acceso (Track M, M-06): a wrong NIP says so and empties the dots; the
# right one opens the caja on Inicio.
#
# Precondition: an activated device, nobody signed in, the contracts mock's
# operators (Toni 1234).
#
# Run:
#   maestro test apps/mobile/maestro/flows/quick-switch-login.yaml
appId: mx.xangarro.mobile
---
- launchApp

- runFlow: shared/dismiss-modals.yaml

- extendedWaitUntil:
    visible:
      id: 'quick-switch'
    timeout: 10000

- assertVisible: '¿Quién va a cobrar?'
- tapOn:
    text: 'Toni'
- assertVisible: '.*Qué onda, Toni.*'

- tapOn: { id: 'numpad-9' }
- tapOn: { id: 'numpad-9' }
- tapOn: { id: 'numpad-9' }
- tapOn: { id: 'numpad-9' }
- tapOn: { id: 'nip-enviar' }

- extendedWaitUntil:
    visible:
      id: 'nip-error'
    timeout: 10000
- assertVisible: '.*Ese NIP no es.*'

- tapOn: { id: 'numpad-1' }
- tapOn: { id: 'numpad-2' }
- tapOn: { id: 'numpad-3' }
- tapOn: { id: 'numpad-4' }
- tapOn: { id: 'nip-enviar' }

- extendedWaitUntil:
    visible:
      id: 'mobile-inicio-tab'
    timeout: 10000
