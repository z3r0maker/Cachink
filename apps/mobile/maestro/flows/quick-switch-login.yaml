# QuickSwitch authentication E2E — login via avatar + PIN.
#
# Verifies:
#   1. Happy: tap avatar → enter PIN via numpad → tabs mount
#   2. Edge: wrong PIN → error message visible + shake animation
#
# Precondition: wizard + director-setup complete, app relaunched.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/quick-switch-login.yaml
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml

# QuickSwitchScreen should be showing (subsequent launch after setup).
- extendedWaitUntil:
    visible:
      id: "quick-switch"
    timeout: 10000

# --- Edge case: wrong PIN (via inline numpad) ---
- tapOn:
    id: "numpad-9"
- tapOn:
    id: "numpad-9"
- tapOn:
    id: "numpad-9"
- tapOn:
    id: "numpad-9"
- tapOn:
    id: "numpad-9"
- tapOn:
    id: "numpad-9"

# Error message should appear (shake + haptic fire too, visual-only).
- assertVisible: "PIN incorrecto"

# --- Happy path: correct PIN (via inline numpad) ---
- tapOn:
    id: "numpad-1"
- tapOn:
    id: "numpad-2"
- tapOn:
    id: "numpad-3"
- tapOn:
    id: "numpad-4"
- tapOn:
    id: "numpad-5"
- tapOn:
    id: "numpad-6"

# Tabs mount — Director Home renders.
- extendedWaitUntil:
    visible:
      id: "tab-estados"
    timeout: 10000
