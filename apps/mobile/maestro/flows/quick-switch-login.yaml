# QuickSwitch authentication E2E — login via avatar + PIN.
#
# Verifies:
#   1. Happy: tap avatar → enter PIN → tabs mount
#   2. Edge: wrong PIN → error message visible
#
# Precondition: wizard + director-setup complete, app relaunched.
# Chain flows:
#
#   ./apps/mobile/maestro/scripts/fresh-install.sh \
#       apps/mobile/maestro/flows/wizard-local-standalone.yaml
#   maestro test apps/mobile/maestro/flows/quick-switch-login.yaml
appId: mx.cachink.mobile
---
- launchApp

# Dismiss any first-launch modals.
- runFlow: shared/dismiss-modals.yaml

# QuickSwitchScreen should be showing (subsequent launch after setup).
- extendedWaitUntil:
    visible:
      id: "quick-switch"
    timeout: 10000

# --- Edge case: wrong PIN ---
- tapOn:
    id: "pin-input"
- inputText: "999999"
- tapOn:
    id: "login-submit"

# Error message should appear.
- assertVisible: "PIN incorrecto"

# --- Happy path: correct PIN ---
- tapOn:
    id: "pin-input"
- inputText: "123456"
- tapOn:
    id: "login-submit"

# Tabs mount — Director Home renders.
- extendedWaitUntil:
    visible:
      id: "tab-estados"
    timeout: 10000
